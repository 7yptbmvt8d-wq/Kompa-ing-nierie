  <script>
    /* Thème choisi (Paramètres › Apparence), gardé sur le compte et appliqué avant l'affichage. */
    (function () {
      var serveur = 'THEME_SERVEUR', t = /^(neon|kompa)$/.test(serveur) ? serveur : '';
      try { if (!t) t = localStorage.getItem('ka.theme') || ''; else localStorage.setItem('ka.theme', t); } catch (e) { /* indisponible */ }
      if (t === 'neon') document.documentElement.setAttribute('data-theme', 'neon');
    })();
  </script>

    /* Vue smartphone : décidée avant tout affichage (AppMobile.html). Choix « Version ordinateur » mémorisé. */
    (function () {
      var petit = (window.screen && screen.width <= 760) || window.innerWidth <= 760, vue = '';
      try { vue = localStorage.getItem('ka.vue') || ''; } catch (e) { /* indisponible */ }
      if (petit && vue !== 'ordinateur') document.body.classList.add('mode-mobile');
      if (petit) document.body.classList.add('ecran-petit');
    })();
  </script>
