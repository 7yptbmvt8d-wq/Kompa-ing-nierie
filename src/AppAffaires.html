<script>
/* Kompa Affaires — lot 2 : écrans Affaires (colonnes, liste) et fiche affaire. */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$, $$ = K.$$;

  var etat = { vue: 'colonnes', clotures: true, meta: null };
  try {
    etat.vue = localStorage.getItem('ka.vue') || 'colonnes';
    etat.clotures = localStorage.getItem('ka.clotures') !== '0'; // affichées par défaut
  } catch (e) { /* stockage indisponible : valeurs par défaut */ }
  function memoriser(cle, v) { try { localStorage.setItem(cle, v); } catch (e) { /* sans effet */ } }

  // ——— Formats ———
  function jour(iso) {
    if (!iso) return '';
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso);
  }
  function aujourdhuiIso() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function joursAvant(iso) {
    if (!iso) return null;
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    var cible = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var auj = new Date(); auj.setHours(0, 0, 0, 0);
    return Math.round((cible - auj) / 86400000);
  }
  function montant(v) { return v === '' || v === null || v === undefined ? '' : K.euros(Number(v)); }
  function pastille(statut) {
    var fam = (etat.meta && etat.meta.familles[statut]) || 'encours';
    var cls = { encours: 'statut--encours', gagnee: 'statut--ok', perdue: 'statut--ko', abandonnee: 'statut--neutre' }[fam];
    return '<span class="statut ' + cls + '">' + esc(statut) + '</span>';
  }
  function badgeDelai(a) {
    if ((etat.meta.actifs || []).indexOf(a.statut) < 0 || a.statut === 'Gagnée') return '';
    var n = joursAvant(a.date_limite_remise);
    if (n === null || a.statut === 'Déposée') return '';
    if (n < 0) return '<span class="statut statut--neutre">échue</span>';
    if (n <= 3) return '<span class="statut statut--alerte">J-' + n + '</span>';
    return '<span class="mono legende">J-' + n + '</span>';
  }

  // ——— Champs de formulaire génériques ———
  function champHtml(c, valeur, listes, prefixe) {
    var id = (prefixe || 'c') + '-' + c.nom;
    var v = valeur === null || valeur === undefined ? '' : String(valeur);
    var req = c.obligatoire ? ' required aria-required="true"' : '';
    var lab = '<label for="' + id + '">' + esc(c.libelle) + (c.obligatoire ? ' <span aria-hidden="true">*</span>' : '') + '</label>';
    var t = c.type, input;
    var aide = c.aide ? '<p class="champ-aide" id="' + id + '-aide">' + esc(c.aide) + '</p>' : '';
    if (t === 'lecture') {
      return '<div class="champ-bloc"><span class="champ-libelle">' + esc(c.libelle) + '</span>' + aide + '<div class="champ-lecture mono">' + (v ? esc(v) : '<span class="vide">—</span>') + '</div></div>';
    } else if (t === 'long') {
      input = '<textarea class="champ" id="' + id + '" data-champ="' + c.nom + '" rows="3"' + req + '>' + esc(v) + '</textarea>';
    } else if (t === 'date') {
      input = '<input class="champ mono" type="date" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v.slice(0, 10)) + '"' + req + '>';
    } else if (t === 'nombre' || t === 'euros') {
      input = '<input class="champ mono num" type="text" inputmode="decimal" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v) + '"' + req + '>';
      if (t === 'euros') input = '<div class="champ-unite">' + input + '<span aria-hidden="true">€</span></div>';
    } else if (t === 'lien') {
      input = '<div class="champ-lien"><input class="champ" type="url" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v) + '" placeholder="https://…"' + req + '>' +
        (v ? '<a class="bouton bouton--discret" href="' + esc(v) + '" target="_blank" rel="noopener" data-externe>Ouvrir</a>' : '') + '</div>';
    } else if (t.indexOf('liste:') === 0 || t.indexOf('choix:') === 0) {
      var opts = t.indexOf('liste:') === 0 ? (listes[t.slice(6)] || []) : t.slice(6).split('|');
      if (v && opts.indexOf(v) < 0) opts = opts.concat([v]);
      input = '<select class="champ" id="' + id + '" data-champ="' + c.nom + '"' + req + '><option value=""></option>' +
        opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    } else {
      input = '<input class="champ" type="text" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v) + '"' + req + '>';
    }
    var attrs = (c.aide ? 'aria-describedby="' + id + '-aide" ' : '') + (c.exemple && t !== 'lien' ? 'placeholder="' + esc('ex. ' + c.exemple) + '" ' : '');
    input = input.replace('data-champ="', attrs + 'data-champ="');
    return '<div class="champ-bloc' + (t === 'long' ? ' champ-bloc--large' : '') + '">' + lab + aide + input + '</div>';
  }
  /** Total des jours de « Jours par tranche » (même règle que Affaires_joursTotal_ côté serveur). */
  function joursTotal(texte) {
    return String(texte || '').split(/\r?\n|;/).reduce(function (s, ligne) {
    var m = ligne.match(/(\d+(?:[.,]\d+)?)\s*j(?:ours?|\b|$)/i) || ligne.match(/(\d+(?:[.,]\d+)?)\s*$/);
    return s + (m ? Number(m[1].replace(',', '.')) : 0);
  }, 0);
  }
  function lireChamps(racine) {
    var out = {};
    $$('[data-champ]', racine).forEach(function (el) { out[el.getAttribute('data-champ')] = el.value; });
    return out;
  }
  // ——— Boîte de dialogue ———
  function dialogue(titreTxt, corps, libelleOk, surValider) {
    var d = document.createElement('dialog');
    d.className = 'dialogue';
    d.innerHTML = '<form method="dialog" novalidate><h2>' + esc(titreTxt) + '</h2><div class="dialogue__corps">' + corps + '</div>' +
      '<div class="dialogue__erreur" role="alert" hidden></div>' +
      '<div class="dialogue__actions"><button type="button" class="bouton bouton--discret" data-annuler>Annuler</button>' +
      '<button type="submit" class="bouton">' + esc(libelleOk) + '</button></div></form>';
    document.body.appendChild(d);
    var form = $('form', d), err = $('.dialogue__erreur', d), ok = $('button[type=submit]', d);
    var fermer = function () { d.close(); d.remove(); };
    $('[data-annuler]', d).addEventListener('click', fermer);
    d.addEventListener('cancel', function () { d.remove(); });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var manquant = $$('[required]', form).filter(function (el) { return !String(el.value).trim(); })[0];
      if (manquant) { err.textContent = 'Champ obligatoire : ' + $('label[for="' + manquant.id + '"]', form).textContent.replace('*', '').trim(); err.hidden = false; manquant.focus(); return; }
      ok.disabled = true; err.hidden = true;
      Promise.resolve(surValider(form)).then(fermer).catch(function (e) {
        ok.disabled = false; err.textContent = e.message || String(e); err.hidden = false;
      });
    });
    d.showModal();
    var premier = $('input, select, textarea', form);
    if (premier) premier.focus();
    return d;
  }

  /** Changement de statut avec les champs demandés par la règle de passage. */
  function passerStatut(a, statut, apres) {
    var champs = (etat.meta.passage[statut] || []).map(function (c) {
      var v = a[c.nom];
      if ((v === '' || v === undefined || v === null) && c.defaut) {
        v = c.defaut === 'aujourdhui' ? aujourdhuiIso() : (c.defaut.charAt(0) === '=' ? a[c.defaut.slice(1)] : c.defaut);
      }
      return champHtml(c, v, etat.meta.listes, 'p');
    }).join('');
    var corps = '<p class="legende">' + esc(a.id) + ' · ' + esc(a.acheteur) + ' : ' + esc(a.statut) + ' → <strong>' + esc(statut) + '</strong></p>' +
      '<div class="form-grille">' + champs +
      '<div class="champ-bloc champ-bloc--large"><label for="p-commentaire">Commentaire (historique)</label><textarea class="champ" id="p-commentaire" rows="2"></textarea></div></div>';
    dialogue('Passer en « ' + statut + ' »', corps, 'Valider', function (form) {
      var valeurs = lireChamps(form);
      return K.appel('apiAffaireStatut', a.id, statut, valeurs, $('#p-commentaire', form).value).then(function (fiche) {
        K.toast(a.id + ' : ' + statut + '.');
        if (apres) apres(fiche);
      });
    });
  }

  function nouvelleAffaire() {
    var meta = etat.meta;
    var tous = {};
    meta.blocs.forEach(function (b) { b.champs.forEach(function (c) { tous[c.nom] = c; }); });
    var corps = '<div class="form-grille">' + meta.creation.map(function (n) { return champHtml(tous[n], '', meta.listes, 'n'); }).join('') + '</div>';
    dialogue('Nouvelle affaire', corps, 'Créer', function (form) {
      return K.appel('apiAffaireCreer', lireChamps(form)).then(function (a) {
        K.toast('Affaire ' + a.id + ' créée.');
        K.afficher('affaire/' + a.id, true);
      });
    });
  }

  // ——— Écran Affaires ———
  function ecranAffaires(el) {
    el.innerHTML = K.titre('Affaires', '') + '<div class="chargement">Lecture des affaires…</div>';
    K.charger('affaires', 'apiAffaires', [], function (r) {
      etat.meta = r.meta;
      rendreAffaires(el, r.affaires);
    }, function (e) { el.innerHTML = K.titre('Affaires', '') + K.bandeauErreur(e); });
  }

  function rendreAffaires(el, affaires) {
    var meta = etat.meta;
    var statuts = meta.statuts.filter(function (s) { return etat.clotures || meta.actifs.indexOf(s) >= 0; });
    var parStatut = {};
    statuts.forEach(function (s) { parStatut[s] = []; });
    affaires.forEach(function (a) { if (parStatut[a.statut]) parStatut[a.statut].push(a); });
    Object.keys(parStatut).forEach(function (s) {
      parStatut[s].sort(function (x, y) { return String(x.date_limite_remise || '9').localeCompare(String(y.date_limite_remise || '9')); });
    });
    var nbClotures = affaires.filter(function (a) { return meta.actifs.indexOf(a.statut) < 0; }).length;

    var barre = '<div class="barre-outils">' +
      '<button type="button" class="bouton" data-action="nouvelle">Nouvelle affaire</button>' +
      '<div class="bascule" role="group" aria-label="Vue">' +
        '<button type="button" class="bouton bouton--discret" data-vue="colonnes" aria-pressed="' + (etat.vue === 'colonnes') + '">Colonnes</button>' +
        '<button type="button" class="bouton bouton--discret" data-vue="liste" aria-pressed="' + (etat.vue === 'liste') + '">Liste</button></div>' +
      '<label class="case"><input type="checkbox" data-action="clotures"' + (etat.clotures ? ' checked' : '') + '> Afficher les affaires clôturées (' + nbClotures + ')</label>' +
      '</div>';

    var corps;
    if (!affaires.length) {
      corps = '<div class="bandeau">Aucune affaire. Créez la première avec « Nouvelle affaire » ; les avis de la veille arriveront au lot 3.</div>';
    } else if (etat.vue === 'liste') {
      var lignes = [];
      statuts.forEach(function (s) { lignes = lignes.concat(parStatut[s]); });
      corps = '<div class="tableau-conteneur"><table class="table-affaires"><thead><tr>' +
        '<th scope="col">N°</th><th scope="col">Acheteur</th><th scope="col">Objet</th><th scope="col">Statut</th>' +
        '<th scope="col">Remise</th><th scope="col" class="num">Montant HT</th><th scope="col" class="num">Score</th></tr></thead><tbody>' +
        lignes.map(function (a) {
          return '<tr data-ouvrir="' + esc(a.id) + '" tabindex="0">' +
            '<td class="mono">' + esc(a.id) + '</td><td>' + esc(a.acheteur) + '</td><td class="objet-court">' + esc(a.objet) + '</td>' +
            '<td>' + pastille(a.statut) + '</td><td class="mono">' + jour(a.date_limite_remise) + ' ' + badgeDelai(a) + '</td>' +
            '<td class="num mono">' + montant(a.montant_notifie || a.montant_ht) + '</td>' +
            '<td class="num mono">' + esc(a.score_final || a.pre_score || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      // Une colonne par statut en cours, puis une colonne unique « Clôturées » (statut affiché sur chaque carte).
      var colonnes = meta.actifs.map(function (s) {
        return { cle: s, titre: pastille(s), cartes: parStatut[s] || [] };
      });
      if (etat.clotures) {
        var clotures = affaires.filter(function (a) { return meta.actifs.indexOf(a.statut) < 0; })
          .sort(function (x, y) { return String(y.date_statut).localeCompare(String(x.date_statut)); });
        colonnes.push({ cle: COLONNE_CLOTUREES, titre: '<span class="colonne__nom">Clôturées</span>', cartes: clotures });
      }
      corps = '<div class="colonnes" style="--nb-colonnes:' + colonnes.length + '">' + colonnes.map(function (c) {
        return '<section class="colonne" data-statut="' + esc(c.cle) + '" aria-label="' + esc(c.cle) + '">' +
          '<h2 class="colonne__titre">' + c.titre + ' <span class="mono legende">' + c.cartes.length + '</span></h2>' +
          '<div class="colonne__cartes">' + c.cartes.map(carte).join('') + '</div></section>';
      }).join('') + '</div>' +
      '<p class="legende">Glisser une carte vers une autre colonne pour changer de statut ; seules les colonnes autorisées s\'activent.</p>';
    }

    el.innerHTML = K.titre('Affaires', affaires.length + ' affaire' + (affaires.length > 1 ? 's' : '')) + barre + corps;

    $('[data-action="nouvelle"]', el).addEventListener('click', nouvelleAffaire);
    $('[data-action="clotures"]', el).addEventListener('change', function (ev) {
      etat.clotures = ev.target.checked; memoriser('ka.clotures', etat.clotures ? '1' : '0'); rendreAffaires(el, affaires);
    });
    $$('[data-vue]', el).forEach(function (b) {
      b.addEventListener('click', function () { etat.vue = b.getAttribute('data-vue'); memoriser('ka.vue', etat.vue); rendreAffaires(el, affaires); });
    });
    $$('[data-ouvrir]', el).forEach(function (n) {
      var ouvrir = function () { K.afficher('affaire/' + n.getAttribute('data-ouvrir'), true); };
      n.addEventListener('click', function (ev) { if (!ev.target.closest('a')) ouvrir(); });
      n.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ouvrir(); });
    });
    if (affaires.length && etat.vue === 'colonnes') brancherGlisser(el, affaires);
  }

  var COLONNE_CLOTUREES = 'Clôturées';

  function carte(a) {
    var cloturee = etat.meta.actifs.indexOf(a.statut) < 0;
    return '<article class="carte-affaire" draggable="' + (!cloturee || (etat.meta.transitions[a.statut] || []).length > 0) + '" data-id="' + esc(a.id) + '" data-ouvrir="' + esc(a.id) + '" tabindex="0">' +
      '<div class="carte-affaire__tete"><span class="mono">' + esc(a.id) + '</span>' + (cloturee ? pastille(a.statut) : badgeDelai(a)) + '</div>' +
      '<div class="carte-affaire__acheteur">' + esc(a.acheteur) + (a.departement ? ' <span class="mono legende">(' + esc(a.departement) + ')</span>' : '') + '</div>' +
      '<div class="carte-affaire__objet">' + esc(a.objet) + '</div>' +
      '<div class="carte-affaire__pied mono">' +
        (a.date_limite_remise ? '<span>Remise ' + jour(a.date_limite_remise) + '</span>' : '<span></span>') +
        '<span>' + montant(a.montant_notifie || a.montant_ht) + '</span></div>' +
      '</article>';
  }

  function brancherGlisser(el, affaires) {
    var enCours = null;
    $$('.carte-affaire', el).forEach(function (c) {
      c.addEventListener('dragstart', function (ev) {
        enCours = affaires.filter(function (a) { return a.id === c.getAttribute('data-id'); })[0];
        ev.dataTransfer.setData('text/plain', enCours.id);
        ev.dataTransfer.effectAllowed = 'move';
        var permis = etat.meta.transitions[enCours.statut] || [];
        $$('.colonne', el).forEach(function (col) {
          var s = col.getAttribute('data-statut');
          var ok = s === COLONNE_CLOTUREES ? clotureesPermises(enCours).length > 0 : permis.indexOf(s) >= 0;
          col.classList.toggle('est-cible', ok);
          col.classList.toggle('est-interdite', !ok && s !== enCours.statut);
        });
      });
      c.addEventListener('dragend', function () {
        $$('.colonne', el).forEach(function (col) { col.classList.remove('est-cible', 'est-interdite', 'est-survolee'); });
      });
    });
    $$('.colonne', el).forEach(function (col) {
      col.addEventListener('dragover', function (ev) {
        if (col.classList.contains('est-cible')) { ev.preventDefault(); col.classList.add('est-survolee'); }
      });
      col.addEventListener('dragleave', function () { col.classList.remove('est-survolee'); });
      col.addEventListener('drop', function (ev) {
        ev.preventDefault();
        if (!enCours || !col.classList.contains('est-cible')) return;
        var statut = col.getAttribute('data-statut');
        var a = enCours;
        var apres = function (fiche) {
          ['statut', 'date_statut', 'montant_ht', 'montant_notifie', 'score_final'].forEach(function (k) { a[k] = fiche.affaire[k]; });
          rendreAffaires($('#ecran'), affaires);
        };
        K.appel('apiAffaire', a.id).then(function (f) {
          if (statut !== COLONNE_CLOTUREES) return passerStatut(f.affaire, statut, apres);
          var choix = clotureesPermises(a);
          if (choix.length === 1) return passerStatut(f.affaire, choix[0], apres);
          choisirCloture(f.affaire, choix, apres);
        }).catch(function (e) { K.toast(e.message, true); });
      });
    });
  }

  /** Statuts de clôture accessibles depuis le statut de l'affaire (ex. Déposée → Perdue, Sans suite). */
  function clotureesPermises(a) {
    return (etat.meta.transitions[a.statut] || []).filter(function (s) { return etat.meta.actifs.indexOf(s) < 0; });
  }

  function choisirCloture(a, choix, apres) {
    var corps = '<p class="legende">' + esc(a.id) + ' · ' + esc(a.acheteur) + '</p><div class="choix-statut">' +
      choix.map(function (s, i) {
        return '<label class="case"><input type="radio" name="cloture" value="' + esc(s) + '"' + (i === 0 ? ' checked' : '') + '> ' + pastille(s) + '</label>';
      }).join('') + '</div>';
    dialogue('Clôturer l\'affaire', corps, 'Continuer', function (form) {
      var s = $('input[name=cloture]:checked', form).value;
      setTimeout(function () { passerStatut(a, s, apres); }, 0);
    });
  }

  // ——— Fiche affaire : deux volets (Appel d'offres, Mission) et leurs sous-onglets ———
  // Organisation validée le 18/11/2026 (maquette). Chaque sous-onglet montre ses champs et ses dossiers Drive.
  var VOLETS = [
    { id: 'ao', titre: 'Appel d\'offres', etapes: 'En étude → Go → Déposée → Résultat', sous: [
      { id: 'consultation', titre: 'Consultation', blocs: ['identification', 'echeances', 'decision'], dossiers: { etape: 'etude' }, codes: '01-02' },
      { id: 'offre', titre: 'Offre', blocs: ['offre', 'depot'], dossiers: { etape: 'go' }, codes: '03-05' },
      { id: 'resultat', titre: 'Résultat', blocs: ['resultat', 'enseignements'], dossiers: { etape: 'resultat' }, codes: '06' }
    ] },
    { id: 'mission', titre: 'Mission', etapes: 'Gagnée → Soldée', sous: [
      { id: 'livrables', titre: 'Livrables', blocs: [], dossiers: { etape: 'gagnee', rang: 0 }, codes: '07' },
      { id: 'estimations', titre: 'Estimations', blocs: [], dossiers: { etape: 'gagnee', rang: 2 }, codes: '09' },
      { id: 'facturation', titre: 'Facturation', blocs: ['execution'], dossiers: { etape: 'gagnee', rang: 1 }, codes: '08' }
    ] }
  ];
  var EN_MISSION = ['Gagnée', 'Soldée'];
  var choixFiche = { id: '', volet: '', sous: '' };
  var journalOuvert = false;

  /** Volet et sous-onglet de l'étape en cours. */
  function ongletParDefaut(statut) {
    if (EN_MISSION.indexOf(statut) >= 0) return { volet: 'mission', sous: 'livrables' };
    if (['Go', 'Abandonnée'].indexOf(statut) >= 0) return { volet: 'ao', sous: 'offre' };
    if (['Déposée', 'Perdue', 'Sans suite'].indexOf(statut) >= 0) return { volet: 'ao', sous: 'resultat' };
    return { volet: 'ao', sous: 'consultation' };
  }

  function ecranFiche(el, id) {
    el.innerHTML = '<p><a href="#affaires">← Affaires</a></p><div class="chargement">Lecture de l\'affaire…</div>';
    if (choixFiche.id !== id) journalOuvert = false;
    K.charger('affaire:' + id, 'apiAffaire', [id], function (f) {
      etat.meta = f.meta;
      rendreFiche(el, f);
    }, function (e) { el.innerHTML = '<p><a href="#affaires">← Affaires</a></p>' + K.bandeauErreur(e); });
  }

  // ——— Bandeau de synthèse ———
  function joursAvant(iso) {
    var d = new Date(String(iso).slice(0, 10) + 'T00:00:00'), auj = new Date(aujourdhuiIso() + 'T00:00:00');
    return Math.round((d - auj) / 86400000);
  }
  function plusJours(iso, n) {
    var d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function synthese(f) {
    var a = f.affaire, s = a.statut, ech = null;
    var futur = [['Questions', a.date_limite_questions], ['Visite', a.date_visite], ['Remise', a.date_limite_remise]]
      .filter(function (x) { return x[1] && joursAvant(x[1]) >= 0; })
      .sort(function (x, y) { return String(x[1]) < String(y[1]) ? -1 : 1; });
    if (['En étude', 'Go'].indexOf(s) >= 0 && futur.length) ech = futur[0];
    if (s === 'Déposée' && a.date_depot && a.validite_offre_jours) ech = ['Fin de validité', plusJours(a.date_depot, Number(a.validite_offre_jours))];
    var relance = f.relances.filter(function (r) { return r.statut === 'à faire'; })
      .sort(function (x, y) { return String(x.date_prevue) < String(y.date_prevue) ? -1 : 1; })[0];
    var actions = {
      'En étude': 'Analyser le DCE et décider Go ou No-go', 'Go': 'Préparer et déposer l\'offre', 'Déposée': 'Attendre la décision de l\'acheteur',
      'Gagnée': 'Exécuter la mission et facturer', 'Perdue': 'Tirer les enseignements du résultat', 'Sans suite': 'Tirer les enseignements du résultat',
      'Soldée': 'Affaire soldée', 'No-go': 'Aucune : affaire non poursuivie', 'Abandonnée': 'Aucune : affaire abandonnée'
    };
    var action = relance ? esc(relance.type) + ' <span class="jours">' + jour(relance.date_prevue) + '</span>' : esc(actions[s] || '');
    var avancement;
    var lr = f.livrablesResume || { total: 0 };
    if (s === 'Gagnée' && lr.prochain) {
      action = 'Remettre : ' + esc(lr.prochain.libelle) + (lr.prochain.tranche ? ' <span class="jours">' + esc(lr.prochain.tranche) + '</span>' : '');
      if (lr.prochain.date) ech = ['Livrable', lr.prochain.date];
    }
    if (EN_MISSION.indexOf(s) >= 0 && lr.total) avancement = ['Livrables', lr.valides + ' validé' + (lr.valides > 1 ? 's' : '') + ' sur ' + lr.total + ' <span class="jours">· ' + lr.remis + ' remis</span>'];
    else if (EN_MISSION.indexOf(s) >= 0) avancement = ['Facturé', K.euros(f.totaux.facture) + (a.montant_notifie ? ' <span class="jours">/ ' + K.euros(a.montant_notifie) + '</span>' : '')];
    else if (s === 'Déposée' || s === 'Perdue' || s === 'Sans suite') avancement = ['Offre', a.montant_ht ? K.euros(a.montant_ht) + ' HT' : '—'];
    else if ((s === 'Go' || s === 'Abandonnée') && f.piecesResume && f.piecesResume.total) avancement = ['Pièces de l\'offre', f.piecesResume.pretes + ' sur ' + f.piecesResume.total + ' prêtes'];
    else if (s === 'Go' || s === 'Abandonnée') avancement = ['Offre en préparation', a.montant_ht ? K.euros(a.montant_ht) + ' HT' : (a.prix_jour ? K.euros(a.prix_jour) + ' / jour' : 'montant à chiffrer')];
    else avancement = ['Décision', a.decision ? esc(a.decision) + (a.motif_decision ? ' <span class="jours">' + esc(a.motif_decision) + '</span>' : '') : 'à prendre'];
    var score = (a.score_final !== '' && a.score_final !== undefined && a.score_final !== null)
      ? '<span class="mono">' + esc(a.score_final) + '</span> <span class="jours">/ 100 · pré-score ' + esc(a.pre_score === '' ? '—' : a.pre_score) + '</span>'
      : '<span class="mono">' + esc(a.pre_score === '' ? '—' : a.pre_score) + '</span> <span class="jours">pré-score</span>';
    var jn = ech ? joursAvant(ech[1]) : null;
    return '<section class="synthese" aria-label="Synthèse de l\'affaire">' +
      '<div class="synthese__action"><div class="synthese__etiq">Prochaine action</div><div class="synthese__val">' + action + '</div></div>' +
      '<div><div class="synthese__etiq">Échéance</div><div class="synthese__val">' + (ech ? esc(ech[0]) + ' <span class="mono">' + jour(ech[1]) + '</span> <span class="jours">' + (jn === 0 ? 'aujourd\'hui' : 'J-' + jn) + '</span>' : '<span class="vide">—</span>') + '</div></div>' +
      '<div><div class="synthese__etiq">' + avancement[0] + '</div><div class="synthese__val">' + avancement[1] + '</div></div>' +
      '<div><div class="synthese__etiq">Score</div><div class="synthese__val">' + score + '</div></div>' +
    '</section>';
  }

  function rendreFiche(el, f) {
    var a = f.affaire, meta = etat.meta;
    if (choixFiche.id !== a.id || !choixFiche.volet) {
      var d = ongletParDefaut(a.statut);
      choixFiche = { id: a.id, volet: d.volet, sous: d.sous };
    }
    var enMission = EN_MISSION.indexOf(a.statut) >= 0;
    var liens = (a.lien_avis ? '<a class="bouton bouton--discret" href="' + esc(a.lien_avis) + '" target="_blank" rel="noopener" data-externe>Avis</a>' : '') +
      (a.lien_dce ? '<a class="bouton bouton--discret" href="' + esc(a.lien_dce) + '" target="_blank" rel="noopener" data-externe>Dossier Drive</a>' : '');
    var actions = f.transitions.map(function (s) {
      return '<button type="button" class="bouton" data-passer="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');
    var tete = '<p><a href="#affaires">← Affaires</a></p>' +
      '<header class="fiche-tete">' +
        '<div><div class="fiche-tete__ref mono">' + esc(a.id) + ' · ' + pastille(a.statut) + ' <span class="legende">depuis le ' + esc(K.dateHeure(a.date_statut).slice(0, 10)) + '</span></div>' +
        '<h1>' + esc(a.acheteur) + '</h1><p class="fiche-tete__objet">' + esc(a.objet) + '</p></div>' +
        '<div class="fiche-tete__actions">' + liens +
          (actions ? '<div class="fiche-tete__passages" role="group" aria-label="Changer de statut"><span class="legende">Passer en :</span>' + actions + '</div>' : '') +
        '</div>' +
      '</header>' + synthese(f);

    var blocsParId = {};
    meta.blocs.forEach(function (b) { blocsParId[b.id] = b; });
    var formBloc = function (id) {
      var b = blocsParId[id];
      if (!b) return '';
      return '<section class="fiche-bloc"><h2 class="fiche-bloc__titre">' + esc(b.titre) + '</h2>' +
        '<form class="bloc-form" data-bloc="' + b.id + '" novalidate><div class="form-grille">' +
        b.champs.map(function (c) { return champHtml(c, a[c.nom], meta.listes, b.id); }).join('') + '</div>' +
        '<div class="bloc-form__actions"><button type="submit" class="bouton" disabled>Enregistrer</button></div></form></section>';
    };
    var contenu = {
      consultation: function () { return formBloc('identification') + formBloc('echeances') + formBloc('decision'); },
      offre: function () { return blocPiecesOffre(f) + formBloc('offre') + formBloc('depot'); },
      resultat: function () { return formBloc('resultat') + '<section class="fiche-bloc">' + tableCriteres(f.criteres) + '</section>' + formBloc('enseignements'); },
      livrables: function () { return blocLivrables(f) + planningHtml(f, false); },
      estimations: function () { return '<section class="fiche-bloc"><h2 class="fiche-bloc__titre">Estimations des travaux</h2><div data-estimations><div class="chargement">Lecture des estimations…</div></div></section>'; },
      facturation: function () { return planningHtml(f, true) + formBloc('execution') + '<section class="fiche-bloc">' + tableFactures(f) + '</section>'; }
    };

    var volet = VOLETS.filter(function (v) { return v.id === choixFiche.volet; })[0] || VOLETS[0];
    var voletEnCours = enMission ? 'mission' : 'ao';
    var onglets = '<div class="volets" role="tablist" aria-label="Volets de l\'affaire">' + VOLETS.map(function (v) {
      var inactif = v.id === 'mission' && !enMission;
      return '<button type="button" role="tab" class="volet' + (inactif ? ' est-inactif' : '') + '" data-volet="' + v.id + '" aria-selected="' + (v.id === volet.id) + '">' +
        '<span class="volet__nom">' + esc(v.titre) + (v.id === voletEnCours ? '<span class="volet__ici">● étape en cours</span>' : '') + '</span>' +
        '<span class="volet__etapes">' + esc(v.etapes) + '</span></button>';
    }).join('') + '<button type="button" class="bouton bouton--discret volets__journal" data-journal aria-expanded="' + journalOuvert + '">Journal</button></div>';
    var sous = '<div class="sous-onglets" role="tablist" aria-label="' + esc(volet.titre) + '">' + volet.sous.map(function (x) {
      return '<button type="button" role="tab" data-sous="' + x.id + '" aria-selected="' + (x.id === choixFiche.sous) + '">' + esc(x.titre) + ' <span class="sous-onglets__codes">' + x.codes + '</span></button>';
    }).join('') + '</div>';
    var apercu = volet.id === 'mission' && !enMission
      ? '<p class="bandeau">Aperçu : le volet Mission s\'active au passage en Gagnée (notification, livrables, estimations, facturation).</p>' : '';
    var panneaux = volet.sous.map(function (x) {
      return '<section class="panneau" role="tabpanel" id="p-' + x.id + '"' + (x.id === choixFiche.sous ? '' : ' hidden') + '>' +
        contenu[x.id]() +
        '<section class="fiche-bloc"><h2 class="fiche-bloc__titre">Pièces</h2><div data-pieces="' + x.id + '"><div class="chargement">Lecture du dossier Drive…</div></div></section>' +
        '</section>';
    }).join('');
    var tiroir = '<aside class="tiroir-journal" id="tiroir-journal" aria-label="Journal de l\'affaire"' + (journalOuvert ? '' : ' hidden') + '>' +
      '<div class="tiroir-journal__tete"><h2>Journal</h2><button type="button" class="bouton bouton--discret" data-fermer-journal>Fermer</button></div>' + blocJournal(f) + '</aside>';
    el.innerHTML = tete + onglets + sous + apercu + panneaux + tiroir;
    brancherFiche(el, f);
    chargerPieces(el, a);
    var zoneEst = $('[data-estimations]', el);
    if (zoneEst && K.estimationsAffaire) K.estimationsAffaire(zoneEst, a.id);
  }

  // ——— Livrables de la mission ———
  var ETATS_LIVRABLE = ['à faire', 'en cours', 'remis', 'validé'];
  var CLASSES_LIVRABLE = { 'à faire': 'etat-afaire', 'en cours': 'etat-encours', 'remis': 'etat-deposee', 'validé': 'etat-prete' };

  function blocLivrables(f) {
    var lignes = (f.livrables || []).map(function (l) {
      var j = l.date_echeance && (l.etat === 'à faire' || l.etat === 'en cours') ? joursAvant(l.date_echeance) : null;
      return '<tr data-livrable="' + esc(l.id) + '">' +
        '<td><input class="champ mono" data-lc="tranche" value="' + esc(l.tranche) + '" aria-label="Tranche" size="5"></td>' +
        '<td><input class="champ" data-lc="libelle" value="' + esc(l.libelle) + '" aria-label="Livrable"></td>' +
        '<td><input class="champ mono" type="date" data-lc="date_echeance" value="' + esc(String(l.date_echeance || '').slice(0, 10)) + '" aria-label="Échéance">' +
          (j !== null ? '<span class="jours' + (j < 0 ? ' est-retard' : '') + '">' + (j < 0 ? 'retard ' + (-j) + ' j' : j === 0 ? 'aujourd\'hui' : 'J-' + j) + '</span>' : '') + '</td>' +
        '<td><select class="champ etat-piece ' + (CLASSES_LIVRABLE[l.etat] || '') + '" data-lc="etat" aria-label="État">' +
          ETATS_LIVRABLE.map(function (e) { return '<option' + (e === l.etat ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select></td>' +
        '<td><input class="champ mono" data-lc="indice" value="' + esc(l.indice) + '" aria-label="Indice" size="2" placeholder="A"></td>' +
        '<td><div class="cellule-lien"><input class="champ" type="url" data-lc="lien" value="' + esc(l.lien) + '" aria-label="Lien vers le fichier" placeholder="https://drive…">' +
          (l.lien ? '<a href="' + esc(l.lien) + '" target="_blank" rel="noopener" data-externe>Ouvrir</a>' : '') + '</div></td>' +
        '<td><button type="button" class="bouton bouton--discret bouton--petit" data-suppr-livrable aria-label="Retirer « ' + esc(l.libelle) + ' »">Retirer</button></td></tr>';
    }).join('');
    return '<section class="fiche-bloc" id="livrables"><h2 class="fiche-bloc__titre">Livrables par tranche</h2>' +
      ((f.livrables || []).length
        ? '<div class="tableau-conteneur"><table class="table-livrables"><thead><tr><th scope="col">Tranche</th><th scope="col">Livrable</th><th scope="col">Échéance</th><th scope="col">État</th><th scope="col">Indice</th><th scope="col">Fichier</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' + lignes + '</tbody></table></div>'
        : '<p class="vide">Aucun livrable. Ajoutez ceux du CCTP (article « Livrables »), avec leur date de remise contractuelle.</p>') +
      '<p class="legende">Les échéances des livrables à faire ou en cours apparaissent dans l\'Échéancier et l\'e-mail du matin. Modification enregistrée dès que vous quittez le champ.</p>' +
      '<form class="ajout-piece" data-ajout-livrable novalidate>' +
        '<input class="champ mono" id="ajout-liv-tranche" placeholder="TF" aria-label="Tranche" size="5">' +
        '<input class="champ" id="ajout-liv-lib" placeholder="ex. Rapport de diagnostic" aria-label="Intitulé du livrable">' +
        '<input class="champ mono" type="date" id="ajout-liv-date" aria-label="Échéance">' +
        '<button type="submit" class="bouton bouton--discret">Ajouter</button></form></section>';
  }

  function brancherLivrables(el, f, recharger) {
    var a = f.affaire, zone = $('#livrables', el);
    if (!zone) return;
    var appel = function (nom, args, message) {
      return K.appel.apply(null, [nom, a.id].concat(args)).then(function (fiche) { if (message) K.toast(message); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); recharger(f); });
    };
    $$('[data-livrable]', zone).forEach(function (tr) {
      $$('[data-lc]', tr).forEach(function (champ) {
        var initial = champ.value;
        champ.addEventListener('change', function () {
          if (champ.value === initial) return;
          var o = {}; o[champ.getAttribute('data-lc')] = champ.value;
          appel('apiLivrableMaj', [tr.getAttribute('data-livrable'), o], 'Livrable enregistré.');
        });
      });
      $('[data-suppr-livrable]', tr).addEventListener('click', function () { appel('apiLivrableSupprimer', [tr.getAttribute('data-livrable')], 'Livrable retiré.'); });
    });
    $('[data-ajout-livrable]', zone).addEventListener('submit', function (ev) {
      ev.preventDefault();
      var lib = $('#ajout-liv-lib', zone).value.trim();
      if (!lib) { K.toast('Intitulé du livrable obligatoire.', true); return; }
      appel('apiLivrableAjouter', [{ tranche: $('#ajout-liv-tranche', zone).value, libelle: lib, date_echeance: $('#ajout-liv-date', zone).value }], 'Livrable ajouté.');
    });
  }

  // ——— Pièces de l'offre : liste et contrôle avant dépôt ———
  var ETATS_PIECE = ['à faire', 'en cours', 'prête', 'déposée'];
  var CLASSES_ETAT = { 'à faire': 'etat-afaire', 'en cours': 'etat-encours', 'prête': 'etat-prete', 'déposée': 'etat-deposee' };

  function blocPiecesOffre(f) {
    var a = f.affaire, pieces = f.pieces || [], r = f.piecesResume || { total: 0, pretes: 0 };
    var controle = '';
    if (r.total) {
      var depot = a.date_limite_remise ? plusJours(a.date_limite_remise, -2) : '';
      controle = r.pretes === r.total
        ? '<div class="encadre-controle est-complet"><strong>Dossier complet</strong> : ' + r.total + ' pièce' + (r.total > 1 ? 's' : '') + ' prête' + (r.total > 1 ? 's' : '') + (depot ? ', dépôt conseillé le <span class="mono">' + jour(depot) + '</span> (48 h avant l\'heure limite)' : '') + '.</div>'
        : '<div class="encadre-controle"><strong>' + (r.total - r.pretes) + ' pièce' + (r.total - r.pretes > 1 ? 's' : '') + ' à finir</strong> sur ' + r.total + (depot ? ' avant le dépôt conseillé le <span class="mono">' + jour(depot) + '</span>' : '') + '.</div>';
    }
    var lignes = pieces.map(function (p) {
      return '<tr data-piece="' + esc(p.id) + '"><td class="legende">' + esc(p.categorie) + '</td><td>' + esc(p.libelle) + '</td>' +
        '<td><select class="champ etat-piece ' + (CLASSES_ETAT[p.etat] || '') + '" data-etat-piece aria-label="État de « ' + esc(p.libelle) + ' »">' +
        ETATS_PIECE.map(function (e) { return '<option' + (e === p.etat ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select></td>' +
        '<td><button type="button" class="bouton bouton--discret bouton--petit" data-suppr-piece aria-label="Retirer « ' + esc(p.libelle) + ' »">Retirer</button></td></tr>';
    }).join('');
    return '<section class="fiche-bloc" id="pieces-offre"><h2 class="fiche-bloc__titre">Pièces à remettre</h2>' + controle +
      (pieces.length
        ? '<div class="tableau-conteneur"><table class="table-pieces"><thead><tr><th scope="col">Catégorie</th><th scope="col">Pièce</th><th scope="col">État</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' + lignes + '</tbody></table></div>'
        : '<p class="vide">Aucune pièce listée.</p>') +
      '<p class="actions-pieces"><button type="button" class="bouton' + (pieces.length ? ' bouton--discret' : '') + '" data-coller-liste>Coller la liste du DCE</button>' +
      (pieces.length ? '' : ' <button type="button" class="bouton bouton--discret" data-liste-type>Ajouter la liste type</button>') +
      ' <span class="legende">' + (pieces.length ? 'Ajoute les pièces manquantes, sans doublon.' : 'Liste du DCE : rubrique « Pièces à remettre » de l\'analyse du DCE ou du RC. Liste type : pièces courantes (paramètre liste.pieces_offre).') + '</span></p>' +
      '<form class="ajout-piece" data-ajout-piece novalidate><select class="champ" id="ajout-piece-cat" aria-label="Catégorie"><option>Candidature</option><option selected>Offre</option></select>' +
      '<input class="champ" id="ajout-piece-lib" placeholder="ex. Mémoire environnemental (démarche RSE)" aria-label="Intitulé de la pièce">' +
      '<button type="submit" class="bouton bouton--discret">Ajouter</button></form></section>';
  }

  function brancherPiecesOffre(el, f, recharger) {
    var a = f.affaire, zone = $('#pieces-offre', el);
    if (!zone) return;
    var appel = function (nom, args, message) {
      return K.appel.apply(null, [nom, a.id].concat(args)).then(function (fiche) { if (message) K.toast(message); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); recharger(f); });
    };
    var lt = $('[data-liste-type]', zone);
    if (lt) lt.addEventListener('click', function () { lt.disabled = true; appel('apiPiecesOffreListeType', [], 'Liste type ajoutée.'); });
    $('[data-coller-liste]', zone).addEventListener('click', function () { dialogueCollerListe(a, recharger); });
    $$('[data-etat-piece]', zone).forEach(function (sel) {
      sel.addEventListener('change', function () {
        sel.className = 'champ etat-piece ' + (CLASSES_ETAT[sel.value] || '');
        appel('apiPieceOffreMaj', [sel.closest('tr').getAttribute('data-piece'), { etat: sel.value }]);
      });
    });
    $$('[data-suppr-piece]', zone).forEach(function (b) {
      b.addEventListener('click', function () { b.disabled = true; appel('apiPieceOffreSupprimer', [b.closest('tr').getAttribute('data-piece')], 'Pièce retirée.'); });
    });
    $('[data-ajout-piece]', zone).addEventListener('submit', function (ev) {
      ev.preventDefault();
      var lib = $('#ajout-piece-lib', zone).value.trim();
      if (!lib) { K.toast('Intitulé de la pièce obligatoire.', true); return; }
      appel('apiPieceOffreAjouter', [{ categorie: $('#ajout-piece-cat', zone).value, libelle: lib }], 'Pièce ajoutée.');
    });
  }

  function dialogueCollerListe(a, recharger) {
    var d = document.createElement('dialog');
    d.className = 'dialogue';
    d.innerHTML = '<form method="dialog" novalidate><h2>Coller la liste des pièces</h2>' +
      '<p class="legende">Une pièce par ligne. Une ligne « Candidature » ou « Offre » seule vaut pour les lignes qui suivent ; on peut aussi écrire « Candidature : DC1 ». Sans précision : Offre. Les puces, cases et numéros sont ignorés ; les pièces déjà listées ne sont pas ajoutées deux fois.</p>' +
      '<textarea class="champ mono" id="coller-liste" rows="12" aria-label="Liste des pièces" placeholder="Candidature\nDC1 ou DUME\nDC2\nAttestation d\'assurance RC professionnelle\nOffre\nActe d\'engagement\nMémoire technique\nBPU"></textarea>' +
      '<div class="dialogue__actions"><button type="button" class="bouton bouton--discret" data-fermer>Annuler</button><button type="submit" class="bouton">Ajouter les pièces</button></div></form>';
    document.body.appendChild(d);
    var fermer = function () { d.close(); d.remove(); };
    d.querySelector('[data-fermer]').addEventListener('click', fermer);
    d.addEventListener('cancel', function () { d.remove(); });
    d.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var texte = d.querySelector('#coller-liste').value;
      if (!texte.trim()) { K.toast('Collez au moins une pièce.', true); return; }
      var b = d.querySelector('button[type=submit]'); b.disabled = true;
      K.appel('apiPiecesOffreColler', a.id, texte).then(function (fiche) {
        var c = fiche.collage || { ajoutees: 0, doublons: 0 };
        fermer();
        K.toast(c.ajoutees + ' pièce' + (c.ajoutees > 1 ? 's' : '') + ' ajoutée' + (c.ajoutees > 1 ? 's' : '') + (c.doublons ? ' (' + c.doublons + ' déjà listée' + (c.doublons > 1 ? 's' : '') + ')' : '') + '.');
        recharger(fiche);
      }).catch(function (e) { b.disabled = false; K.toast(e.message, true); });
    });
    d.showModal();
    d.querySelector('#coller-liste').focus();
  }

  // ——— Pièces : dossiers Drive de l'affaire, rangés par sous-onglet ———
  function taille(o) {
    o = Number(o) || 0;
    return o >= 1048576 ? (o / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(o / 1024)) + ' Ko';
  }

  function sousOnglet(id) {
    var r = null;
    VOLETS.forEach(function (v) { v.sous.forEach(function (x) { if (x.id === id) r = x; }); });
    return r;
  }

  /** Dossiers d'un sous-onglet ; les dossiers sans étape connue (et les fichiers à la racine) vont dans Consultation. */
  function dossiersDe(id, p) {
    var x = sousOnglet(id);
    return p.dossiers.filter(function (d) {
      if (!d.etape) return id === 'consultation';
      return d.etape === x.dossiers.etape && (x.dossiers.rang === undefined || d.rang === x.dossiers.rang);
    });
  }

  function chargerPieces(el, a) {
    if (!$('[data-pieces]', el)) return;
    K.charger('pieces:' + a.id, 'apiPieces', [a.id], function (p) { rendreToutesPieces(el, a, p); },
      function (e) { $$('[data-pieces]', el).forEach(function (z) { z.innerHTML = K.bandeauErreur(e); }); });
  }

  function rendreToutesPieces(el, a, p) {
    $$('[data-pieces]', el).forEach(function (zone) { rendrePieces(zone, a, p, el); });
  }

  function rendrePieces(zone, a, p, el) {
    var id = zone.getAttribute('data-pieces');
    var dossiers = dossiersDe(id, p);
    var choixActuel = ($('[data-dossier]', zone) || {}).value;
    if (!dossiers.length) {
      var etapes = { etude: 'à la création de l\'affaire', go: 'au passage en Go', resultat: 'au résultat (Gagnée, Perdue ou Sans suite)', gagnee: 'au passage en Gagnée' };
      zone.innerHTML = '<p class="vide">' + (p.url ? 'Ces dossiers seront créés ' + etapes[sousOnglet(id).dossiers.etape] + '.' : 'Pas encore de dossier Drive pour cette affaire.') + '</p>';
      return;
    }
    var listes = dossiers.map(function (d) {
      return '<section class="pieces__dossier"><h3><a href="' + esc(d.url) + '" target="_blank" rel="noopener" data-externe>' +
        esc(d.nom || 'Dossier de l\'affaire') + '</a> <span class="legende">' + d.fichiers.length + ' fichier' + (d.fichiers.length > 1 ? 's' : '') + '</span></h3>' +
        (d.fichiers.length ? '<ul class="pieces__liste">' + d.fichiers.map(function (x) {
          return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener" data-externe>' + esc(x.nom) + '</a>' +
            ' <span class="legende mono">' + esc(x.date) + ' · ' + taille(x.taille) + '</span></li>';
        }).join('') + '</ul>' : '') + '</section>';
    }).join('');
    zone.innerHTML = formDepot(id, dossiers, p, choixActuel) + '<div class="pieces">' + listes + '</div>';
    brancherDepot(zone, a, p, el);
  }

  function formDepot(id, dossiers, p, choixActuel) {
    var noms = dossiers.map(function (d) { return d.nom; });
    var choisi = noms.indexOf(choixActuel) >= 0 ? choixActuel : (noms.indexOf(p.parDefaut) >= 0 ? p.parDefaut : noms[0]);
    var options = dossiers.map(function (d) {
      return '<option value="' + esc(d.nom) + '"' + (d.nom === choisi ? ' selected' : '') + '>' + esc(d.nom || 'Dossier de l\'affaire') + '</option>';
    }).join('');
    return '<div class="depot" data-depot>' +
      (dossiers.length > 1 ? '<div class="depot__ligne"><label for="piece-dossier-' + id + '">Ranger dans</label> <select class="champ" id="piece-dossier-' + id + '" data-dossier>' + options + '</select></div>'
        : '<input type="hidden" data-dossier value="' + esc(choisi) + '">') +
      '<label class="depot__zone" for="piece-fichiers-' + id + '"><input type="file" id="piece-fichiers-' + id + '" multiple class="depot__input">' +
        '<span><strong>Glissez vos fichiers ici</strong> ou <span class="lien">cliquez pour les choisir</span>' + (dossiers.length === 1 ? ' — rangés dans « ' + esc(choisi || 'Dossier de l\'affaire') + ' »' : '') + '</span>' +
        '<span class="legende">' + Math.round(p.tailleMax / 1048576) + ' Mo maximum par fichier' + (p.url ? ' · au-delà, <a href="' + esc(p.url) + '" target="_blank" rel="noopener" data-externe>ouvrez le dossier Drive</a>' : '') + '</span></label>' +
      '<p class="depot__etat legende" aria-live="polite"></p></div>';
  }

  function brancherDepot(zone, a, p, el) {
    var depot = $('[data-depot]', zone);
    var input = $('input[type=file]', zone);
    var cadre = $('.depot__zone', zone);
    var etatTxt = $('.depot__etat', zone);
    var occupe = false;
    var envoyer = function (liste) {
      if (occupe || !liste.length) return;
      var trop = liste.filter(function (f) { return f.size > p.tailleMax; });
      liste = liste.filter(function (f) { return f.size <= p.tailleMax; });
      if (trop.length) K.toast(trop.map(function (f) { return f.name; }).join(', ') + ' : plus de ' + Math.round(p.tailleMax / 1048576) + ' Mo, à déposer directement dans le dossier Drive.', true);
      if (!liste.length) return;
      occupe = true;
      depot.classList.add('est-occupe');
      var dossier = $('[data-dossier]', zone).value;
      var faits = 0, dernier = null;
      var suivant = function () {
        if (!liste.length) {
          occupe = false;
          depot.classList.remove('est-occupe');
          if (faits) K.toast(faits + ' fichier' + (faits > 1 ? 's rangés' : ' rangé') + ' dans « ' + (dossier || 'Dossier de l\'affaire') + ' ».');
          if (dernier) rendreToutesPieces(el, a, dernier);
          else etatTxt.textContent = '';
          return;
        }
        var f = liste.shift();
        etatTxt.textContent = 'Envoi de « ' + f.name + ' »…';
        lireBase64(f).then(function (donnees) {
          return K.appel('apiPieceDeposer', a.id, dossier, { nom: f.name, type: f.type, donnees: donnees });
        }).then(function (r) { faits++; dernier = r; }, function (e) { K.toast('« ' + f.name + ' » non déposé : ' + e.message, true); })
          .then(suivant);
      };
      suivant();
    };
    input.addEventListener('change', function () { envoyer(Array.prototype.slice.call(input.files)); input.value = ''; });
    ['dragenter', 'dragover'].forEach(function (t) {
      cadre.addEventListener(t, function (ev) { ev.preventDefault(); cadre.classList.add('est-survolee'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      cadre.addEventListener(t, function () { cadre.classList.remove('est-survolee'); });
    });
    cadre.addEventListener('drop', function (ev) {
      ev.preventDefault();
      envoyer(Array.prototype.slice.call(ev.dataTransfer.files || []));
    });
  }

  function lireBase64(fichier) {
    return new Promise(function (ok, ko) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { ko(new Error('lecture du fichier impossible')); };
      r.readAsDataURL(fichier);
    });
  }

  function blocJournal(f) {
    return '<form class="note-form" data-note><label for="note-texte">Ajouter une note</label>' +
      '<textarea class="champ" id="note-texte" rows="2" placeholder="Appel de l\'acheteur, question posée, visite…"></textarea>' +
      '<div class="bloc-form__actions"><button type="submit" class="bouton">Ajouter la note</button></div></form>' +
      '<h3>Notes</h3>' + (f.affaire.notes ? '<div class="notes pre">' + esc(f.affaire.notes) + '</div>' : '<p class="vide">Aucune note.</p>') +
      '<h3>Historique des statuts</h3><div class="tableau-conteneur"><table><thead><tr><th scope="col">Date</th><th scope="col">Passage</th><th scope="col">Commentaire</th></tr></thead><tbody>' +
      f.historique.slice().reverse().map(function (h) {
        return '<tr><td class="mono">' + esc(K.dateHeure(h.date)) + '</td><td>' + (h.ancien_statut ? esc(h.ancien_statut) + ' → ' : '') + pastille(h.nouveau_statut) + '</td><td>' + esc(h.commentaire) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (f.relances.length ? '<h3>Relances</h3><ul class="liste-simple">' + f.relances.map(function (r) {
        return '<li><span class="mono">' + jour(r.date_prevue) + '</span> · ' + esc(r.type) + ' · <strong>' + esc(r.statut) + '</strong>' + (r.date_faite ? ' le <span class="mono">' + jour(r.date_faite) + '</span>' : '') + '</li>';
      }).join('') + '</ul>' : '');
  }

  function tableCriteres(criteres) {
    var total = function (k) { return criteres.reduce(function (s, c) { return s + (Number(c[k]) || 0); }, 0); };
    var ligne = function (c, i) {
      return '<tr><td><input class="champ" aria-label="Critère ' + (i + 1) + '" data-c="critere" value="' + esc(c.critere || '') + '"></td>' +
        ['ponderation', 'note_kompa', 'note_attributaire'].map(function (k) {
          return '<td><input class="champ mono num" inputmode="decimal" aria-label="' + k + ' ' + (i + 1) + '" data-c="' + k + '" value="' + esc(c[k] === undefined ? '' : c[k]) + '"></td>';
        }).join('') + '</tr>';
    };
    var lignes = criteres.concat([{}, {}]);
    return '<form class="bloc-form" data-criteres novalidate><h3>Notes par critère</h3>' +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Critère</th><th scope="col" class="num">Pondération</th><th scope="col" class="num">Note Kompa</th><th scope="col" class="num">Note attributaire</th></tr></thead><tbody>' +
      lignes.map(ligne).join('') +
      '<tr class="ligne-total"><td>Total</td><td class="num mono">' + total('ponderation') + '</td><td class="num mono">' + total('note_kompa') + '</td><td class="num mono">' + total('note_attributaire') + '</td></tr>' +
      '</tbody></table></div><p class="legende">Critères et pondérations : ceux du règlement de consultation (ex. valeur technique 60, prix 40). Notes : celles de la lettre de rejet ou du rapport d\'analyse, sur le barème de l\'acheteur. Laisser le nom du critère vide pour supprimer une ligne.</p>' +
      '<div class="bloc-form__actions"><button type="submit" class="bouton">Enregistrer les critères</button></div></form>';
  }

  // ——— Planning de facturation : livrables → facture → paiement (barre chronologique) ———
  var ETATS_PLAN = { 'couverte': 'statut--neutre', 'à planifier': 'statut--neutre', 'prévue': 'statut--encours', 'facturée': 'statut--alerte', 'en retard': 'statut--ko', 'payée': 'statut--ok' };

  function planningHtml(f, actions) {
    var p = f.planning;
    if (!p) return '';
    var titre = '<h2 class="fiche-bloc__titre">Planning de facturation</h2>';
    if (!p.base) return '<section class="fiche-bloc">' + titre + '<p class="vide">Montant du marché inconnu : renseignez les jours par tranche et le prix par jour (Appel d\'offres › Offre).</p></section>';
    var nomT = function (l) { return l.tranche === 'MISSION' ? 'Mission' : l.tranche; };
    var piste = { marques: [], traits: [] };
    p.lignes.forEach(function (l) {
      if (l.affermissement === 'non affermie' || l.etat === 'couverte') return;
      var x = K.friseTranche(l, nomT(l));
      piste.marques = piste.marques.concat(x.marques);
      piste.traits = piste.traits.concat(x.traits);
    });
    var parAnnee = {};
    p.lignes.forEach(function (l) {
      if (l.affermissement === 'non affermie' || l.etat === 'couverte') return;
      var an = (l.etat === 'payée' ? l.dateEncaissement : l.dateEcheance || p.aujourdhui).slice(0, 4) + (l.affermissement === 'optionnelle' ? ' (option)' : '');
      parAnnee[an] = (parAnnee[an] || 0) + (l.etat === 'payée' ? l.montantEncaisse || l.montant : l.montant);
    });
    var lignes = p.lignes.map(function (l, i) {
      var opt = l.optionnelle;
      var statutT = !opt ? '<span class="legende">ferme</span>' : l.affermissement === 'affermie'
        ? '<span class="statut statut--ok">affermie</span>' + (l.dateAffermissement ? ' <span class="legende mono">' + jour(l.dateAffermissement) + '</span>' : '')
        : l.affermissement === 'non affermie' ? '<span class="statut statut--neutre">non affermie</span>' : '<span class="statut statut--alerte">optionnelle</span>';
      var act = '';
      if (actions) {
        if (opt && l.affermissement === 'optionnelle') act += '<button type="button" class="bouton bouton--petit" data-plan-affermir="' + i + '">Affermir</button> <button type="button" class="bouton bouton--petit bouton--discret" data-plan-nonaffermie="' + i + '">Non affermie</button>';
        else if (opt && !l.facture && l.affermissement !== 'optionnelle') act += '<button type="button" class="bouton bouton--petit bouton--discret" data-plan-optionnelle="' + i + '">Annuler</button> ';
        if (l.affermissement !== 'optionnelle' && l.affermissement !== 'non affermie') {
          if (l.etat === 'prévue' || l.etat === 'à planifier') act += '<button type="button" class="bouton bouton--petit" data-plan-facturer="' + i + '">Facturer</button>';
          else if (l.etat === 'facturée' || l.etat === 'en retard') act += '<button type="button" class="bouton bouton--petit" data-plan-payer="' + i + '">Paiement reçu</button>';
        }
      }
      var livD = l.livrables.filter(function (x) { return x.date; });
      return '<tr' + (l.affermissement === 'non affermie' ? ' class="est-arretee"' : '') + '><td><strong class="mono">' + esc(nomT(l)) + '</strong> ' + statutT + '</td>' +
        '<td class="num mono">' + (l.jours ? String(l.jours).replace('.', ',') + ' j' : '') + '</td><td class="num mono">' +
          (l.etat === 'couverte' ? K.euros(l.dejaFacture) : K.euros(l.montant) + (l.dejaFacture ? '<div class="legende">+ ' + K.euros(l.dejaFacture) + ' déjà facturés hors planning</div>' : '')) + '</td>' +
        '<td class="legende">' + (livD.length ? livD.map(function (x) { return jour(x.date); }).join(', ') : (l.livrables.length ? 'sans date' : 'aucun livrable ' + esc(nomT(l)))) + '</td>' +
        '<td class="legende">' + (l.dateFacture ? (l.facture ? esc(l.facture.numero) + ' du ' : 'prévue le ') + jour(l.dateFacture) : '—') + '</td>' +
        '<td class="legende">' + (l.etat === 'payée' ? 'payée le ' + jour(l.dateEncaissement) : l.dateEcheance ? (l.facture ? 'due le ' : 'prévu le ') + jour(l.dateEcheance) : '—') +
          (l.retard ? '<div class="plan-retard">' + l.retard.jours + ' j de retard : intérêts ≈ ' + K.euros(l.retard.interets) + ' (' + String(l.retard.taux).replace('.', ',') + ' %) + ' + K.euros(l.retard.indemnite) + '</div>' : '') + '</td>' +
        '<td><span class="statut ' + (ETATS_PLAN[l.etat] || 'statut--neutre') + '">' + esc(l.etat === 'couverte' ? 'facturée hors planning' : l.etat) + '</span></td>' + (actions ? '<td class="plan-actions">' + act + '</td>' : '') + '</tr>';
    }).join('');
    var repartition = Object.keys(parAnnee).sort().map(function (an) { return an + ' : <strong class="mono">' + K.euros(parAnnee[an]) + '</strong>'; }).join(' · ');
    return '<section class="fiche-bloc planning-fact">' + titre +
      '<p class="legende">Marché <strong class="mono">' + K.euros(p.base) + '</strong> HT réparti par tranche au prorata des jours ; facture à la remise du dernier livrable de la tranche, paiement à ' + p.delai + ' jours. ' +
        'Encaissements : ' + repartition + ' — repris dans <a href="#finances/previsionnel">Finances › Prévisionnel</a>.</p>' +
      (p.aPlanifier ? '<p class="bandeau">' + p.aPlanifier + ' tranche(s) sans livrable daté : ajoutez dans Mission › Livrables des livrables portant le code de la tranche et leur échéance.</p>' : '') +
      K.friseCle() + K.frise({ debut: p.debut, fin: p.fin, aujourdhui: p.aujourdhui, pistes: [piste] }) +
      '<div class="tableau-conteneur"><table class="table-planning"><thead><tr><th scope="col">Tranche</th><th scope="col" class="num">Jours</th><th scope="col" class="num">Montant HT</th>' +
        '<th scope="col">Livrables</th><th scope="col">Facture</th><th scope="col">Paiement</th><th scope="col">État</th>' + (actions ? '<th scope="col"><span class="seul-lecteur">Actions</span></th>' : '') + '</tr></thead><tbody>' +
        lignes + '</tbody></table></div>' +
      (actions ? '' : '<p class="legende">Facturation, paiements et affermissement : sous-onglet Facturation.</p>') + '</section>';
  }

  function brancherPlanning(el, f, recharger) {
    var p = f.planning;
    if (!p) return;
    var a = f.affaire;
    var affermir = function (attr, etat, avecDate) {
      $$('[' + attr + ']', el).forEach(function (b) {
        b.addEventListener('click', function () {
          var l = p.lignes[Number(b.getAttribute(attr))];
          if (avecDate) {
            var corps = '<div class="form-grille">' + champHtml({ nom: 'date', libelle: 'Date de l\'ordre de service d\'affermissement', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'af') + '</div>' +
              '<p class="legende">La tranche ' + esc(l.tranche) + ' (' + K.euros(l.montant) + ') passe dans le CA certain.</p>';
            dialogue('Affermir la tranche ' + l.tranche, corps, 'Affermir', function (form) {
              return K.appel('apiTrancheAffermir', a.id, l.tranche, etat, lireChamps(form).date).then(function (fiche) { K.toast('Tranche ' + l.tranche + ' affermie.'); recharger(fiche); });
            });
          } else {
            K.appel('apiTrancheAffermir', a.id, l.tranche, etat, '').then(function (fiche) { K.toast('Tranche ' + l.tranche + ' : ' + etat + '.'); recharger(fiche); })
              .catch(function (e) { K.toast(e.message, true); });
          }
        });
      });
    };
    affermir('data-plan-affermir', 'affermie', true);
    affermir('data-plan-nonaffermie', 'non affermie', false);
    affermir('data-plan-optionnelle', 'optionnelle', false);
    $$('[data-plan-facturer]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var l = p.lignes[Number(b.getAttribute('data-plan-facturer'))];
        var corps = '<div class="form-grille">' +
          champHtml({ nom: 'numero', libelle: 'N° de facture', type: 'texte', obligatoire: true }, '', {}, 'pf') +
          champHtml({ nom: 'date', libelle: 'Date de la facture', type: 'date', obligatoire: true }, l.dateFacture && l.dateFacture <= p.aujourdhui ? l.dateFacture : aujourdhuiIso(), {}, 'pf') +
          champHtml({ nom: 'montant', libelle: 'Montant HT (' + l.tranche + ')', type: 'euros', obligatoire: true }, String(l.montant).replace('.', ','), {}, 'pf') + '</div>' +
          '<p class="legende">Échéance de paiement calculée à ' + p.delai + ' jours. La facture apparaît dans Mission › Facturation.</p>';
        dialogue('Facturer la tranche ' + l.tranche, corps, 'Enregistrer la facture', function (form) {
          return K.appel('apiPlanningFacturer', a.id, l.tranche, lireChamps(form)).then(function (fiche) { K.toast('Facture de la tranche ' + l.tranche + ' enregistrée.'); recharger(fiche); });
        });
      });
    });
    $$('[data-plan-payer]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var l = p.lignes[Number(b.getAttribute('data-plan-payer'))];
        var corps = '<div class="form-grille">' +
          champHtml({ nom: 'date_encaissement', libelle: 'Date du paiement', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'pp') +
          champHtml({ nom: 'montant_encaisse', libelle: 'Montant reçu', type: 'euros', obligatoire: true }, String(l.montant).replace('.', ','), {}, 'pp') + '</div>';
        dialogue('Paiement de la tranche ' + l.tranche, corps, 'Confirmer le paiement', function (form) {
          return K.appel('apiFactureMaj', a.id, l.facture.id, lireChamps(form)).then(function (fiche) { K.toast('Paiement de la tranche ' + l.tranche + ' confirmé.'); recharger(fiche); });
        });
      });
    });
  }

  function tableFactures(f) {
    var t = f.totaux;
    var resume = '<dl class="totaux"><div><dt>Facturé</dt><dd class="mono">' + K.euros(t.facture) + '</dd></div>' +
      '<div><dt>Encaissé</dt><dd class="mono">' + K.euros(t.encaisse) + '</dd></div>' +
      '<div><dt>Reste à facturer</dt><dd class="mono">' + K.euros(t.resteAFacturer) + '</dd></div></dl>';
    var lignes = f.factures.map(function (x) {
      var enc = !x.date_encaissement
        ? '<button type="button" class="bouton bouton--discret" data-encaisser="' + esc(x.id) + '" data-montant="' + esc(x.montant) + '">Encaissée</button>'
        : '<span class="mono">' + jour(x.date_encaissement) + '</span>';
      return '<tr><td class="mono">' + esc(x.numero) + (x.tranche ? ' <span class="legende">' + esc(x.tranche) + '</span>' : '') + '</td><td class="mono">' + jour(x.date) + '</td><td class="num mono">' + montant(x.montant) + '</td>' +
        '<td class="mono">' + jour(x.date_echeance) + '</td><td>' + enc + '</td><td class="num mono">' + montant(x.montant_encaisse) + '</td></tr>';
    }).join('');
    var table = '<h3>Factures</h3>' + resume + (f.factures.length ? '<div class="tableau-conteneur"><table><thead><tr><th scope="col">N°</th><th scope="col">Date</th><th scope="col" class="num">Montant</th><th scope="col">Échéance</th><th scope="col">Encaissement</th><th scope="col" class="num">Encaissé</th></tr></thead><tbody>' + lignes + '</tbody></table></div>' : '<p class="vide">Aucune facture.</p>');
    return table + (f.affaire.statut === 'Gagnée'
      ? '<form class="bloc-form ligne-ajout" data-facture novalidate><h3>Nouvelle facture</h3><div class="form-grille form-grille--4">' +
        champHtml({ nom: 'numero', libelle: 'N°', type: 'texte', obligatoire: true }, '', {}, 'f') +
        champHtml({ nom: 'date', libelle: 'Date', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'f') +
        champHtml({ nom: 'montant', libelle: 'Montant', type: 'euros', obligatoire: true }, '', {}, 'f') +
        champHtml({ nom: 'date_echeance', libelle: 'Échéance (vide = +30 j)', type: 'date' }, '', {}, 'f') +
        '</div><div class="bloc-form__actions"><button type="submit" class="bouton">Ajouter la facture</button></div></form>'
      : '<p class="legende">Les factures se saisissent une fois l\'affaire gagnée.</p>');
  }

  function brancherFiche(el, f) {
    var a = f.affaire;
    var recharger = function (fiche) { rendreFiche(el, fiche); };
    $$('[data-passer]', el).forEach(function (b) {
      b.addEventListener('click', function () { passerStatut(a, b.getAttribute('data-passer'), recharger); });
    });
    brancherPiecesOffre(el, f, recharger);
    brancherLivrables(el, f, recharger);
    brancherPlanning(el, f, recharger);
    // Volets : on rouvre le sous-onglet de l'étape en cours si c'est le volet en cours, sinon le premier
    $$('[data-volet]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-volet');
        if (v === choixFiche.volet) return;
        var d = ongletParDefaut(a.statut);
        choixFiche.volet = v;
        choixFiche.sous = d.volet === v ? d.sous : VOLETS.filter(function (x) { return x.id === v; })[0].sous[0].id;
        rendreFiche(el, f);
      });
    });
    $$('[data-sous]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        choixFiche.sous = b.getAttribute('data-sous');
        $$('[data-sous]', el).forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
        $$('.panneau', el).forEach(function (p) { p.hidden = p.id !== 'p-' + choixFiche.sous; });
      });
    });
    // Journal : tiroir latéral, ouvert depuis n'importe quel onglet
    var tiroir = $('#tiroir-journal', el);
    var basculerJournal = function (ouvrir) {
      journalOuvert = ouvrir;
      tiroir.hidden = !ouvrir;
      $('[data-journal]', el).setAttribute('aria-expanded', String(ouvrir));
      if (ouvrir) { var t = $('#note-texte', tiroir); if (t) t.focus(); } else $('[data-journal]', el).focus();
    };
    $('[data-journal]', el).addEventListener('click', function () { basculerJournal(tiroir.hidden); });
    $('[data-fermer-journal]', el).addEventListener('click', function () { basculerJournal(false); });
    tiroir.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') basculerJournal(false); });
    // Offre : montant HT = total des jours par tranche × prix par jour, recalculé à la saisie
    var fo = $('form[data-bloc="offre"]', el);
    if (fo) {
      var cJours = $('[data-champ="jours_par_tranche"]', fo), cPrix = $('[data-champ="prix_jour"]', fo), cMontant = $('[data-champ="montant_ht"]', fo);
      var nb = function (v) { return Number(String(v || '').replace(/[\s  €]/g, '').replace(',', '.')); };
      var ligneCalc = document.createElement('p');
      ligneCalc.className = 'calcul-offre';
      ligneCalc.setAttribute('aria-live', 'polite');
      $('.form-grille', fo).insertAdjacentElement('afterend', ligneCalc);
      var calculer = function (remplir) {
        var j = joursTotal(cJours.value), p = nb(cPrix.value);
        if (!(j > 0) || !(p > 0)) { ligneCalc.textContent = j > 0 ? j.toLocaleString('fr-FR') + ' j au total : indiquez le prix par jour pour calculer le montant.' : ''; return; }
        var total = Math.round(j * p * 100) / 100;
        if (remplir) { cMontant.value = String(total).replace('.', ','); cMontant.dispatchEvent(new Event('input', { bubbles: true })); }
        var parT = String(cJours.value || '').split(/\r?\n|;/).map(function (l) {
          var m = l.trim().match(/^([^:=]+?)\s*[:=]/), jt = joursTotal(l);
          return m && jt > 0 ? esc(m[1].trim().toUpperCase()) + ' ' + K.euros(Math.round(total * jt / j)) + (/^T(O|C)/i.test(m[1].trim()) ? ' (optionnelle)' : '') : '';
        }).filter(String);
        ligneCalc.innerHTML = '<strong class="mono">' + j.toLocaleString('fr-FR') + ' j × ' + K.euros(p) + ' HT = ' + K.euros(total) + ' HT</strong>' +
          (parT.length > 1 ? ' <span class="legende">· ' + parT.join(' · ') + '</span>' : '') +
          (nb(cMontant.value) === total ? '' : ' <span class="legende">(montant saisi différent, conservé)</span>');
      };
      if (cJours && cPrix && cMontant) {
        [cJours, cPrix].forEach(function (c) { c.addEventListener('input', function () { calculer(true); }); });
        cMontant.addEventListener('input', function (ev) { if (ev.isTrusted) calculer(false); });
        calculer(!cMontant.value);
      }
      // Encaissements prévus par année : aperçu (montant de référence = notifié, à défaut offre)
      var cRep = $('[data-champ="repartition_ca"]', fo);
      if (cRep) {
        var apRep = document.createElement('p');
        apRep.className = 'legende apercu-repartition';
        cRep.insertAdjacentElement('afterend', apRep);
        var majRep = function () {
          var base = Number(a.montant_notifie) || nb(cMontant.value) || 0;
          var lignes = String(cRep.value || '').split(/\r?\n|;/).map(function (l) { return l.trim().match(/^(\d{4})\s*[:=\-–]?\s*(.*)$/); }).filter(Boolean);
          if (!lignes.length) { apRep.textContent = 'Sans répartition : tout le reste à encaisser compte sur l\'année en cours.'; return; }
          var fixe = 0, resteSur = '';
          var parts = lignes.map(function (m) {
            if (!m[2] || /^(le\s+)?reste|solde/i.test(m[2])) { resteSur = resteSur || m[1]; return null; }
            var v = nb(m[2].replace(/€|ht/gi, '')); fixe += v || 0; return m[1] + ' : ' + K.euros(v || 0);
          }).filter(Boolean);
          if (resteSur) parts.push(resteSur + ' : ' + K.euros(Math.max(base - fixe, 0)) + ' (reste)');
          apRep.textContent = parts.join(' · ') + (base ? ' — sur ' + K.euros(base) + ' HT' : '') + (base && fixe > base ? ' — attention, répartition supérieure au montant' : '');
        };
        cRep.addEventListener('input', majRep);
        if (cMontant) cMontant.addEventListener('input', majRep);
        majRep();
      }
    }
    // Blocs : bouton actif dès qu'un champ change
    $$('form[data-bloc]', el).forEach(function (form) {
      var bouton = $('button[type=submit]', form);
      var initial = JSON.stringify(lireChamps(form));
      form.addEventListener('input', function () { bouton.disabled = JSON.stringify(lireChamps(form)) === initial; });
      form.addEventListener('change', function () { bouton.disabled = JSON.stringify(lireChamps(form)) === initial; });
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var manquant = $$('[required]', form).filter(function (x) { return !String(x.value).trim(); })[0];
        if (manquant) { K.toast('Champ obligatoire : ' + $('label[for="' + manquant.id + '"]', form).textContent.replace('*', '').trim(), true); manquant.focus(); return; }
        bouton.disabled = true;
        K.appel('apiAffaireMaj', a.id, lireChamps(form)).then(function (fiche) {
          K.toast('Bloc « ' + form.getAttribute('data-bloc') + ' » enregistré.');
          recharger(fiche);
        }).catch(function (e) { bouton.disabled = false; K.toast(e.message, true); });
      });
    });
    var fc = $('form[data-criteres]', el);
    if (fc) fc.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var lignes = $$('tbody tr', fc).filter(function (tr) { return $('[data-c]', tr); }).map(function (tr) {
        var o = {}; $$('[data-c]', tr).forEach(function (i) { o[i.getAttribute('data-c')] = i.value; }); return o;
      });
      K.appel('apiCriteres', a.id, lignes).then(function (fiche) { K.toast('Critères enregistrés.'); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); });
    });
    var ff = $('form[data-facture]', el);
    if (ff) ff.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = lireChamps(ff);
      if (!v.numero || !v.montant) { K.toast('N° et montant obligatoires.', true); return; }
      K.appel('apiFactureAjouter', a.id, v).then(function (fiche) { K.toast('Facture ' + v.numero + ' ajoutée.'); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); });
    });
    $$('[data-encaisser]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var corps = '<div class="form-grille">' +
          champHtml({ nom: 'date_encaissement', libelle: 'Date d\'encaissement', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'e') +
          champHtml({ nom: 'montant_encaisse', libelle: 'Montant encaissé', type: 'euros', obligatoire: true }, b.getAttribute('data-montant'), {}, 'e') + '</div>';
        dialogue('Encaissement', corps, 'Enregistrer', function (form) {
          return K.appel('apiFactureMaj', a.id, b.getAttribute('data-encaisser'), lireChamps(form)).then(function (fiche) {
            K.toast('Encaissement enregistré.'); recharger(fiche);
          });
        });
      });
    });
    var fn = $('form[data-note]', el);
    if (fn) fn.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var t = $('#note-texte', fn).value;
      if (!t.trim()) return;
      var zone = $('.notes', el) || (function () { var d = document.createElement('div'); d.className = 'notes pre'; fn.insertAdjacentElement('afterend', d); return d; })();
      var p = function (n) { return String(n).padStart(2, '0'); }, d = new Date();
      zone.textContent = (zone.textContent ? zone.textContent + '\n' : '') + '[' + p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '] ' + t.trim();
      $('#note-texte', fn).value = '';
      K.toast('Note ajoutée.');
      K.appel('apiAffaireNote', a.id, t).then(function (fiche) { recharger(fiche); })
        .catch(function (e) { K.toast('Note non enregistrée : ' + e.message, true); });
    });
  }

  // Liens externes (avis, DCE) : nouvel onglet, sans passer par le routeur interne.
  document.addEventListener('click', function (ev) {
    var x = ev.target.closest('a[data-externe]');
    if (x) ev.stopPropagation();
  }, true);

  K.ecrans.affaires = { titre: 'Affaires', rendu: ecranAffaires };
  K.ecrans.affaire = { titre: 'Affaire', nav: 'affaires', rendu: ecranFiche };
})();
</script>
