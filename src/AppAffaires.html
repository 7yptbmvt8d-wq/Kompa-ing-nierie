<script>
/* Kompa Affaires — lot 2 : écrans Affaires (colonnes, liste) et fiche affaire. */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$, $$ = K.$$;

  var etat = { vue: 'colonnes', clotures: true, meta: null };
  try {
    etat.vue = localStorage.getItem('ka.vue') || 'colonnes';
    etat.clotures = localStorage.getItem('ka.clotures') !== '0'; // affichées par défaut
  } catch (e) { /* stockage indisponible : valeurs par défaut */ }
  function memoriser(cle, v) { try { localStorage.setItem(cle, v); } catch (e) { /* sans effet */ } }

  // ——— Formats ———
  function jour(iso) {
    if (!iso) return '';
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso);
  }
  function aujourdhuiIso() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function joursAvant(iso) {
    if (!iso) return null;
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    var cible = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var auj = new Date(); auj.setHours(0, 0, 0, 0);
    return Math.round((cible - auj) / 86400000);
  }
  function montant(v) { return v === '' || v === null || v === undefined ? '' : K.euros(Number(v)); }
  function pastille(statut) {
    var fam = (etat.meta && etat.meta.familles[statut]) || 'encours';
    var cls = { encours: 'statut--encours', gagnee: 'statut--ok', perdue: 'statut--ko', abandonnee: 'statut--neutre' }[fam];
    return '<span class="statut ' + cls + '">' + esc(statut) + '</span>';
  }
  function badgeDelai(a) {
    if ((etat.meta.actifs || []).indexOf(a.statut) < 0 || a.statut === 'Gagnée') return '';
    var n = joursAvant(a.date_limite_remise);
    if (n === null || a.statut === 'Déposée') return '';
    if (n < 0) return '<span class="statut statut--neutre">échue</span>';
    if (n <= 3) return '<span class="statut statut--alerte">J-' + n + '</span>';
    return '<span class="mono legende">J-' + n + '</span>';
  }

  // ——— Champs de formulaire génériques ———
  function champHtml(c, valeur, listes, prefixe) {
    var id = (prefixe || 'c') + '-' + c.nom;
    var v = valeur === null || valeur === undefined ? '' : String(valeur);
    var req = c.obligatoire ? ' required aria-required="true"' : '';
    var lab = '<label for="' + id + '">' + esc(c.libelle) + (c.obligatoire ? ' <span aria-hidden="true">*</span>' : '') + '</label>';
    var t = c.type, input;
    var aide = c.aide ? '<p class="champ-aide" id="' + id + '-aide">' + esc(c.aide) + '</p>' : '';
    if (t === 'lecture') {
      return '<div class="champ-bloc"><span class="champ-libelle">' + esc(c.libelle) + '</span>' + aide + '<div class="champ-lecture mono">' + (v ? esc(v) : '<span class="vide">—</span>') + '</div></div>';
    } else if (t === 'long') {
      input = '<textarea class="champ" id="' + id + '" data-champ="' + c.nom + '" rows="3"' + req + '>' + esc(v) + '</textarea>';
    } else if (t === 'date') {
      input = '<input class="champ mono" type="date" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v.slice(0, 10)) + '"' + req + '>';
    } else if (t === 'nombre' || t === 'euros') {
      input = '<input class="champ mono num" type="text" inputmode="decimal" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v) + '"' + req + '>';
      if (t === 'euros') input = '<div class="champ-unite">' + input + '<span aria-hidden="true">€</span></div>';
    } else if (t === 'lien') {
      input = '<div class="champ-lien"><input class="champ" type="url" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v) + '" placeholder="https://…"' + req + '>' +
        (v ? '<a class="bouton bouton--discret" href="' + esc(v) + '" target="_blank" rel="noopener" data-externe>Ouvrir</a>' : '') + '</div>';
    } else if (t.indexOf('liste:') === 0 || t.indexOf('choix:') === 0) {
      var opts = t.indexOf('liste:') === 0 ? (listes[t.slice(6)] || []) : t.slice(6).split('|');
      if (v && opts.indexOf(v) < 0) opts = opts.concat([v]);
      input = '<select class="champ" id="' + id + '" data-champ="' + c.nom + '"' + req + '><option value=""></option>' +
        opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    } else {
      input = '<input class="champ" type="text" id="' + id + '" data-champ="' + c.nom + '" value="' + esc(v) + '"' + req + '>';
    }
    var attrs = (c.aide ? 'aria-describedby="' + id + '-aide" ' : '') + (c.exemple && t !== 'lien' ? 'placeholder="' + esc('ex. ' + c.exemple) + '" ' : '');
    input = input.replace('data-champ="', attrs + 'data-champ="');
    return '<div class="champ-bloc' + (t === 'long' ? ' champ-bloc--large' : '') + '">' + lab + aide + input + '</div>';
  }
  function lireChamps(racine) {
    var out = {};
    $$('[data-champ]', racine).forEach(function (el) { out[el.getAttribute('data-champ')] = el.value; });
    return out;
  }
  // ——— Boîte de dialogue ———
  function dialogue(titreTxt, corps, libelleOk, surValider) {
    var d = document.createElement('dialog');
    d.className = 'dialogue';
    d.innerHTML = '<form method="dialog" novalidate><h2>' + esc(titreTxt) + '</h2><div class="dialogue__corps">' + corps + '</div>' +
      '<div class="dialogue__erreur" role="alert" hidden></div>' +
      '<div class="dialogue__actions"><button type="button" class="bouton bouton--discret" data-annuler>Annuler</button>' +
      '<button type="submit" class="bouton">' + esc(libelleOk) + '</button></div></form>';
    document.body.appendChild(d);
    var form = $('form', d), err = $('.dialogue__erreur', d), ok = $('button[type=submit]', d);
    var fermer = function () { d.close(); d.remove(); };
    $('[data-annuler]', d).addEventListener('click', fermer);
    d.addEventListener('cancel', function () { d.remove(); });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var manquant = $$('[required]', form).filter(function (el) { return !String(el.value).trim(); })[0];
      if (manquant) { err.textContent = 'Champ obligatoire : ' + $('label[for="' + manquant.id + '"]', form).textContent.replace('*', '').trim(); err.hidden = false; manquant.focus(); return; }
      ok.disabled = true; err.hidden = true;
      Promise.resolve(surValider(form)).then(fermer).catch(function (e) {
        ok.disabled = false; err.textContent = e.message || String(e); err.hidden = false;
      });
    });
    d.showModal();
    var premier = $('input, select, textarea', form);
    if (premier) premier.focus();
    return d;
  }

  /** Changement de statut avec les champs demandés par la règle de passage. */
  function passerStatut(a, statut, apres) {
    var champs = (etat.meta.passage[statut] || []).map(function (c) {
      var v = a[c.nom];
      if ((v === '' || v === undefined || v === null) && c.defaut) {
        v = c.defaut === 'aujourdhui' ? aujourdhuiIso() : (c.defaut.charAt(0) === '=' ? a[c.defaut.slice(1)] : c.defaut);
      }
      return champHtml(c, v, etat.meta.listes, 'p');
    }).join('');
    var corps = '<p class="legende">' + esc(a.id) + ' · ' + esc(a.acheteur) + ' : ' + esc(a.statut) + ' → <strong>' + esc(statut) + '</strong></p>' +
      '<div class="form-grille">' + champs +
      '<div class="champ-bloc champ-bloc--large"><label for="p-commentaire">Commentaire (historique)</label><textarea class="champ" id="p-commentaire" rows="2"></textarea></div></div>';
    dialogue('Passer en « ' + statut + ' »', corps, 'Valider', function (form) {
      var valeurs = lireChamps(form);
      return K.appel('apiAffaireStatut', a.id, statut, valeurs, $('#p-commentaire', form).value).then(function (fiche) {
        K.toast(a.id + ' : ' + statut + '.');
        if (apres) apres(fiche);
      });
    });
  }

  function nouvelleAffaire() {
    var meta = etat.meta;
    var tous = {};
    meta.blocs.forEach(function (b) { b.champs.forEach(function (c) { tous[c.nom] = c; }); });
    var corps = '<div class="form-grille">' + meta.creation.map(function (n) { return champHtml(tous[n], '', meta.listes, 'n'); }).join('') + '</div>';
    dialogue('Nouvelle affaire', corps, 'Créer', function (form) {
      return K.appel('apiAffaireCreer', lireChamps(form)).then(function (a) {
        K.toast('Affaire ' + a.id + ' créée.');
        K.afficher('affaire/' + a.id, true);
      });
    });
  }

  // ——— Écran Affaires ———
  function ecranAffaires(el) {
    el.innerHTML = K.titre('Affaires', '') + '<div class="chargement">Lecture des affaires…</div>';
    K.charger('affaires', 'apiAffaires', [], function (r) {
      etat.meta = r.meta;
      rendreAffaires(el, r.affaires);
    }, function (e) { el.innerHTML = K.titre('Affaires', '') + K.bandeauErreur(e); });
  }

  function rendreAffaires(el, affaires) {
    var meta = etat.meta;
    var statuts = meta.statuts.filter(function (s) { return etat.clotures || meta.actifs.indexOf(s) >= 0; });
    var parStatut = {};
    statuts.forEach(function (s) { parStatut[s] = []; });
    affaires.forEach(function (a) { if (parStatut[a.statut]) parStatut[a.statut].push(a); });
    Object.keys(parStatut).forEach(function (s) {
      parStatut[s].sort(function (x, y) { return String(x.date_limite_remise || '9').localeCompare(String(y.date_limite_remise || '9')); });
    });
    var nbClotures = affaires.filter(function (a) { return meta.actifs.indexOf(a.statut) < 0; }).length;

    var barre = '<div class="barre-outils">' +
      '<button type="button" class="bouton" data-action="nouvelle">Nouvelle affaire</button>' +
      '<div class="bascule" role="group" aria-label="Vue">' +
        '<button type="button" class="bouton bouton--discret" data-vue="colonnes" aria-pressed="' + (etat.vue === 'colonnes') + '">Colonnes</button>' +
        '<button type="button" class="bouton bouton--discret" data-vue="liste" aria-pressed="' + (etat.vue === 'liste') + '">Liste</button></div>' +
      '<label class="case"><input type="checkbox" data-action="clotures"' + (etat.clotures ? ' checked' : '') + '> Afficher les affaires clôturées (' + nbClotures + ')</label>' +
      '</div>';

    var corps;
    if (!affaires.length) {
      corps = '<div class="bandeau">Aucune affaire. Créez la première avec « Nouvelle affaire » ; les avis de la veille arriveront au lot 3.</div>';
    } else if (etat.vue === 'liste') {
      var lignes = [];
      statuts.forEach(function (s) { lignes = lignes.concat(parStatut[s]); });
      corps = '<div class="tableau-conteneur"><table class="table-affaires"><thead><tr>' +
        '<th scope="col">N°</th><th scope="col">Acheteur</th><th scope="col">Objet</th><th scope="col">Statut</th>' +
        '<th scope="col">Remise</th><th scope="col" class="num">Montant HT</th><th scope="col" class="num">Score</th></tr></thead><tbody>' +
        lignes.map(function (a) {
          return '<tr data-ouvrir="' + esc(a.id) + '" tabindex="0">' +
            '<td class="mono">' + esc(a.id) + '</td><td>' + esc(a.acheteur) + '</td><td class="objet-court">' + esc(a.objet) + '</td>' +
            '<td>' + pastille(a.statut) + '</td><td class="mono">' + jour(a.date_limite_remise) + ' ' + badgeDelai(a) + '</td>' +
            '<td class="num mono">' + montant(a.montant_notifie || a.montant_ht) + '</td>' +
            '<td class="num mono">' + esc(a.score_final || a.pre_score || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      // Une colonne par statut en cours, puis une colonne unique « Clôturées » (statut affiché sur chaque carte).
      var colonnes = meta.actifs.map(function (s) {
        return { cle: s, titre: pastille(s), cartes: parStatut[s] || [] };
      });
      if (etat.clotures) {
        var clotures = affaires.filter(function (a) { return meta.actifs.indexOf(a.statut) < 0; })
          .sort(function (x, y) { return String(y.date_statut).localeCompare(String(x.date_statut)); });
        colonnes.push({ cle: COLONNE_CLOTUREES, titre: '<span class="colonne__nom">Clôturées</span>', cartes: clotures });
      }
      corps = '<div class="colonnes" style="--nb-colonnes:' + colonnes.length + '">' + colonnes.map(function (c) {
        return '<section class="colonne" data-statut="' + esc(c.cle) + '" aria-label="' + esc(c.cle) + '">' +
          '<h2 class="colonne__titre">' + c.titre + ' <span class="mono legende">' + c.cartes.length + '</span></h2>' +
          '<div class="colonne__cartes">' + c.cartes.map(carte).join('') + '</div></section>';
      }).join('') + '</div>' +
      '<p class="legende">Glisser une carte vers une autre colonne pour changer de statut ; seules les colonnes autorisées s\'activent.</p>';
    }

    el.innerHTML = K.titre('Affaires', affaires.length + ' affaire' + (affaires.length > 1 ? 's' : '')) + barre + corps;

    $('[data-action="nouvelle"]', el).addEventListener('click', nouvelleAffaire);
    $('[data-action="clotures"]', el).addEventListener('change', function (ev) {
      etat.clotures = ev.target.checked; memoriser('ka.clotures', etat.clotures ? '1' : '0'); rendreAffaires(el, affaires);
    });
    $$('[data-vue]', el).forEach(function (b) {
      b.addEventListener('click', function () { etat.vue = b.getAttribute('data-vue'); memoriser('ka.vue', etat.vue); rendreAffaires(el, affaires); });
    });
    $$('[data-ouvrir]', el).forEach(function (n) {
      var ouvrir = function () { K.afficher('affaire/' + n.getAttribute('data-ouvrir'), true); };
      n.addEventListener('click', function (ev) { if (!ev.target.closest('a')) ouvrir(); });
      n.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ouvrir(); });
    });
    if (affaires.length && etat.vue === 'colonnes') brancherGlisser(el, affaires);
  }

  var COLONNE_CLOTUREES = 'Clôturées';

  function carte(a) {
    var cloturee = etat.meta.actifs.indexOf(a.statut) < 0;
    return '<article class="carte-affaire" draggable="' + (!cloturee || (etat.meta.transitions[a.statut] || []).length > 0) + '" data-id="' + esc(a.id) + '" data-ouvrir="' + esc(a.id) + '" tabindex="0">' +
      '<div class="carte-affaire__tete"><span class="mono">' + esc(a.id) + '</span>' + (cloturee ? pastille(a.statut) : badgeDelai(a)) + '</div>' +
      '<div class="carte-affaire__acheteur">' + esc(a.acheteur) + (a.departement ? ' <span class="mono legende">(' + esc(a.departement) + ')</span>' : '') + '</div>' +
      '<div class="carte-affaire__objet">' + esc(a.objet) + '</div>' +
      '<div class="carte-affaire__pied mono">' +
        (a.date_limite_remise ? '<span>Remise ' + jour(a.date_limite_remise) + '</span>' : '<span></span>') +
        '<span>' + montant(a.montant_notifie || a.montant_ht) + '</span></div>' +
      '</article>';
  }

  function brancherGlisser(el, affaires) {
    var enCours = null;
    $$('.carte-affaire', el).forEach(function (c) {
      c.addEventListener('dragstart', function (ev) {
        enCours = affaires.filter(function (a) { return a.id === c.getAttribute('data-id'); })[0];
        ev.dataTransfer.setData('text/plain', enCours.id);
        ev.dataTransfer.effectAllowed = 'move';
        var permis = etat.meta.transitions[enCours.statut] || [];
        $$('.colonne', el).forEach(function (col) {
          var s = col.getAttribute('data-statut');
          var ok = s === COLONNE_CLOTUREES ? clotureesPermises(enCours).length > 0 : permis.indexOf(s) >= 0;
          col.classList.toggle('est-cible', ok);
          col.classList.toggle('est-interdite', !ok && s !== enCours.statut);
        });
      });
      c.addEventListener('dragend', function () {
        $$('.colonne', el).forEach(function (col) { col.classList.remove('est-cible', 'est-interdite', 'est-survolee'); });
      });
    });
    $$('.colonne', el).forEach(function (col) {
      col.addEventListener('dragover', function (ev) {
        if (col.classList.contains('est-cible')) { ev.preventDefault(); col.classList.add('est-survolee'); }
      });
      col.addEventListener('dragleave', function () { col.classList.remove('est-survolee'); });
      col.addEventListener('drop', function (ev) {
        ev.preventDefault();
        if (!enCours || !col.classList.contains('est-cible')) return;
        var statut = col.getAttribute('data-statut');
        var a = enCours;
        var apres = function (fiche) {
          ['statut', 'date_statut', 'montant_ht', 'montant_notifie', 'score_final'].forEach(function (k) { a[k] = fiche.affaire[k]; });
          rendreAffaires($('#ecran'), affaires);
        };
        K.appel('apiAffaire', a.id).then(function (f) {
          if (statut !== COLONNE_CLOTUREES) return passerStatut(f.affaire, statut, apres);
          var choix = clotureesPermises(a);
          if (choix.length === 1) return passerStatut(f.affaire, choix[0], apres);
          choisirCloture(f.affaire, choix, apres);
        }).catch(function (e) { K.toast(e.message, true); });
      });
    });
  }

  /** Statuts de clôture accessibles depuis le statut de l'affaire (ex. Déposée → Perdue, Sans suite). */
  function clotureesPermises(a) {
    return (etat.meta.transitions[a.statut] || []).filter(function (s) { return etat.meta.actifs.indexOf(s) < 0; });
  }

  function choisirCloture(a, choix, apres) {
    var corps = '<p class="legende">' + esc(a.id) + ' · ' + esc(a.acheteur) + '</p><div class="choix-statut">' +
      choix.map(function (s, i) {
        return '<label class="case"><input type="radio" name="cloture" value="' + esc(s) + '"' + (i === 0 ? ' checked' : '') + '> ' + pastille(s) + '</label>';
      }).join('') + '</div>';
    dialogue('Clôturer l\'affaire', corps, 'Continuer', function (form) {
      var s = $('input[name=cloture]:checked', form).value;
      setTimeout(function () { passerStatut(a, s, apres); }, 0);
    });
  }

  // ——— Fiche affaire ———
  var ongletFiche = 'identification';

  function ecranFiche(el, id) {
    el.innerHTML = '<p><a href="#affaires">← Affaires</a></p><div class="chargement">Lecture de l\'affaire…</div>';
    K.charger('affaire:' + id, 'apiAffaire', [id], function (f) {
      etat.meta = f.meta;
      rendreFiche(el, f);
    }, function (e) { el.innerHTML = '<p><a href="#affaires">← Affaires</a></p>' + K.bandeauErreur(e); });
  }

  function rendreFiche(el, f) {
    var a = f.affaire, meta = etat.meta;
    var liens = (a.lien_avis ? '<a class="bouton bouton--discret" href="' + esc(a.lien_avis) + '" target="_blank" rel="noopener" data-externe>Avis</a>' : '') +
      (a.lien_dce ? '<a class="bouton bouton--discret" href="' + esc(a.lien_dce) + '" target="_blank" rel="noopener" data-externe>Dossier Drive</a>' : '');
    var actions = f.transitions.map(function (s) {
      return '<button type="button" class="bouton" data-passer="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');
    var tete = '<p><a href="#affaires">← Affaires</a></p>' +
      '<header class="fiche-tete">' +
        '<div><div class="fiche-tete__ref mono">' + esc(a.id) + ' · ' + pastille(a.statut) + ' <span class="legende">depuis le ' + esc(K.dateHeure(a.date_statut).slice(0, 10)) + '</span></div>' +
        '<h1>' + esc(a.acheteur) + '</h1><p class="fiche-tete__objet">' + esc(a.objet) + '</p></div>' +
        '<div class="fiche-tete__actions">' + liens +
          (actions ? '<div class="fiche-tete__passages" role="group" aria-label="Changer de statut"><span class="legende">Passer en :</span>' + actions + '</div>' : '') +
        '</div>' +
      '</header>';

    var blocs = meta.blocs.slice();
    blocs.splice(1, 0, { id: 'pieces', titre: 'Pièces', champs: [] });
    var corps = '<div class="onglets" role="tablist">' + blocs.map(function (b) {
        return '<button type="button" role="tab" id="o-' + b.id + '" aria-controls="p-' + b.id + '" aria-selected="' + (b.id === ongletFiche) + '" data-onglet="' + b.id + '">' + esc(b.titre) + '</button>';
      }).join('') + '</div>' +
      blocs.map(function (b) {
        var html;
        if (b.id === 'journal') html = blocJournal(f);
        else if (b.id === 'pieces') html = '<div data-pieces><div class="chargement">Lecture du dossier Drive…</div></div>';
        else {
          html = '<form class="bloc-form" data-bloc="' + b.id + '" novalidate><div class="form-grille">' +
            b.champs.map(function (c) { return champHtml(c, a[c.nom], meta.listes, b.id); }).join('') + '</div>' +
            '<div class="bloc-form__actions"><button type="submit" class="bouton" disabled>Enregistrer</button></div></form>';
          if (b.id === 'resultat') html += tableCriteres(f.criteres);
          if (b.id === 'execution') html += tableFactures(f);
        }
        return '<section class="panneau" role="tabpanel" id="p-' + b.id + '" aria-labelledby="o-' + b.id + '"' + (b.id === ongletFiche ? '' : ' hidden') + '>' + html + '</section>';
      }).join('');
    el.innerHTML = tete + corps;
    brancherFiche(el, f);
    chargerPieces(el, a);
  }

  // ——— Pièces : dossier Drive de l'affaire ———
  function taille(o) {
    o = Number(o) || 0;
    return o >= 1048576 ? (o / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(o / 1024)) + ' Ko';
  }

  function chargerPieces(el, a) {
    var zone = $('[data-pieces]', el);
    if (!zone) return;
    K.charger('pieces:' + a.id, 'apiPieces', [a.id], function (p) { rendrePieces(zone, a, p); },
      function (e) { zone.innerHTML = K.bandeauErreur(e); });
  }

  function rendrePieces(zone, a, p) {
    var choixActuel = ($('#piece-dossier', zone) || {}).value;
    if (!p.url) {
      zone.innerHTML = '<p class="vide">Pas encore de dossier Drive : il sera créé au premier dépôt.</p>' + formDepot(a, p, choixActuel);
    } else {
      var listes = p.dossiers.map(function (d) {
        return '<section class="pieces__dossier"><h3><a href="' + esc(d.url) + '" target="_blank" rel="noopener" data-externe>' +
          esc(d.nom || 'Dossier de l\'affaire') + '</a> <span class="legende">' + d.fichiers.length + ' fichier' + (d.fichiers.length > 1 ? 's' : '') + '</span></h3>' +
          (d.fichiers.length ? '<ul class="pieces__liste">' + d.fichiers.map(function (x) {
            return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener" data-externe>' + esc(x.nom) + '</a>' +
              ' <span class="legende mono">' + esc(x.date) + ' · ' + taille(x.taille) + '</span></li>';
          }).join('') + '</ul>' : '') + '</section>';
      }).join('');
      zone.innerHTML = formDepot(a, p, choixActuel) + '<div class="pieces">' + listes + '</div>';
    }
    brancherDepot(zone, a, p);
  }

  function formDepot(a, p, choixActuel) {
    var noms = p.dossiers.map(function (d) { return d.nom; });
    var choisi = noms.indexOf(choixActuel) >= 0 ? choixActuel : p.parDefaut;
    var options = noms.length ? p.dossiers.map(function (d) {
      return '<option value="' + esc(d.nom) + '"' + (d.nom === choisi ? ' selected' : '') + '>' + esc(d.nom || 'Dossier de l\'affaire') + '</option>';
    }).join('') : '<option value="">Dossier de l\'affaire</option>';
    return '<div class="depot" data-depot>' +
      '<div class="depot__ligne"><label for="piece-dossier">Ranger dans</label> <select class="champ" id="piece-dossier">' + options + '</select></div>' +
      '<label class="depot__zone" for="piece-fichiers"><input type="file" id="piece-fichiers" multiple class="depot__input">' +
        '<span><strong>Glissez vos fichiers ici</strong> ou <span class="lien">cliquez pour les choisir</span></span>' +
        '<span class="legende">' + Math.round(p.tailleMax / 1048576) + ' Mo maximum par fichier' + (p.url ? ' · au-delà, <a href="' + esc(p.url) + '" target="_blank" rel="noopener" data-externe>ouvrez le dossier Drive</a>' : '') + '</span></label>' +
      '<p class="depot__etat legende" aria-live="polite"></p></div>';
  }

  function brancherDepot(zone, a, p) {
    var depot = $('[data-depot]', zone);
    var input = $('#piece-fichiers', zone);
    var cadre = $('.depot__zone', zone);
    var etatTxt = $('.depot__etat', zone);
    var occupe = false;
    var envoyer = function (liste) {
      if (occupe || !liste.length) return;
      var trop = liste.filter(function (f) { return f.size > p.tailleMax; });
      liste = liste.filter(function (f) { return f.size <= p.tailleMax; });
      if (trop.length) K.toast(trop.map(function (f) { return f.name; }).join(', ') + ' : plus de ' + Math.round(p.tailleMax / 1048576) + ' Mo, à déposer directement dans le dossier Drive.', true);
      if (!liste.length) return;
      occupe = true;
      depot.classList.add('est-occupe');
      var dossier = $('#piece-dossier', zone).value;
      var faits = 0, dernier = null;
      var suivant = function () {
        if (!liste.length) {
          occupe = false;
          depot.classList.remove('est-occupe');
          if (faits) K.toast(faits + ' fichier' + (faits > 1 ? 's rangés' : ' rangé') + ' dans « ' + (dossier || 'Dossier de l\'affaire') + ' ».');
          if (dernier) rendrePieces(zone, a, dernier);
          else etatTxt.textContent = '';
          return;
        }
        var f = liste.shift();
        etatTxt.textContent = 'Envoi de « ' + f.name + ' »…';
        lireBase64(f).then(function (donnees) {
          return K.appel('apiPieceDeposer', a.id, dossier, { nom: f.name, type: f.type, donnees: donnees });
        }).then(function (r) { faits++; dernier = r; }, function (e) { K.toast('« ' + f.name + ' » non déposé : ' + e.message, true); })
          .then(suivant);
      };
      suivant();
    };
    input.addEventListener('change', function () { envoyer(Array.prototype.slice.call(input.files)); input.value = ''; });
    ['dragenter', 'dragover'].forEach(function (t) {
      cadre.addEventListener(t, function (ev) { ev.preventDefault(); cadre.classList.add('est-survolee'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      cadre.addEventListener(t, function () { cadre.classList.remove('est-survolee'); });
    });
    cadre.addEventListener('drop', function (ev) {
      ev.preventDefault();
      envoyer(Array.prototype.slice.call(ev.dataTransfer.files || []));
    });
  }

  function lireBase64(fichier) {
    return new Promise(function (ok, ko) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { ko(new Error('lecture du fichier impossible')); };
      r.readAsDataURL(fichier);
    });
  }

  function blocJournal(f) {
    return '<form class="note-form" data-note><label for="note-texte">Ajouter une note</label>' +
      '<textarea class="champ" id="note-texte" rows="2" placeholder="Appel de l\'acheteur, question posée, visite…"></textarea>' +
      '<div class="bloc-form__actions"><button type="submit" class="bouton">Ajouter la note</button></div></form>' +
      '<h3>Notes</h3>' + (f.affaire.notes ? '<div class="notes pre">' + esc(f.affaire.notes) + '</div>' : '<p class="vide">Aucune note.</p>') +
      '<h3>Historique des statuts</h3><div class="tableau-conteneur"><table><thead><tr><th scope="col">Date</th><th scope="col">Passage</th><th scope="col">Commentaire</th></tr></thead><tbody>' +
      f.historique.slice().reverse().map(function (h) {
        return '<tr><td class="mono">' + esc(K.dateHeure(h.date)) + '</td><td>' + (h.ancien_statut ? esc(h.ancien_statut) + ' → ' : '') + pastille(h.nouveau_statut) + '</td><td>' + esc(h.commentaire) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (f.relances.length ? '<h3>Relances</h3><ul class="liste-simple">' + f.relances.map(function (r) {
        return '<li><span class="mono">' + jour(r.date_prevue) + '</span> · ' + esc(r.type) + ' · <strong>' + esc(r.statut) + '</strong>' + (r.date_faite ? ' le <span class="mono">' + jour(r.date_faite) + '</span>' : '') + '</li>';
      }).join('') + '</ul>' : '');
  }

  function tableCriteres(criteres) {
    var total = function (k) { return criteres.reduce(function (s, c) { return s + (Number(c[k]) || 0); }, 0); };
    var ligne = function (c, i) {
      return '<tr><td><input class="champ" aria-label="Critère ' + (i + 1) + '" data-c="critere" value="' + esc(c.critere || '') + '"></td>' +
        ['ponderation', 'note_kompa', 'note_attributaire'].map(function (k) {
          return '<td><input class="champ mono num" inputmode="decimal" aria-label="' + k + ' ' + (i + 1) + '" data-c="' + k + '" value="' + esc(c[k] === undefined ? '' : c[k]) + '"></td>';
        }).join('') + '</tr>';
    };
    var lignes = criteres.concat([{}, {}]);
    return '<form class="bloc-form" data-criteres novalidate><h3>Notes par critère</h3>' +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Critère</th><th scope="col" class="num">Pondération</th><th scope="col" class="num">Note Kompa</th><th scope="col" class="num">Note attributaire</th></tr></thead><tbody>' +
      lignes.map(ligne).join('') +
      '<tr class="ligne-total"><td>Total</td><td class="num mono">' + total('ponderation') + '</td><td class="num mono">' + total('note_kompa') + '</td><td class="num mono">' + total('note_attributaire') + '</td></tr>' +
      '</tbody></table></div><p class="legende">Critères et pondérations : ceux du règlement de consultation (ex. valeur technique 60, prix 40). Notes : celles de la lettre de rejet ou du rapport d\'analyse, sur le barème de l\'acheteur. Laisser le nom du critère vide pour supprimer une ligne.</p>' +
      '<div class="bloc-form__actions"><button type="submit" class="bouton">Enregistrer les critères</button></div></form>';
  }

  function tableFactures(f) {
    var t = f.totaux;
    var resume = '<dl class="totaux"><div><dt>Facturé</dt><dd class="mono">' + K.euros(t.facture) + '</dd></div>' +
      '<div><dt>Encaissé</dt><dd class="mono">' + K.euros(t.encaisse) + '</dd></div>' +
      '<div><dt>Reste à facturer</dt><dd class="mono">' + K.euros(t.resteAFacturer) + '</dd></div></dl>';
    var lignes = f.factures.map(function (x) {
      var enc = !x.date_encaissement
        ? '<button type="button" class="bouton bouton--discret" data-encaisser="' + esc(x.id) + '" data-montant="' + esc(x.montant) + '">Encaissée</button>'
        : '<span class="mono">' + jour(x.date_encaissement) + '</span>';
      return '<tr><td class="mono">' + esc(x.numero) + '</td><td class="mono">' + jour(x.date) + '</td><td class="num mono">' + montant(x.montant) + '</td>' +
        '<td class="mono">' + jour(x.date_echeance) + '</td><td>' + enc + '</td><td class="num mono">' + montant(x.montant_encaisse) + '</td></tr>';
    }).join('');
    var table = '<h3>Factures</h3>' + resume + (f.factures.length ? '<div class="tableau-conteneur"><table><thead><tr><th scope="col">N°</th><th scope="col">Date</th><th scope="col" class="num">Montant</th><th scope="col">Échéance</th><th scope="col">Encaissement</th><th scope="col" class="num">Encaissé</th></tr></thead><tbody>' + lignes + '</tbody></table></div>' : '<p class="vide">Aucune facture.</p>');
    return table + (f.affaire.statut === 'Gagnée'
      ? '<form class="bloc-form ligne-ajout" data-facture novalidate><h3>Nouvelle facture</h3><div class="form-grille form-grille--4">' +
        champHtml({ nom: 'numero', libelle: 'N°', type: 'texte', obligatoire: true }, '', {}, 'f') +
        champHtml({ nom: 'date', libelle: 'Date', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'f') +
        champHtml({ nom: 'montant', libelle: 'Montant', type: 'euros', obligatoire: true }, '', {}, 'f') +
        champHtml({ nom: 'date_echeance', libelle: 'Échéance (vide = +30 j)', type: 'date' }, '', {}, 'f') +
        '</div><div class="bloc-form__actions"><button type="submit" class="bouton">Ajouter la facture</button></div></form>'
      : '<p class="legende">Les factures se saisissent une fois l\'affaire gagnée.</p>');
  }

  function brancherFiche(el, f) {
    var a = f.affaire;
    var recharger = function (fiche) { rendreFiche(el, fiche); };
    $$('[data-passer]', el).forEach(function (b) {
      b.addEventListener('click', function () { passerStatut(a, b.getAttribute('data-passer'), recharger); });
    });
    $$('[data-onglet]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        ongletFiche = b.getAttribute('data-onglet');
        $$('[data-onglet]', el).forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
        $$('.panneau', el).forEach(function (p) { p.hidden = p.id !== 'p-' + ongletFiche; });
      });
    });
    // Blocs : bouton actif dès qu'un champ change
    $$('form[data-bloc]', el).forEach(function (form) {
      var bouton = $('button[type=submit]', form);
      var initial = JSON.stringify(lireChamps(form));
      form.addEventListener('input', function () { bouton.disabled = JSON.stringify(lireChamps(form)) === initial; });
      form.addEventListener('change', function () { bouton.disabled = JSON.stringify(lireChamps(form)) === initial; });
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var manquant = $$('[required]', form).filter(function (x) { return !String(x.value).trim(); })[0];
        if (manquant) { K.toast('Champ obligatoire : ' + $('label[for="' + manquant.id + '"]', form).textContent.replace('*', '').trim(), true); manquant.focus(); return; }
        bouton.disabled = true;
        K.appel('apiAffaireMaj', a.id, lireChamps(form)).then(function (fiche) {
          K.toast('Bloc « ' + form.getAttribute('data-bloc') + ' » enregistré.');
          recharger(fiche);
        }).catch(function (e) { bouton.disabled = false; K.toast(e.message, true); });
      });
    });
    var fc = $('form[data-criteres]', el);
    if (fc) fc.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var lignes = $$('tbody tr', fc).filter(function (tr) { return $('[data-c]', tr); }).map(function (tr) {
        var o = {}; $$('[data-c]', tr).forEach(function (i) { o[i.getAttribute('data-c')] = i.value; }); return o;
      });
      K.appel('apiCriteres', a.id, lignes).then(function (fiche) { K.toast('Critères enregistrés.'); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); });
    });
    var ff = $('form[data-facture]', el);
    if (ff) ff.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = lireChamps(ff);
      if (!v.numero || !v.montant) { K.toast('N° et montant obligatoires.', true); return; }
      K.appel('apiFactureAjouter', a.id, v).then(function (fiche) { K.toast('Facture ' + v.numero + ' ajoutée.'); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); });
    });
    $$('[data-encaisser]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var corps = '<div class="form-grille">' +
          champHtml({ nom: 'date_encaissement', libelle: 'Date d\'encaissement', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'e') +
          champHtml({ nom: 'montant_encaisse', libelle: 'Montant encaissé', type: 'euros', obligatoire: true }, b.getAttribute('data-montant'), {}, 'e') + '</div>';
        dialogue('Encaissement', corps, 'Enregistrer', function (form) {
          return K.appel('apiFactureMaj', a.id, b.getAttribute('data-encaisser'), lireChamps(form)).then(function (fiche) {
            K.toast('Encaissement enregistré.'); recharger(fiche);
          });
        });
      });
    });
    var fn = $('form[data-note]', el);
    if (fn) fn.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var t = $('#note-texte', fn).value;
      if (!t.trim()) return;
      var zone = $('.notes', el) || (function () { var d = document.createElement('div'); d.className = 'notes pre'; fn.insertAdjacentElement('afterend', d); return d; })();
      var p = function (n) { return String(n).padStart(2, '0'); }, d = new Date();
      zone.textContent = (zone.textContent ? zone.textContent + '\n' : '') + '[' + p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '] ' + t.trim();
      $('#note-texte', fn).value = '';
      K.toast('Note ajoutée.');
      K.appel('apiAffaireNote', a.id, t).then(function (fiche) { recharger(fiche); })
        .catch(function (e) { K.toast('Note non enregistrée : ' + e.message, true); });
    });
  }

  // Liens externes (avis, DCE) : nouvel onglet, sans passer par le routeur interne.
  document.addEventListener('click', function (ev) {
    var x = ev.target.closest('a[data-externe]');
    if (x) ev.stopPropagation();
  }, true);

  K.ecrans.affaires = { titre: 'Affaires', rendu: ecranAffaires };
  K.ecrans.affaire = { titre: 'Affaire', nav: 'affaires', rendu: ecranFiche };
})();
</script>
