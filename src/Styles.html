<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Styles Kompa Affaires — couleurs : variables de Tokens.html uniquement. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--k-blanc);
  color: var(--k-texte);
  font-family: var(--k-police-texte);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.mono { font-family: var(--k-police-mono); font-variant-numeric: tabular-nums; }
a { color: var(--k-statut-encours); }
:focus-visible { outline: 2px solid var(--k-focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.seul-lecteur { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ——— En-tête ardoise ——— */
.entete {
  background: var(--k-ardoise);
  color: var(--k-sur-ardoise);
  position: sticky; top: 0; z-index: 10;
  padding-top: env(safe-area-inset-top);
}
.entete__barre {
  display: flex; align-items: center; gap: var(--k-esp-5);
  max-width: 1280px; margin: 0 auto; padding: 0 var(--k-esp-5);
  min-height: 56px;
}
.marque { display: flex; align-items: center; gap: var(--k-esp-3); color: inherit; text-decoration: none; flex-shrink: 0; }
.marque__symbole {
  width: 28px; height: 28px; border: 2px solid var(--k-sur-ardoise); border-radius: var(--k-rayon);
  display: grid; place-items: center; font-weight: 600; font-size: 15px; line-height: 1;
}
.marque__nom { font-weight: 600; font-size: 16px; letter-spacing: 0.01em; white-space: nowrap; }
.marque__nom span { font-weight: 400; color: var(--k-sur-ardoise-doux); }

.nav { display: flex; gap: var(--k-esp-1); overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  color: var(--k-sur-ardoise-doux); text-decoration: none; white-space: nowrap;
  padding: 0 var(--k-esp-3); min-height: 56px; display: flex; align-items: center;
  border-bottom: 3px solid transparent; font-weight: 500; font-size: 14px;
}
.nav a:hover { color: var(--k-sur-ardoise); }
.nav a[aria-current="page"] { color: var(--k-sur-ardoise); border-bottom-color: var(--k-rouille); }

/* ——— Contenu ——— */
main { max-width: 1280px; margin: 0 auto; padding: var(--k-esp-5); }
.titre-ecran { display: flex; align-items: baseline; justify-content: space-between; gap: var(--k-esp-4); flex-wrap: wrap; margin: 0 0 var(--k-esp-5); }
.titre-ecran h1 { font-size: 22px; font-weight: 600; margin: 0; }
.titre-ecran p { margin: 0; color: var(--k-texte-doux); }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 var(--k-esp-3); }

.grille { display: grid; gap: var(--k-esp-4); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.carte {
  border: 1px solid var(--k-filet); border-radius: var(--k-rayon); background: var(--k-blanc);
  padding: var(--k-esp-4); box-shadow: var(--k-ombre);
}
@media (min-width: 761px) { .carte--large { grid-column: span 2; } }
.carte--attente { background: var(--k-brume); box-shadow: none; }
.carte--attente p { color: var(--k-texte-doux); margin: 0; }
.carte__lot { font-family: var(--k-police-mono); font-size: 12px; color: var(--k-texte-doux); margin-bottom: var(--k-esp-1); }

.liste-def { display: grid; grid-template-columns: max-content 1fr; gap: var(--k-esp-2) var(--k-esp-4); margin: 0; }
.liste-def dt { color: var(--k-texte-doux); white-space: nowrap; }
.liste-def dd { margin: 0; overflow-wrap: anywhere; }

/* ——— Tableaux ——— */
.tableau-conteneur { overflow-x: auto; border: 1px solid var(--k-filet); border-radius: var(--k-rayon); }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--k-brume); color: var(--k-ardoise); font-weight: 600; font-size: 13px;
  text-align: left; padding: var(--k-esp-2) var(--k-esp-3); border-bottom: 1px solid var(--k-filet);
}
tbody td { padding: var(--k-esp-2) var(--k-esp-3); border-bottom: 1px solid var(--k-filet); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }

/* ——— Statuts ——— */
.statut {
  display: inline-flex; align-items: center; gap: var(--k-esp-1);
  font-size: 13px; font-weight: 500; padding: 2px var(--k-esp-2); border-radius: 999px;
}
.statut::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.statut--ok { color: var(--k-statut-gagnee); background: var(--k-statut-gagnee-fond); }
.statut--ko { color: var(--k-statut-perdue); background: var(--k-statut-perdue-fond); }
.statut--encours { color: var(--k-statut-encours); background: var(--k-statut-encours-fond); }
.statut--neutre { color: var(--k-statut-abandonnee); background: var(--k-statut-abandonnee-fond); }

/* ——— Formulaires ——— */
.champ {
  width: 100%; font: inherit; color: var(--k-texte); background: var(--k-blanc);
  border: 1px solid var(--k-filet); border-radius: var(--k-rayon);
  padding: var(--k-esp-2) var(--k-esp-3); min-height: 38px;
}
.champ:focus { border-color: var(--k-focus); outline: none; box-shadow: 0 0 0 2px var(--k-statut-encours-fond); }
textarea.champ { resize: vertical; min-height: 38px; }
.champ.est-modifie { border-color: var(--k-statut-encours); background: var(--k-statut-encours-fond); }

.bouton {
  font: inherit; font-weight: 500; font-size: 14px; cursor: pointer;
  border: 1px solid var(--k-ardoise); background: var(--k-ardoise); color: var(--k-sur-ardoise);
  border-radius: var(--k-rayon); padding: 0 var(--k-esp-4); min-height: 38px;
}
.bouton:hover:not(:disabled) { background: var(--k-ardoise-clair); }
.bouton:disabled { cursor: default; background: var(--k-brume); border-color: var(--k-filet); color: var(--k-texte-doux); }
.bouton--discret { background: var(--k-blanc); color: var(--k-ardoise); border-color: var(--k-filet); }
.bouton--discret:hover:not(:disabled) { background: var(--k-brume); }

/* ——— Paramètres ——— */
.groupe-param { margin-bottom: var(--k-esp-6); }
.param-cle { font-family: var(--k-police-mono); font-size: 13px; white-space: nowrap; }
.param-com { color: var(--k-texte-doux); font-size: 13px; }
.param-date { font-family: var(--k-police-mono); font-size: 12px; color: var(--k-texte-doux); white-space: nowrap; }
.col-cle { width: 22%; } .col-val { width: 40%; } .col-com { width: 24%; } .col-act { width: 1%; }
.param-carte { padding: var(--k-esp-3) 0; border-bottom: 1px solid var(--k-filet); }
.param-carte .param-val { font-family: var(--k-police-mono); font-size: 13px; overflow-wrap: anywhere; margin-top: var(--k-esp-1); }
.vide { color: var(--k-texte-doux); font-style: italic; font-family: var(--k-police-texte); }

/* ——— Messages ——— */
.bandeau { border-radius: var(--k-rayon); padding: var(--k-esp-3) var(--k-esp-4); margin-bottom: var(--k-esp-4); border: 1px solid var(--k-filet); background: var(--k-brume); }
.bandeau--erreur { border-color: var(--k-statut-perdue); background: var(--k-statut-perdue-fond); color: var(--k-statut-perdue); }
.chargement { color: var(--k-texte-doux); padding: var(--k-esp-5) 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--k-esp-5) + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--k-ardoise); color: var(--k-sur-ardoise); padding: var(--k-esp-3) var(--k-esp-4);
  border-radius: var(--k-rayon); box-shadow: var(--k-ombre); z-index: 20; max-width: calc(100% - 32px);
}
.toast--erreur { background: var(--k-erreur); }

.pied { max-width: 1280px; margin: 0 auto; padding: var(--k-esp-4) var(--k-esp-5) var(--k-esp-6); color: var(--k-texte-doux); font-size: 12px; }

/* ——— Mobile ——— */
.seul-mobile { display: none; }
@media (max-width: 760px) {
  .seul-pc { display: none !important; }
  .seul-mobile { display: block; }
  .entete__barre { flex-direction: column; align-items: stretch; gap: 0; padding: 0; }
  .marque { padding: var(--k-esp-3) var(--k-esp-4) 0; }
  .nav { padding: 0 var(--k-esp-2); }
  .nav a { min-height: var(--k-cible-tactile); }
  main { padding: var(--k-esp-4); }
  .pied { padding: var(--k-esp-4); }
  .titre-ecran h1 { font-size: 20px; }
  .bouton, .champ { min-height: var(--k-cible-tactile); }
  .liste-def { grid-template-columns: 1fr; gap: 0; }
  .liste-def dd { margin-bottom: var(--k-esp-2); }
}
</style>
