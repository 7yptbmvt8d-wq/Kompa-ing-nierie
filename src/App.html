<script>
/* Kompa Affaires — interface (lot 1 : socle). */
(function () {
  'use strict';

  // ——— Appels serveur ———
  /** Appels en lecture seule : tous les autres modifient les données et vident la mémoire d'affichage. */
  var LECTURES = ['apiEtat', 'apiParametres', 'apiCompteurCA', 'apiAccueil', 'apiAffaires', 'apiAffaire', 'apiVeille',
    'apiEcheancier', 'apiSuivi', 'apiCourrier', 'apiEmailApercu', 'apiTableau', 'apiEnseignements', 'apiFiscal', 'apiPieces'];

  function appel(nom) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resoudre, rejeter) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) {
            if (LECTURES.indexOf(nom) < 0) viderMemoire();
            resoudre(r.data);
          } else rejeter(new Error((r && r.erreur) || 'Réponse vide du serveur.'));
        })
        .withFailureHandler(function (e) { rejeter(e instanceof Error ? e : new Error(String(e))); });
      runner[nom].apply(runner, args);
    });
  }

  // ——— Mémoire d'affichage : la dernière version connue s'affiche tout de suite ———
  var memoire = {};
  var jetonEcran = 0;
  function lireMemoire(cle) {
    if (memoire[cle]) return memoire[cle];
    try { var v = localStorage.getItem('ka.m.' + cle); if (v) return (memoire[cle] = JSON.parse(v)); } catch (e) { /* indisponible */ }
    return null;
  }
  function ecrireMemoire(cle, donnees) {
    memoire[cle] = donnees;
    try { localStorage.setItem('ka.m.' + cle, JSON.stringify(donnees)); } catch (e) { /* plein ou indisponible */ }
  }
  function viderMemoire() {
    memoire = {};
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('ka.m.') === 0) localStorage.removeItem(k); });
    } catch (e) { /* indisponible */ }
  }
  /** Saisie en cours sur l'écran : ne pas le redessiner sous les doigts de l'utilisateur. */
  function saisieEnCours() {
    var a = document.activeElement;
    return !!(document.querySelector('dialog[open]') || document.querySelector('#ecran .est-modifie') ||
      (a && a.closest && a.closest('#ecran') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)));
  }
  /**
   * Affiche tout de suite la dernière version connue (si elle existe), puis la version fraîche
   * dès qu'elle arrive, si elle diffère et si aucune saisie n'est en cours.
   */
  function charger(cle, nom, args, rendu, surErreur) {
    var jeton = jetonEcran;
    var ancien = lireMemoire(cle);
    if (ancien) rendu(ancien, true);
    return appel.apply(null, [nom].concat(args || [])).then(function (frais) {
      ecrireMemoire(cle, frais);
      if (jeton !== jetonEcran) return; // écran quitté entre-temps
      if (!ancien || (JSON.stringify(frais) !== JSON.stringify(ancien) && !saisieEnCours())) rendu(frais, false);
    }).catch(function (e) {
      if (jeton !== jetonEcran) return;
      if (ancien) toast('Données non actualisées : ' + e.message, true);
      else if (surErreur) surErreur(e);
    });
  }

  // ——— Utilitaires ———
  var $ = function (sel, racine) { return (racine || document).querySelector(sel); };
  var $$ = function (sel, racine) { return Array.prototype.slice.call((racine || document).querySelectorAll(sel)); };

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateHeure(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  var toastMinuteur = null;
  function toast(message, erreur) {
    var t = $('#toast');
    t.textContent = message;
    t.className = 'toast' + (erreur ? ' toast--erreur' : '');
    t.hidden = false;
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(function () { t.hidden = true; }, erreur ? 6000 : 2500);
  }


  function bandeauErreur(e) {
    return '<div class="bandeau bandeau--erreur" role="alert"><strong>Erreur.</strong> ' + esc(e.message || e) + '</div>';
  }

  function titre(t, sousTitre) {
    return '<div class="titre-ecran"><h1>' + esc(t) + '</h1>' + (sousTitre ? '<p>' + esc(sousTitre) + '</p>' : '') + '</div>';
  }

  // ——— Écrans ———
  var ECRANS = {
    accueil: { titre: 'Accueil', rendu: ecranAccueil },
    parametres: { titre: 'Paramètres', rendu: ecranParametres }
  };

  function ecranAccueil(el) {
    el.innerHTML = titre('Accueil', '') +
      '<section id="tableau-de-bord"><h2>Tableau de bord</h2><div class="chargement">Calcul des indicateurs…</div></section>' +
      '<div class="grille">' +
        '<section class="carte carte--large" id="carte-ca"><h2>Chiffre d\'affaires</h2><div class="chargement">Calcul du CA…</div></section>' +
        '<section class="carte carte--pleine" id="carte-urssaf"><h2>Déclarations URSSAF</h2><div class="chargement">Calcul…</div></section>' +
        '<section class="carte" id="carte-echeances"><h2>Échéances à 7 jours</h2><div class="chargement">Calcul…</div></section>' +
        '<section class="carte" id="carte-relances"><h2>Relances à faire</h2><div class="chargement">Calcul…</div></section>' +
        '<section class="carte" id="carte-etat"><h2>État du socle</h2><div class="chargement">Lecture du classeur…</div></section>' +
      '</div>';

    charger('accueil', 'apiAccueil', [], function (d) {
      var K = window.KA;
      if (K.tableauAccueil) K.tableauAccueil($('#tableau-de-bord'), d.tableau);
      if (K.fiscalAccueil) K.fiscalAccueil($('#carte-urssaf'), d.fiscal);
      if (K.suiviAccueil) K.suiviAccueil($('#carte-echeances'), $('#carte-relances'), d.suivi);
      $('#carte-ca').innerHTML = rendreCompteur(d.ca);
      rendreEtat(d.etat);
    }, function (e) {
      $('#tableau-de-bord').innerHTML = '<h2>Tableau de bord</h2>' + bandeauErreur(e);
    });
  }

  function rendreEtat(etat) {
    var present = etat.onglets.filter(function (o) { return o.present; }).length;
    var ok = present === etat.onglets.length;
    $('#carte-etat').innerHTML = '<h2>État du socle</h2>' +
      '<dl class="liste-def">' +
        '<dt>Classeur</dt><dd><span class="statut ' + (ok ? 'statut--ok">Connecté' : 'statut--ko">Incomplet') + '</span> ' +
          '<a href="' + esc(etat.classeur.url) + '" target="_blank" rel="noopener">' + esc(etat.classeur.nom) + '</a></dd>' +
        '<dt>Onglets</dt><dd class="mono">' + present + ' / ' + etat.onglets.length + '</dd>' +
        '<dt>Compte</dt><dd class="mono">' + esc(etat.compte) + '</dd>' +
        '<dt>E-mails restants</dt><dd class="mono">' + esc(etat.quotaEmailRestant) + ' aujourd\'hui</dd>' +
        '<dt>Déclencheurs</dt><dd class="mono">' + (etat.declencheurs.length ? esc(etat.declencheurs.join(', ')) : '<span class="vide">aucun</span>') + '</dd>' +
        '<dt>Lu à</dt><dd class="mono">' + esc(dateHeure(etat.maintenant)) + '</dd>' +
      '</dl>';
    $('#pied').textContent = etat.app + ' · v' + etat.version;
  }

  var formatEuro = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  function euros(n) { return formatEuro.format(n) + '\u00a0€'; }

  function pastilleEtat(etat, pct) {
    if (etat === 'depasse') return '<span class="statut statut--ko">Dépassé</span>';
    if (etat === 'alerte') return '<span class="statut statut--alerte">≥ ' + pct + ' %</span>';
    return '<span class="statut statut--ok">Sous le seuil</span>';
  }

  function rendreCompteur(ca) {
    var jalons = ca.jalons;
    var prochain = jalons.filter(function (j) { return j.cle === ca.prochain; })[0];
    var echelle = Math.max(ca.engage, Math.max.apply(null, jalons.map(function (j) { return j.seuil; }).concat([1]))) * 1.02;
    var pc = function (v) { return Math.min(v / echelle * 100, 100).toFixed(2) + '%'; };

    var message;
    if (!prochain) {
      message = '<p class="ca-message ca-message--alerte" role="alert">Tous les seuils sont dépassés.</p>';
    } else if (prochain.etat === 'alerte') {
      message = '<p class="ca-message ca-message--alerte" role="alert">Alerte — ' + esc(prochain.libelle) +
        ' : plus que <span class="mono">' + euros(prochain.reste) + '</span> avant <span class="mono">' + euros(prochain.seuil) + '</span>.</p>';
    } else {
      message = '<p class="ca-message">Prochain jalon — ' + esc(prochain.libelle) +
        ' — reste <span class="mono">' + euros(prochain.reste) + '</span> à encaisser.</p>';
    }
    // Seuil le plus élevé que le CA engagé franchirait (le plus lourd de conséquences).
    var risque = jalons.filter(function (j) { return j.etat !== 'depasse' && j.etatEngage === 'depasse'; }).pop();
    if (risque) {
      message += '<p class="ca-message ca-message--alerte">Avec le CA engagé : ' + esc(risque.libelle) +
        ' dépassé de <span class="mono">' + euros(-risque.resteEngage) + '</span>. ' + esc(risque.consequence) + '</p>';
    }

    return '<h2>Chiffre d\'affaires ' + esc(ca.annee) + '</h2>' +
      '<div class="ca-chiffres">' +
        '<div><div class="legende">Encaissé</div><div class="ca-chiffre__valeur">' + euros(ca.encaisse) + '</div></div>' +
        '<div><div class="legende">Engagé</div><div class="ca-chiffre__valeur ca-chiffre__valeur--second">' + euros(ca.engage) + '</div></div>' +
        '<div><div class="legende">Facturé ' + esc(ca.annee) + '</div><div class="ca-chiffre__valeur ca-chiffre__valeur--second">' + euros(ca.facture) + '</div></div>' +
      '</div>' +
      message +
      '<div class="jauge" role="img" aria-label="Encaissé ' + euros(ca.encaisse) + ', engagé ' + euros(ca.engage) + '">' +
        '<div class="jauge__engage" style="width:' + pc(ca.engage) + '"></div>' +
        '<div class="jauge__encaisse" style="width:' + pc(ca.encaisse) + '"></div>' +
        jalons.map(function (j) {
          return '<div class="jauge__repere' + (j.vise ? ' jauge__repere--vise' : '') + '" style="left:' + pc(j.seuil) + '" title="' + esc(j.libelle) + ' — ' + euros(j.seuil) + '"></div>';
        }).join('') +
      '</div>' +
      '<div class="cle-jauge"><span class="cle--encaisse">Encaissé</span><span class="cle--engage">Engagé</span><span class="cle--repere">Seuils</span></div>' +
      '<div class="tableau-conteneur"><table>' +
        '<thead><tr><th scope="col">Jalon</th><th scope="col" class="num">Seuil</th><th scope="col" class="num">Reste</th><th scope="col">État</th></tr></thead><tbody>' +
        jalons.map(function (j) {
          return '<tr><td>' + (j.vise ? '<strong>' + esc(j.libelle) + '</strong>' : esc(j.libelle)) + '<div class="legende">' + esc(j.consequence) + '</div></td>' +
            '<td class="num mono">' + euros(j.seuil) + '</td>' +
            '<td class="num mono">' + (j.reste >= 0 ? euros(j.reste) : '− ' + euros(-j.reste)) + '</td>' +
            '<td>' + pastilleEtat(j.etat, ca.alertePct) + '</td></tr>';
        }).join('') +
      '</tbody></table></div>' +
      '<p class="legende">Engagé = encaissé + factures non payées (' + euros(ca.aEncaisser) + ') + reste à facturer sur les affaires gagnées (' + euros(ca.resteAFacturer) + '). ' +
      'Factures et encaissements : onglet Exécution de chaque fiche affaire.</p>';
  }

  function ecranParametres(el) {
    el.innerHTML = titre('Paramètres', 'Listes : valeurs séparées par « ; ». Nombres : chiffres seuls.') +
      '<div class="chargement">Lecture des paramètres…</div>';

    charger('parametres', 'apiParametres', [], function (groupes) {
      var html = titre('Paramètres', 'Listes : valeurs séparées par « ; ». Nombres : chiffres seuls.');
      groupes.forEach(function (g) {
        html += '<section class="groupe-param"><h2>' + esc(g.titre) + '</h2>' + paramsPC(g.parametres) + '</section>';
      });
      el.innerHTML = html;
      brancherParams(el);
    }, function (e) {
      el.innerHTML = titre('Paramètres', '') + bandeauErreur(e);
    });
  }

  function paramsPC(params) {
    return '<div class="tableau-conteneur"><table>' +
      '<colgroup><col class="col-cle"><col class="col-val"><col class="col-com"><col><col class="col-act"></colgroup>' +
      '<thead><tr><th scope="col">Clé</th><th scope="col">Valeur</th><th scope="col">Commentaire</th><th scope="col">Modifié le</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
      params.map(function (p) {
        var long = p.valeur.indexOf(';') >= 0 || p.valeur.length > 40;
        var id = 'p-' + p.cle.replace(/[^a-z0-9]/gi, '-');
        var champ = long
          ? '<textarea class="champ mono" id="' + id + '" rows="2">' + esc(p.valeur) + '</textarea>'
          : '<input class="champ mono" id="' + id + '" type="text" value="' + esc(p.valeur) + '">';
        return '<tr data-cle="' + esc(p.cle) + '" data-initial="' + esc(p.valeur) + '">' +
          '<td><label class="param-cle" for="' + id + '">' + esc(p.cle) + '</label></td>' +
          '<td>' + champ + '</td>' +
          '<td class="param-com">' + esc(p.commentaire) + '</td>' +
          '<td class="param-date">' + esc(dateHeure(p.modifie_le)) + '</td>' +
          '<td><button class="bouton" type="button" disabled>Enregistrer</button></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  function brancherParams(racine) {
    $$('tr[data-cle]', racine).forEach(function (tr) {
      var champ = $('.champ', tr);
      var bouton = $('button', tr);
      var majEtat = function () {
        var modifie = champ.value !== tr.getAttribute('data-initial');
        champ.classList.toggle('est-modifie', modifie);
        bouton.disabled = !modifie;
      };
      var enregistrer = function () {
        if (bouton.disabled) return;
        bouton.disabled = true;
        bouton.textContent = 'Envoi…';
        appel('apiParametreEnregistrer', tr.getAttribute('data-cle'), champ.value).then(function (p) {
          tr.setAttribute('data-initial', p.valeur);
          champ.value = p.valeur;
          $('.param-date', tr).textContent = dateHeure(p.modifie_le);
          bouton.textContent = 'Enregistrer';
          majEtat();
          toast('Paramètre « ' + p.cle + ' » enregistré.');
        }).catch(function (e) {
          bouton.textContent = 'Enregistrer';
          majEtat();
          toast(e.message, true);
        });
      };
      champ.addEventListener('input', majEtat);
      champ.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && (champ.tagName === 'INPUT' || ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); enregistrer(); }
        if (ev.key === 'Escape') { champ.value = tr.getAttribute('data-initial'); majEtat(); }
      });
      bouton.addEventListener('click', enregistrer);
    });
  }

  // ——— Navigation ———
  // La web app tourne dans un iframe : on gère l'écran courant en JS et on reflète
  // l'ancre dans l'URL de la page parente via google.script.history (liens directs).
  var historique = window.google && google.script && google.script.history;

  // Chemin : « ecran » ou « ecran/paramètre » (ex. affaire/KA-2026-001).
  function afficher(chemin, pousser) {
    chemin = decodeURIComponent(String(chemin || '')).replace(/^#/, '');
    var i = chemin.indexOf('/');
    var nom = i < 0 ? chemin : chemin.slice(0, i);
    var param = i < 0 ? '' : chemin.slice(i + 1);
    if (!ECRANS[nom]) { nom = 'accueil'; param = ''; chemin = 'accueil'; }
    var onglet = ECRANS[nom].nav || nom;
    $$('.nav a').forEach(function (a) {
      if (a.getAttribute('href') === '#' + onglet) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    document.title = (param || ECRANS[nom].titre) + ' — Kompa Affaires';
    jetonEcran++;
    var el = $('#ecran');
    ECRANS[nom].rendu(el, param);
    if (pousser && historique) historique.push({ ecran: chemin }, {}, chemin);
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('a[href^="#"]');
    if (!a) return;
    ev.preventDefault();
    afficher(a.getAttribute('href').slice(1), true);
  });

  if (historique) {
    historique.setChangeHandler(function (e) { afficher((e.state && e.state.ecran) || e.location.hash || 'accueil', false); });
  }

  function demarrer() {
    if (window.google && google.script && google.script.url) {
      google.script.url.getLocation(function (loc) { afficher(loc.hash || 'accueil', false); });
    } else {
      afficher((location.hash || '').slice(1) || 'accueil', false);
    }
  }

  $('#pied').textContent = 'Kompa Affaires';

  // Utilitaires partagés avec les autres scripts de l'interface (AppAffaires…).
  window.KA = {
    appel: appel, $: $, $$: $$, esc: esc, toast: toast, titre: titre, bandeauErreur: bandeauErreur,
    dateHeure: dateHeure, euros: euros, ecrans: ECRANS, afficher: afficher,
    charger: charger, viderMemoire: viderMemoire
  };
  // Démarrage une fois tous les scripts chargés : les écrans des autres lots s'enregistrent avant.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else setTimeout(demarrer, 0);
})();
</script>
