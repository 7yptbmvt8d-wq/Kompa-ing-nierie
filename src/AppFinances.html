<script>
/* Kartes Affaires — écran Finances (réorganisation du 21/11/2026) et frise chronologique partagée. */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$, $$ = K.$$;
  function jour(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function ms(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime() : null; }
  var MOIS = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];

  /**
   * Frise chronologique : un axe commun (années, mois), une ou plusieurs pistes alignées.
   * opts : { debut, fin, aujourdhui (AAAA-MM-JJ), libelles: bool,
   *          pistes: [{ libelle (html), marques: [{ date, classe, titre, etiquette }], traits: [{ de, a, classe }] }] }
   */
  K.frise = function (opts) {
    var jr = 86400000;
    var dates = [opts.debut, opts.fin, opts.aujourdhui].map(ms).filter(function (x) { return x; });
    var t0 = Math.min.apply(null, dates) - 20 * jr, t1 = Math.max.apply(null, dates) + 25 * jr;
    var pos = function (iso) { return ((ms(iso) - t0) / (t1 - t0) * 100).toFixed(2) + '%'; };
    var reperes = '', axe = '';
    var d = new Date(t0); d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    var nbMois = (t1 - t0) / (30.4 * jr);
    while (d.getTime() < t1) {
      var x = ((d.getTime() - t0) / (t1 - t0) * 100).toFixed(2) + '%';
      if (d.getMonth() === 0) {
        reperes += '<span class="frise-annee" style="left:' + x + '"></span>';
        axe += '<span class="frise-axe__an" style="left:' + x + '">' + d.getFullYear() + '</span>';
      } else if (nbMois <= 30 || d.getMonth() % 3 === 0) {
        axe += '<span class="frise-axe__mois" style="left:' + x + '">' + MOIS[d.getMonth()] + '</span>';
      }
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    }
    var auj = '<span class="frise-auj" style="left:' + pos(opts.aujourdhui) + '"></span>';
    var lib = !!opts.libelles;
    var piste = function (p) {
      var traits = (p.traits || []).filter(function (t) { return t.de && t.a; }).map(function (t) {
        return '<span class="plan-trait ' + t.classe + '" style="left:' + pos(t.de) + ';width:calc(' + pos(t.a) + ' - ' + pos(t.de) + ')"></span>';
      }).join('');
      var marques = (p.marques || []).filter(function (m) { return m.date; }).map(function (m) {
        return '<span class="plan-m ' + m.classe + '" style="left:' + pos(m.date) + '" title="' + esc(m.titre || '') + '"></span>' +
          (m.etiquette ? '<span class="frise-etiq" style="left:' + pos(m.date) + '">' + esc(m.etiquette) + '</span>' : '');
      }).join('');
      return '<div class="frise-ligne' + (lib ? '' : ' frise-ligne--seule') + '">' + (lib ? '<div class="frise-lib">' + (p.libelle || '') + '</div>' : '') +
        '<div class="frise-piste">' + reperes + auj + traits + marques + '</div></div>';
    };
    return '<div class="frise">' +
      '<div class="frise-ligne frise-ligne--axe' + (lib ? '' : ' frise-ligne--seule') + '">' + (lib ? '<div class="frise-lib"></div>' : '') + '<div class="frise-axe">' + axe + '</div></div>' +
      (opts.pistes || []).map(piste).join('') + '</div>';
  };

  K.friseCle = function () {
    return '<div class="plan-cle legende"><span><i class="plan-m plan-liv"></i> livrable</span><span><i class="plan-m plan-fac"></i> facture</span>' +
      '<span><i class="plan-m plan-pay plan-pay--attente"></i> paiement attendu</span><span><i class="plan-m plan-pay plan-pay--paye"></i> payée</span>' +
      '<span><i class="plan-m plan-pay plan-pay--retard"></i> en retard</span><span><i class="plan-m plan-pay plan-pay--option"></i> tranche optionnelle</span>' +
      '<span><i class="plan-auj-cle"></i> aujourd\'hui</span></div>';
  };

  /** Marques et traits d'une ligne de planning (tranche). */
  K.friseTranche = function (l, etiquette) {
    var opt = l.affermissement === 'optionnelle';
    var marques = (l.livrables || []).filter(function (x) { return x.date; }).map(function (x) {
      return { date: x.date, classe: 'plan-liv' + (x.etat === 'remis' || x.etat === 'validé' ? ' est-fait' : ''), titre: 'Livrable ' + (l.tranche || '') + ' : ' + x.libelle + ' — ' + jour(x.date) + ' (' + x.etat + ')' };
    });
    var paiement = l.dateEncaissement || l.dateEcheance;
    var classeP = l.etat === 'payée' ? 'paye' : l.etat === 'en retard' ? 'retard' : opt ? 'option' : 'attente';
    if (l.dateFacture) marques.push({ date: l.dateFacture, classe: 'plan-fac' + (l.facture ? ' est-fait' : ''), titre: 'Facture ' + (l.facture ? l.facture.numero + ' émise' : 'prévue') + ' le ' + jour(l.dateFacture) });
    if (paiement) marques.push({ date: paiement, classe: 'plan-pay plan-pay--' + classeP, titre: (l.etat === 'payée' ? 'Payée le ' : 'Paiement attendu le ') + jour(paiement) + ' — ' + K.euros(l.montant), etiquette: etiquette });
    return { marques: marques, traits: l.dateFacture && paiement ? [{ de: l.dateFacture, a: paiement, classe: 'plan-trait--' + classeP }] : [] };
  };

  // ——— Écran Finances ———
  var ONGLETS = [['', 'Vue d\'ensemble'], ['previsionnel', 'Prévisionnel'], ['encaissements', 'Encaissements'], ['livre', 'Livre des recettes'], ['urssaf', 'URSSAF et CFE']];
  var ETATS = { 'à planifier': 'statut--neutre', 'prévue': 'statut--encours', 'facturée': 'statut--alerte', 'en retard': 'statut--ko', 'payée': 'statut--ok' };

  function ecranFinances(el, param) {
    var vue = ONGLETS.some(function (o) { return o[0] === param; }) ? param : '';
    el.innerHTML = K.titre('Finances', 'Base : CA encaissé (seuils de la micro-entreprise et de la franchise de TVA)') +
      '<nav class="sous-nav" aria-label="Finances">' + ONGLETS.map(function (o) {
        return '<a href="#finances' + (o[0] ? '/' + o[0] : '') + '"' + (o[0] === vue ? ' aria-current="page"' : '') + '>' + o[1] + '</a>';
      }).join('') + '</nav><div id="fin-contenu"><div class="chargement">Calcul…</div></div>';
    var zone = $('#fin-contenu', el);
    K.charger('finances', 'apiFinances', [], function (s) { rendre(zone, s, vue); }, function (e) { zone.innerHTML = K.bandeauErreur(e); });
  }

  function rendre(zone, s, vue) {
    if (vue === 'previsionnel') { K.rendrePrevisionnel(zone, s.previsionnel); return; }
    if (vue === 'encaissements') { rendreEncaissements(zone, s); return; }
    if (vue === 'livre') { chargerLivre(zone, null); return; }
    if (vue === 'urssaf') { zone.innerHTML = '<section class="carte" id="carte-urssaf"></section>'; K.fiscalAccueil($('#carte-urssaf', zone), s.fiscal); return; }
    var r = s.resume, an = s.previsionnel.annees;
    var ligne = function (lib, val, rouge) { return '<div class="ligne-fin' + (rouge ? ' ligne-fin--ko' : '') + '"><span>' + lib + '</span><strong class="mono">' + val + '</strong></div>'; };
    zone.innerHTML = '<div class="grille grille--finances">' +
        '<section class="carte" id="carte-ca">' + K.rendreCompteur(s.ca) + '</section>' +
        '<section class="carte"><h2>À encaisser</h2>' +
          ligne('Factures en attente', K.euros(r.enAttente)) +
          (r.nbRetard ? ligne('dont en retard (' + r.nbRetard + ')', K.euros(r.enRetard), true) : '') +
          ligne('À facturer (tranches fermes et affermies)', K.euros(r.aFacturer)) +
          (r.optionnel ? ligne('Tranches optionnelles non affermies', K.euros(r.optionnel)) : '') +
          (r.prochaineDeclaration ? ligne('Prochaine déclaration URSSAF (' + esc(r.prochaineDeclaration.libelle) + ')', jour(r.prochaineDeclaration.echeance) + (r.prochaineDeclaration.total !== null ? ' · ≈ ' + K.euros(r.prochaineDeclaration.total) : '')) : '') +
          (r.cfe ? ligne('Prochaine CFE (' + r.cfe.annee + ')', jour(r.cfe.echeance) + (r.cfe.montant !== null ? ' · ' + (r.cfe.estime ? '≈ ' : '') + K.euros(r.cfe.montant) : '')) : '') +
          '<p><a href="#finances/encaissements">Voir les encaissements</a> · <a href="#finances/urssaf">URSSAF et CFE</a></p></section>' +
      '</div>' +
      '<h2 class="sous-titre">Prévisionnel</h2><div class="tableau-conteneur"><table class="table-previsionnel"><thead><tr><th scope="col"><span class="seul-lecteur">Rubrique</span></th>' +
        an.map(function (a) { return '<th scope="col" class="num">' + a.annee + '</th>'; }).join('') + '</tr></thead><tbody>' +
        ['certain|CA certain', 'potentiel|+ potentiel', 'joursPrevu|Jours à produire'].map(function (x) {
          var k = x.split('|');
          return '<tr><th scope="row">' + k[1] + '</th>' + an.map(function (a) {
            return '<td class="num mono">' + (a[k[0]] ? (k[0] === 'joursPrevu' ? String(a[k[0]]).replace('.', ',') + ' j' : K.euros(a[k[0]])) : '<span class="vide">—</span>') + '</td>';
          }).join('') + '</tr>';
        }).join('') +
        '<tr><th scope="row">Plafond micro-entreprise</th>' + an.map(function (a) {
          var m = a.seuils.filter(function (x) { return x.cle === 'seuil.micro_plafond'; })[0];
          if (!m) return '<td></td>';
          var cls = m.etat === 'depasse' ? 'statut--ko' : m.etatTotal === 'depasse' || m.etat === 'alerte' ? 'statut--alerte' : 'statut--ok';
          var txt = m.etat === 'depasse' ? 'dépassé' : m.etatTotal === 'depasse' ? 'dépassé avec potentiel' : 'marge ' + K.euros(Math.max(m.seuil - a.certain, 0));
          return '<td class="num"><span class="statut ' + cls + '">' + txt + '</span></td>';
        }).join('') + '</tr>' +
      '</tbody></table></div><p><a href="#finances/previsionnel">Prévisionnel détaillé</a></p>';
  }

  function rendreEncaissements(zone, s) {
    var e = s.encaissements;
    if (!e.lignes.length) {
      zone.innerHTML = '<section class="qonto-fin" id="qonto-fin"></section><p class="vide">Aucune affaire gagnée à facturer.</p>';
      blocQontoFinances($('#qonto-fin', zone), zone);
      return;
    }
    var pistes = e.lignes.map(function (l) {
      var f = K.friseTranche(l, '');
      f.libelle = '<a href="#affaire/' + esc(l.id_affaire) + '" class="mono">' + esc(l.id_affaire) + '</a> ' + esc(l.acheteur) +
        ' · <strong>' + esc(l.tranche === 'MISSION' ? 'Mission' : (l.tranche || (l.facture ? l.facture.numero : ''))) + '</strong>' +
        (l.affermissement === 'optionnelle' ? ' <span class="legende">(optionnelle)</span>' : '');
      return f;
    });
    var table = e.lignes.map(function (l, i) {
      var action = l.etat === 'prévue' || l.etat === 'à planifier'
        ? (l.affermissement === 'optionnelle' ? '<button type="button" class="bouton bouton--petit bouton--discret" data-fin-affermir="' + i + '">Affermir</button>' : '<button type="button" class="bouton bouton--petit bouton--discret" data-fin-facturer="' + i + '">Facturer</button>')
        : l.etat === 'facturée' || l.etat === 'en retard' ? '<button type="button" class="bouton bouton--petit" data-fin-payer="' + i + '">Paiement reçu</button>' : '';
      var quand = l.etat === 'payée' ? 'payée le ' + jour(l.dateEncaissement) : l.dateEcheance ? (l.facture ? 'due le ' : 'prévue le ') + jour(l.dateEcheance) : 'à planifier';
      return '<tr><td><a href="#affaire/' + esc(l.id_affaire) + '" class="mono">' + esc(l.id_affaire) + '</a> ' + esc(l.acheteur) + '</td>' +
        '<td><strong class="mono">' + esc(l.tranche === 'MISSION' ? 'Mission' : l.tranche || '—') + '</strong>' + (l.affermissement === 'optionnelle' ? ' <span class="legende">optionnelle</span>' : '') + '</td>' +
        '<td class="num mono">' + K.euros(l.montant) + '</td>' +
        '<td><span class="statut ' + (ETATS[l.etat] || 'statut--neutre') + '">' + esc(l.etat) + '</span> <span class="legende">' + quand + '</span>' +
          (l.retard ? '<div class="plan-retard">' + l.retard.jours + ' j de retard · intérêts ≈ ' + K.euros(l.retard.interets) + ' + ' + K.euros(l.retard.indemnite) + '</div>' : '') + '</td>' +
        '<td>' + action + '</td></tr>';
    }).join('');
    zone.innerHTML = '<section class="qonto-fin" id="qonto-fin"></section>' +
      '<p class="legende">Toutes les affaires gagnées sur une même ligne de temps : facture à la remise du dernier livrable de chaque tranche, paiement à 30 jours.</p>' +
      K.friseCle() + K.frise({ debut: e.debut, fin: e.fin, aujourdhui: e.aujourdhui, libelles: true, pistes: pistes }) +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Affaire</th><th scope="col">Tranche</th><th scope="col" class="num">Montant HT</th><th scope="col">État</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
      table + '</tbody></table></div>';
    var recharger = function (s2) { K.viderMemoire(); rendreEncaissements(zone, s2); };
    blocQontoFinances($('#qonto-fin', zone), zone);
    $$('[data-fin-facturer]', zone).forEach(function (b) {
      b.addEventListener('click', function () {
        var l = e.lignes[Number(b.getAttribute('data-fin-facturer'))];
        var num = window.prompt('Facture de la tranche ' + l.tranche + ' (' + l.acheteur + ') — numéro de facture :', '');
        if (!num) return;
        K.appel('apiFinancesFacturer', l.id_affaire, l.tranche, { numero: num, date: l.dateFacture && l.dateFacture <= e.aujourdhui ? l.dateFacture : e.aujourdhui, montant: l.montant })
          .then(function (s2) { K.toast('Facture ' + num + ' enregistrée (montant ' + K.euros(l.montant) + ', modifiable dans la fiche).'); recharger(s2); })
          .catch(function (er) { K.toast(er.message, true); });
      });
    });
    $$('[data-fin-payer]', zone).forEach(function (b) {
      b.addEventListener('click', function () {
        var l = e.lignes[Number(b.getAttribute('data-fin-payer'))];
        var m = window.prompt('Paiement reçu pour ' + (l.facture ? l.facture.numero : l.tranche) + ' — montant (€) :', String(l.montant).replace('.', ','));
        if (m === null) return;
        K.appel('apiFinancesPaiement', l.facture.id, { date_encaissement: e.aujourdhui, montant_encaisse: m })
          .then(function (s2) { K.toast('Paiement enregistré à la date du jour.'); recharger(s2); })
          .catch(function (er) { K.toast(er.message, true); });
      });
    });
    $$('[data-fin-affermir]', zone).forEach(function (b) {
      b.addEventListener('click', function () {
        var l = e.lignes[Number(b.getAttribute('data-fin-affermir'))];
        K.afficher('affaire/' + l.id_affaire, true);
        K.toast('Affermissement : fiche › Mission › Marché, tranche ' + l.tranche + '.');
      });
    });
  }

  // ——— Livre des recettes (registre chronologique des encaissements) ———
  function chargerLivre(zone, annee) {
    zone.innerHTML = '<div class="chargement">Lecture des encaissements…</div>';
    K.appel('apiLivreRecettes', annee || '').then(function (l) { rendreLivre(zone, l); })
      .catch(function (er) { zone.innerHTML = K.bandeauErreur(er); });
  }

  function rendreLivre(zone, l) {
    var choixAn = '<label for="livre-annee">Année</label> <select class="champ" id="livre-annee">' + l.annees.map(function (a) {
      return '<option' + (a === l.annee ? ' selected' : '') + '>' + a + '</option>';
    }).join('') + '</select>';
    var lignes = l.lignes.map(function (x) {
      return '<tr><td class="mono livre-nowrap">' + jour(x.date) + '</td><td class="mono livre-nowrap">' + esc(x.numero) + '</td>' +
        '<td>' + esc(x.client) + (x.id_affaire ? ' <a href="#affaire/' + esc(x.id_affaire) + '" class="legende mono">' + esc(x.id_affaire) + '</a>' : '') + '</td>' +
        '<td>' + esc(x.nature) + '</td><td class="num mono">' + K.euros(x.montant) + '</td>' +
        '<td><select class="champ champ--petit" data-livre-mode="' + esc(x.id) + '" aria-label="Mode de règlement de la facture ' + esc(x.numero) + '">' + l.modes.map(function (m) {
          return '<option' + (m === x.mode ? ' selected' : '') + '>' + esc(m) + '</option>';
        }).join('') + '</select></td><td class="num mono">' + K.euros(x.cumul) + '</td></tr>';
    }).join('');
    zone.innerHTML = '<section class="carte"><div class="tableau-tete"><h2>Livre des recettes ' + l.annee + '</h2>' +
        '<div class="livre-actions">' + choixAn + ' <button type="button" class="bouton" data-livre-export' + (l.lignes.length ? '' : ' disabled') + '>Exporter (Google Sheets)</button></div></div>' +
      (l.lignes.length ? '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Encaissé le</th><th scope="col">Facture</th><th scope="col">Client</th><th scope="col">Nature de la prestation</th>' +
        '<th scope="col" class="num">Montant</th><th scope="col">Règlement</th><th scope="col" class="num">Cumul</th></tr></thead><tbody>' + lignes +
        '<tr class="ligne-total"><td colspan="4">Total ' + l.annee + '</td><td class="num mono">' + K.euros(l.total) + '</td><td colspan="2"></td></tr></tbody></table></div>'
        : '<p class="vide">Aucun encaissement en ' + l.annee + '.</p>') +
      '<p class="legende">Tenu automatiquement : chaque paiement enregistré (bouton « Paiement reçu » ou Qonto) s\'ajoute ici, par date d\'encaissement. ' +
      'Justificatifs : les factures correspondantes. Exportez l\'année en fin d\'exercice et conservez-la 10 ans avec les factures.</p></section>';
    $('#livre-annee', zone).addEventListener('change', function () { chargerLivre(zone, this.value); });
    $$('[data-livre-mode]', zone).forEach(function (s) {
      s.addEventListener('change', function () {
        K.appel('apiLivreMode', s.getAttribute('data-livre-mode'), s.value, l.annee).then(function () { K.toast('Mode de règlement enregistré.'); })
          .catch(function (er) { K.toast(er.message, true); });
      });
    });
    var bx = $('[data-livre-export]', zone);
    if (bx) bx.addEventListener('click', function () {
      bx.disabled = true; bx.textContent = 'Export…';
      K.appel('apiLivreExporter', l.annee).then(function (r) {
        bx.disabled = false; bx.textContent = 'Exporter (Google Sheets)';
        K.toast('Livre des recettes ' + l.annee + ' exporté dans Drive (sauvegardes › Livre des recettes).');
        window.open(r.url, '_blank', 'noopener');
      }).catch(function (er) { bx.disabled = false; bx.textContent = 'Exporter (Google Sheets)'; K.toast(er.message, true); });
    });
  }

  // ——— Qonto : synchronisation et factures à rattacher (Finances › Encaissements) ———
  function quandIso(iso) { var d = new Date(iso); return isNaN(d) ? '' : K.dateHeure(iso); }

  function blocQontoFinances(cible, zone) {
    if (!cible) return;
    K.appel('apiQontoEtat').then(function (q) { rendreQontoFinances(cible, zone, q); })
      .catch(function (er) { cible.innerHTML = K.bandeauErreur(er); });
  }

  function rendreQontoFinances(cible, zone, q) {
    if (!q.connecte) {
      cible.innerHTML = '<p class="bandeau">Vos factures sont émises dans Qonto : <a href="#parametres/finances">connectez Qonto</a> (Paramètres › Finances) pour récupérer automatiquement les factures et leurs paiements.</p>';
      return;
    }
    var options = q.affaires.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.id + ' — ' + a.acheteur) + '</option>'; }).join('');
    var aRatt = q.aRattacher.length ? '<h3>Factures Qonto à rattacher (' + q.aRattacher.length + ')</h3>' +
      '<p class="legende">Sans n° KA dans le champ « Bon de commande » de la facture Qonto. Elles comptent déjà dans le CA encaissé ; rattachez-les pour le planning de l\'affaire.</p>' +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">N°</th><th scope="col">Date</th><th scope="col" class="num">Montant HT</th><th scope="col">État</th><th scope="col">Affaire</th><th scope="col">Tranche</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
      q.aRattacher.map(function (f) {
        return '<tr data-rattacher="' + esc(f.id) + '"><td class="mono">' + (f.lien_facture ? '<a href="' + esc(f.lien_facture) + '" target="_blank" rel="noopener">' + esc(f.numero) + ' ↗</a>' : esc(f.numero)) + '</td>' +
          '<td class="mono">' + jour(f.date) + '</td><td class="num mono">' + K.euros(Number(f.montant) || 0) + '</td><td>' + esc(f.qonto_statut) + '</td>' +
          '<td><select class="champ champ--compact" data-ratt-affaire aria-label="Affaire de la facture ' + esc(f.numero) + '"><option value=""></option>' + options + '</select></td>' +
          '<td><select class="champ champ--compact" data-ratt-tranche aria-label="Tranche"><option value="">—</option></select></td>' +
          '<td><button type="button" class="bouton bouton--petit" data-ratt-ok disabled>Rattacher</button></td></tr>';
      }).join('') + '</tbody></table></div>' : '';
    var annulees = q.annulees.length ? '<p class="bandeau bandeau--erreur">Annulée' + (q.annulees.length > 1 ? 's' : '') + ' dans Qonto : ' +
      q.annulees.map(function (f) { return '<a href="#affaire/' + esc(f.id_affaire) + '" class="mono">' + esc(f.numero) + '</a>'; }).join(', ') +
      ' — exclue' + (q.annulees.length > 1 ? 's' : '') + ' du planning et des relances (rien n\'a été supprimé).</p>' : '';
    cible.innerHTML = '<div class="actions-ligne"><button type="button" class="bouton" data-qonto-synchro>Synchroniser Qonto</button>' +
      '<span class="legende">Qonto connecté · ' + (q.derniereSynchro ? 'dernière synchronisation le ' + quandIso(q.derniereSynchro) : 'jamais synchronisé') +
      ' · automatique chaque matin. Dans Qonto, indiquez le n° de l\'affaire et la tranche dans « Bon de commande » (ex. KI-2027-003 TF).</span></div>' + annulees + aRatt;
    $('[data-qonto-synchro]', cible).addEventListener('click', function () {
      var b = this; b.disabled = true; b.textContent = 'Synchronisation…';
      K.appel('apiQontoSynchroniser').then(function (r) {
        var bi = r.bilan;
        K.toast(bi.lues + ' facture(s) lue(s) dans Qonto : ' + bi.creees + ' ajoutée(s), ' + bi.majs + ' mise(s) à jour' + (bi.payees.length ? ', payée(s) : ' + bi.payees.join(', ') : '') + '.');
        K.viderMemoire();
        rendreEncaissements(zone, r.finances);
      }).catch(function (er) { b.disabled = false; b.textContent = 'Synchroniser Qonto'; K.toast(er.message, true); });
    });
    $$('[data-rattacher]', cible).forEach(function (tr) {
      var sa = $('[data-ratt-affaire]', tr), st = $('[data-ratt-tranche]', tr), ok = $('[data-ratt-ok]', tr);
      sa.addEventListener('change', function () {
        var a = q.affaires.filter(function (x) { return x.id === sa.value; })[0];
        st.innerHTML = '<option value="">—</option>' + (a ? a.tranches.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') : '');
        ok.disabled = !sa.value;
      });
      ok.addEventListener('click', function () {
        ok.disabled = true;
        K.appel('apiQontoRattacher', tr.getAttribute('data-rattacher'), sa.value, st.value).then(function (r) {
          K.toast('Facture rattachée à ' + sa.value + (st.value ? ' (' + st.value + ')' : '') + '.');
          K.viderMemoire();
          rendreEncaissements(zone, r.finances);
        }).catch(function (er) { ok.disabled = false; K.toast(er.message, true); });
      });
    });
  }

  // ——— Paramètres › Finances : connexion Qonto (clé API en lecture) ———
  K.blocQonto = function (cible) {
    K.appel('apiQontoEtat').then(function (q) { rendreBlocQonto(cible, q); }).catch(function (er) { cible.innerHTML = '<h2>Qonto (factures et paiements)</h2>' + K.bandeauErreur(er); });
  };

  function rendreBlocQonto(cible, q) {
    var tete = '<h2>Qonto (factures et paiements)</h2>';
    if (q.connecte) {
      cible.innerHTML = tete + '<p><span class="statut statut--ok">Connecté</span> identifiant <span class="mono">' + esc(q.identifiant) + '</span>' +
        (q.derniereSynchro ? ' · dernière synchronisation le ' + quandIso(q.derniereSynchro) : '') + '</p>' +
        '<p class="legende">L\'app lit vos factures clients Qonto chaque matin (et à la demande dans Finances › Encaissements) : numéro, date, montant, échéance, paiement. Elle ne crée ni ne modifie rien dans Qonto. ' +
        'Pour rattacher une facture à une affaire, indiquez dans Qonto, champ « Bon de commande » : le n° de l\'affaire et la tranche (ex. KI-2027-003 TF).</p>' +
        '<p><button type="button" class="bouton bouton--discret" data-qonto-oublier>Déconnecter Qonto</button></p>';
      $('[data-qonto-oublier]', cible).addEventListener('click', function () {
        if (!window.confirm('Déconnecter Qonto ? Les factures déjà récupérées restent dans l\'app.')) return;
        K.appel('apiQontoDeconnecter').then(function (q2) { K.toast('Qonto déconnecté.'); rendreBlocQonto(cible, q2); }).catch(function (er) { K.toast(er.message, true); });
      });
      return;
    }
    cible.innerHTML = tete +
      '<p class="legende">Dans Qonto : Paramètres › Intégrations et partenariats › Clé API. Copiez l\'identifiant et la clé secrète ci-dessous. ' +
      'La clé est gardée dans les propriétés du script (jamais dans le classeur) et sert seulement à lire les factures et leurs paiements.</p>' +
      '<form class="form-grille form-grille--4" data-qonto-form novalidate autocomplete="off">' +
        '<div class="champ-bloc"><label for="q-login">Identifiant</label><input class="champ mono" id="q-login" autocomplete="off" placeholder="ex. kompa-ingenierie-1234"></div>' +
        '<div class="champ-bloc"><label for="q-secret">Clé secrète</label><input class="champ mono" id="q-secret" type="password" autocomplete="new-password"></div>' +
        '<div class="bloc-form__actions"><button type="submit" class="bouton">Tester et enregistrer</button></div></form>';
    $('[data-qonto-form]', cible).addEventListener('submit', function (ev) {
      ev.preventDefault();
      var b = $('button[type=submit]', cible); b.disabled = true;
      K.appel('apiQontoConnecter', $('#q-login', cible).value, $('#q-secret', cible).value).then(function (r) {
        K.toast('Qonto connecté : ' + r.societe + '.');
        rendreBlocQonto(cible, r.etat);
      }).catch(function (er) { b.disabled = false; K.toast(er.message, true); });
    });
  }

  K.ecrans.finances = { titre: 'Finances', rendu: ecranFinances };
  K.ecrans.previsionnel = { titre: 'CA prévisionnel', nav: 'finances', rendu: function (el) { ecranFinances(el, 'previsionnel'); } };
})();
</script>
