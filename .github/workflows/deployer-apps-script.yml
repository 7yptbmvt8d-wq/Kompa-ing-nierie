# Déploiement automatique de Kompa Affaires dans Apps Script (plus de copier-coller).
# Mise en place unique : docs/deploiement-automatique.md (3 secrets GitHub).
# Tant que les secrets ne sont pas renseignés, ce workflow ne fait rien (il s'arrête sans erreur).
#
# À chaque push sur la branche de travail qui modifie dist/ (après tests), ou à la demande (onglet Actions) :
# 1. vérifie les tests ; 2. envoie dist/ (Code.gs, Estimation.gs, Index.html, appsscript.json) dans le projet Apps Script ;
# 3. crée une nouvelle version et met à jour le déploiement existant : l'adresse /exec de l'app ne change pas.
# Le classeur se complète tout seul au premier lancement (mise à jour automatique, ajouts seulement).

name: Déployer dans Apps Script

on:
  workflow_dispatch:
  push:
    branches: [claude/amazing-cray-l4l2w9]
    paths: ['dist/**', '.github/workflows/deployer-apps-script.yml']

concurrency:
  group: deploiement-apps-script
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secrets présents ?
        id: secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -n "$CLASPRC_JSON" ] && [ -n "$SCRIPT_ID" ] && [ -n "$DEPLOYMENT_ID" ]; then
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          else
            echo "ok=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement automatique non configuré (secrets CLASPRC_JSON, SCRIPT_ID, DEPLOYMENT_ID) : voir docs/deploiement-automatique.md"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'oui'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'oui'
        with:
          node-version: '22'

      - name: Tests (aucun envoi si un test échoue)
        if: steps.secrets.outputs.ok == 'oui'
        run: node tools/test-socle.js

      - name: Envoi du code et mise à jour du déploiement
        if: steps.secrets.outputs.ok == 'oui'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          # Jeton copié depuis un terminal : les retours à la ligne ajoutés à l'affichage sont retirés (JSON sur une ligne)
          printf '%s' "$CLASPRC_JSON" | tr -d '\r\n' > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'))" || {
            echo "::error::Le secret CLASPRC_JSON n'est pas un JSON lisible : recopier tout le texte de cat ~/.clasprc.json (de { à })."; exit 1; }
          # Identifiants copiés à la main : espaces et retours à la ligne retirés, format contrôlé (valeurs jamais affichées)
          SID=$(printf '%s' "$SCRIPT_ID" | tr -d '[:space:]')
          DID=$(printf '%s' "$DEPLOYMENT_ID" | tr -d '[:space:]')
          [[ "$SID" =~ ^[A-Za-z0-9_-]{40,}$ ]] || { echo "::error::SCRIPT_ID ne ressemble pas à un ID de script (${#SID} caractères) : éditeur Apps Script › Paramètres du projet › ID du script."; exit 1; }
          [[ "$DID" =~ ^AKfyc[A-Za-z0-9_-]{40,}$ ]] || { echo "::error::DEPLOYMENT_ID ne ressemble pas à un ID de déploiement (${#DID} caractères, doit commencer par AKfyc)."; exit 1; }
          [[ "$SID" != "$DID" ]] || { echo "::error::SCRIPT_ID et DEPLOYMENT_ID sont identiques : l'ID du script se trouve dans Paramètres du projet."; exit 1; }
          printf '{"scriptId":"%s","rootDir":"dist"}' "$SID" > .clasp.json
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "— Envoi du code (clasp push)"
          npx --yes @google/clasp@3.4.1 push --force
          echo "— Nouvelle version et mise à jour du déploiement"
          npx --yes @google/clasp@3.4.1 update-deployment "$DID" --description "Kompa Affaires $VERSION — ${GITHUB_SHA::7}"
          rm -f "$HOME/.clasprc.json" .clasp.json
