  function choisirCloture(a, choix, apres) {
    var corps = '<p class="legende">' + esc(a.id) + ' · ' + esc(a.acheteur) + '</p><div class="choix-statut">' +
      choix.map(function (s, i) {
        return '<label class="case"><input type="radio" name="cloture" value="' + esc(s) + '"' + (i === 0 ? ' checked' : '') + '> ' + pastille(s) + '</label>';
      }).join('') + '</div>';
    dialogue('Clôturer l\'affaire', corps, 'Continuer', function (form) {
      var s = $('input[name=cloture]:checked', form).value;
      setTimeout(function () { passerStatut(a, s, apres); }, 0);
    });
  }

  // ——— Fiche affaire ———
  var ongletFiche = 'identification';

  function ecranFiche(el, id) {
    el.innerHTML = '<p><a href="#affaires">← Affaires</a></p><div class="chargement">Lecture de l\'affaire…</div>';
    K.charger('affaire:' + id, 'apiAffaire', [id], function (f) {
      etat.meta = f.meta;
      rendreFiche(el, f);
    }, function (e) { el.innerHTML = '<p><a href="#affaires">← Affaires</a></p>' + K.bandeauErreur(e); });
  }

  function rendreFiche(el, f) {
    var a = f.affaire, meta = etat.meta;
    var liens = (a.lien_avis ? '<a class="bouton bouton--discret" href="' + esc(a.lien_avis) + '" target="_blank" rel="noopener" data-externe>Avis</a>' : '') +
      (a.lien_dce ? '<a class="bouton bouton--discret" href="' + esc(a.lien_dce) + '" target="_blank" rel="noopener" data-externe>Dossier Drive</a>' : '');
    var actions = f.transitions.map(function (s) {
      return '<button type="button" class="bouton" data-passer="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');
    var tete = '<p><a href="#affaires">← Affaires</a></p>' +
      '<header class="fiche-tete">' +
        '<div><div class="fiche-tete__ref mono">' + esc(a.id) + ' · ' + pastille(a.statut) + ' <span class="legende">depuis le ' + esc(K.dateHeure(a.date_statut).slice(0, 10)) + '</span></div>' +
        '<h1>' + esc(a.acheteur) + '</h1><p class="fiche-tete__objet">' + esc(a.objet) + '</p></div>' +
        '<div class="fiche-tete__actions">' + liens +
          (actions ? '<div class="fiche-tete__passages" role="group" aria-label="Changer de statut"><span class="legende">Passer en :</span>' + actions + '</div>' : '') +
        '</div>' +
      '</header>';

    var blocs = meta.blocs.slice();
    blocs.splice(1, 0, { id: 'pieces', titre: 'Pièces', champs: [] });
    var corps = '<div class="onglets" role="tablist">' + blocs.map(function (b) {
        return '<button type="button" role="tab" id="o-' + b.id + '" aria-controls="p-' + b.id + '" aria-selected="' + (b.id === ongletFiche) + '" data-onglet="' + b.id + '">' + esc(b.titre) + '</button>';
      }).join('') + '</div>' +
      blocs.map(function (b) {
        var html;
        if (b.id === 'journal') html = blocJournal(f);
        else if (b.id === 'pieces') html = '<div data-pieces><div class="chargement">Lecture du dossier Drive…</div></div>';
        else {
          html = '<form class="bloc-form" data-bloc="' + b.id + '" novalidate><div class="form-grille">' +
            b.champs.map(function (c) { return champHtml(c, a[c.nom], meta.listes, b.id); }).join('') + '</div>' +
            '<div class="bloc-form__actions"><button type="submit" class="bouton" disabled>Enregistrer</button></div></form>';
          if (b.id === 'resultat') html += tableCriteres(f.criteres);
          if (b.id === 'execution') html += tableFactures(f);
        }
        return '<section class="panneau" role="tabpanel" id="p-' + b.id + '" aria-labelledby="o-' + b.id + '"' + (b.id === ongletFiche ? '' : ' hidden') + '>' + html + '</section>';
      }).join('');
    el.innerHTML = tete + corps;
    brancherFiche(el, f);
    chargerPieces(el, a);
  }

  // ——— Pièces : dossier Drive de l'affaire ———
  function taille(o) {
    o = Number(o) || 0;
    return o >= 1048576 ? (o / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(o / 1024)) + ' Ko';
  }

  function chargerPieces(el, a) {
    var zone = $('[data-pieces]', el);
    if (!zone) return;
    K.charger('pieces:' + a.id, 'apiPieces', [a.id], function (p) { rendrePieces(zone, a, p); },
      function (e) { zone.innerHTML = K.bandeauErreur(e); });
  }

  function rendrePieces(zone, a, p) {
    var choixActuel = ($('#piece-dossier', zone) || {}).value;
    if (!p.url) {
      zone.innerHTML = '<p class="vide">Pas encore de dossier Drive : il sera créé au premier dépôt.</p>' + formDepot(a, p, choixActuel);
    } else {
      var listes = p.dossiers.map(function (d) {
        return '<section class="pieces__dossier"><h3><a href="' + esc(d.url) + '" target="_blank" rel="noopener" data-externe>' +
          esc(d.nom || 'Dossier de l\'affaire') + '</a> <span class="legende">' + d.fichiers.length + ' fichier' + (d.fichiers.length > 1 ? 's' : '') + '</span></h3>' +
          (d.fichiers.length ? '<ul class="pieces__liste">' + d.fichiers.map(function (x) {
            return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener" data-externe>' + esc(x.nom) + '</a>' +
              ' <span class="legende mono">' + esc(x.date) + ' · ' + taille(x.taille) + '</span></li>';
          }).join('') + '</ul>' : '') + '</section>';
      }).join('');
      zone.innerHTML = formDepot(a, p, choixActuel) + '<div class="pieces">' + listes + '</div>';
    }
    brancherDepot(zone, a, p);
  }

  function formDepot(a, p, choixActuel) {
    var noms = p.dossiers.map(function (d) { return d.nom; });
    var choisi = noms.indexOf(choixActuel) >= 0 ? choixActuel : p.parDefaut;
    var options = noms.length ? p.dossiers.map(function (d) {
      return '<option value="' + esc(d.nom) + '"' + (d.nom === choisi ? ' selected' : '') + '>' + esc(d.nom || 'Dossier de l\'affaire') + '</option>';
    }).join('') : '<option value="">Dossier de l\'affaire</option>';
    return '<div class="depot" data-depot>' +
      '<div class="depot__ligne"><label for="piece-dossier">Ranger dans</label> <select class="champ" id="piece-dossier">' + options + '</select></div>' +
      '<label class="depot__zone" for="piece-fichiers"><input type="file" id="piece-fichiers" multiple class="depot__input">' +
        '<span><strong>Glissez vos fichiers ici</strong> ou <span class="lien">cliquez pour les choisir</span></span>' +
        '<span class="legende">' + Math.round(p.tailleMax / 1048576) + ' Mo maximum par fichier' + (p.url ? ' · au-delà, <a href="' + esc(p.url) + '" target="_blank" rel="noopener" data-externe>ouvrez le dossier Drive</a>' : '') + '</span></label>' +
      '<p class="depot__etat legende" aria-live="polite"></p></div>';
  }

  function brancherDepot(zone, a, p) {
    var depot = $('[data-depot]', zone);
    var input = $('#piece-fichiers', zone);
    var cadre = $('.depot__zone', zone);
    var etatTxt = $('.depot__etat', zone);
    var occupe = false;
    var envoyer = function (liste) {
      if (occupe || !liste.length) return;
      var trop = liste.filter(function (f) { return f.size > p.tailleMax; });
      liste = liste.filter(function (f) { return f.size <= p.tailleMax; });
      if (trop.length) K.toast(trop.map(function (f) { return f.name; }).join(', ') + ' : plus de ' + Math.round(p.tailleMax / 1048576) + ' Mo, à déposer directement dans le dossier Drive.', true);
      if (!liste.length) return;
      occupe = true;
      depot.classList.add('est-occupe');
      var dossier = $('#piece-dossier', zone).value;
      var faits = 0, dernier = null;
      var suivant = function () {
        if (!liste.length) {
          occupe = false;
          depot.classList.remove('est-occupe');
          if (faits) K.toast(faits + ' fichier' + (faits > 1 ? 's rangés' : ' rangé') + ' dans « ' + (dossier || 'Dossier de l\'affaire') + ' ».');
          if (dernier) rendrePieces(zone, a, dernier);
          else etatTxt.textContent = '';
          return;
        }
        var f = liste.shift();
        etatTxt.textContent = 'Envoi de « ' + f.name + ' »…';
        lireBase64(f).then(function (donnees) {
          return K.appel('apiPieceDeposer', a.id, dossier, { nom: f.name, type: f.type, donnees: donnees });
        }).then(function (r) { faits++; dernier = r; }, function (e) { K.toast('« ' + f.name + ' » non déposé : ' + e.message, true); })
          .then(suivant);
      };
      suivant();
    };
    input.addEventListener('change', function () { envoyer(Array.prototype.slice.call(input.files)); input.value = ''; });
    ['dragenter', 'dragover'].forEach(function (t) {
      cadre.addEventListener(t, function (ev) { ev.preventDefault(); cadre.classList.add('est-survolee'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      cadre.addEventListener(t, function () { cadre.classList.remove('est-survolee'); });
    });
    cadre.addEventListener('drop', function (ev) {
      ev.preventDefault();
      envoyer(Array.prototype.slice.call(ev.dataTransfer.files || []));
    });
  }

  function lireBase64(fichier) {
    return new Promise(function (ok, ko) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { ko(new Error('lecture du fichier impossible')); };
      r.readAsDataURL(fichier);
    });
  }

  function blocJournal(f) {
    return '<form class="note-form" data-note><label for="note-texte">Ajouter une note</label>' +
      '<textarea class="champ" id="note-texte" rows="2" placeholder="Appel de l\'acheteur, question posée, visite…"></textarea>' +
      '<div class="bloc-form__actions"><button type="submit" class="bouton">Ajouter la note</button></div></form>' +
      '<h3>Notes</h3>' + (f.affaire.notes ? '<div class="notes pre">' + esc(f.affaire.notes) + '</div>' : '<p class="vide">Aucune note.</p>') +
      '<h3>Historique des statuts</h3><div class="tableau-conteneur"><table><thead><tr><th scope="col">Date</th><th scope="col">Passage</th><th scope="col">Commentaire</th></tr></thead><tbody>' +
      f.historique.slice().reverse().map(function (h) {
        return '<tr><td class="mono">' + esc(K.dateHeure(h.date)) + '</td><td>' + (h.ancien_statut ? esc(h.ancien_statut) + ' → ' : '') + pastille(h.nouveau_statut) + '</td><td>' + esc(h.commentaire) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (f.relances.length ? '<h3>Relances</h3><ul class="liste-simple">' + f.relances.map(function (r) {
        return '<li><span class="mono">' + jour(r.date_prevue) + '</span> · ' + esc(r.type) + ' · <strong>' + esc(r.statut) + '</strong>' + (r.date_faite ? ' le <span class="mono">' + jour(r.date_faite) + '</span>' : '') + '</li>';
      }).join('') + '</ul>' : '');
  }

  function tableCriteres(criteres) {
    var total = function (k) { return criteres.reduce(function (s, c) { return s + (Number(c[k]) || 0); }, 0); };
    var ligne = function (c, i) {
      return '<tr><td><input class="champ" aria-label="Critère ' + (i + 1) + '" data-c="critere" value="' + esc(c.critere || '') + '"></td>' +
        ['ponderation', 'note_kompa', 'note_attributaire'].map(function (k) {
          return '<td><input class="champ mono num" inputmode="decimal" aria-label="' + k + ' ' + (i + 1) + '" data-c="' + k + '" value="' + esc(c[k] === undefined ? '' : c[k]) + '"></td>';
        }).join('') + '</tr>';
    };
    var lignes = criteres.concat([{}, {}]);
    return '<form class="bloc-form" data-criteres novalidate><h3>Notes par critère</h3>' +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Critère</th><th scope="col" class="num">Pondération</th><th scope="col" class="num">Note Kompa</th><th scope="col" class="num">Note attributaire</th></tr></thead><tbody>' +
      lignes.map(ligne).join('') +
      '<tr class="ligne-total"><td>Total</td><td class="num mono">' + total('ponderation') + '</td><td class="num mono">' + total('note_kompa') + '</td><td class="num mono">' + total('note_attributaire') + '</td></tr>' +
      '</tbody></table></div><p class="legende">Critères et pondérations : ceux du règlement de consultation (ex. valeur technique 60, prix 40). Notes : celles de la lettre de rejet ou du rapport d\'analyse, sur le barème de l\'acheteur. Laisser le nom du critère vide pour supprimer une ligne.</p>' +
      '<div class="bloc-form__actions"><button type="submit" class="bouton">Enregistrer les critères</button></div></form>';
  }

  function tableFactures(f) {
    var t = f.totaux;
    var resume = '<dl class="totaux"><div><dt>Facturé</dt><dd class="mono">' + K.euros(t.facture) + '</dd></div>' +
      '<div><dt>Encaissé</dt><dd class="mono">' + K.euros(t.encaisse) + '</dd></div>' +
      '<div><dt>Reste à facturer</dt><dd class="mono">' + K.euros(t.resteAFacturer) + '</dd></div></dl>';
    var lignes = f.factures.map(function (x) {
      var enc = !x.date_encaissement
        ? '<button type="button" class="bouton bouton--discret" data-encaisser="' + esc(x.id) + '" data-montant="' + esc(x.montant) + '">Encaissée</button>'
        : '<span class="mono">' + jour(x.date_encaissement) + '</span>';
      return '<tr><td class="mono">' + esc(x.numero) + '</td><td class="mono">' + jour(x.date) + '</td><td class="num mono">' + montant(x.montant) + '</td>' +
        '<td class="mono">' + jour(x.date_echeance) + '</td><td>' + enc + '</td><td class="num mono">' + montant(x.montant_encaisse) + '</td></tr>';
    }).join('');
    var table = '<h3>Factures</h3>' + resume + (f.factures.length ? '<div class="tableau-conteneur"><table><thead><tr><th scope="col">N°</th><th scope="col">Date</th><th scope="col" class="num">Montant</th><th scope="col">Échéance</th><th scope="col">Encaissement</th><th scope="col" class="num">Encaissé</th></tr></thead><tbody>' + lignes + '</tbody></table></div>' : '<p class="vide">Aucune facture.</p>');
    return table + (f.affaire.statut === 'Gagnée'
      ? '<form class="bloc-form ligne-ajout" data-facture novalidate><h3>Nouvelle facture</h3><div class="form-grille form-grille--4">' +
        champHtml({ nom: 'numero', libelle: 'N°', type: 'texte', obligatoire: true }, '', {}, 'f') +
        champHtml({ nom: 'date', libelle: 'Date', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'f') +
        champHtml({ nom: 'montant', libelle: 'Montant', type: 'euros', obligatoire: true }, '', {}, 'f') +
        champHtml({ nom: 'date_echeance', libelle: 'Échéance (vide = +30 j)', type: 'date' }, '', {}, 'f') +
        '</div><div class="bloc-form__actions"><button type="submit" class="bouton">Ajouter la facture</button></div></form>'
      : '<p class="legende">Les factures se saisissent une fois l\'affaire gagnée.</p>');
  }

  function brancherFiche(el, f) {
    var a = f.affaire;
    var recharger = function (fiche) { rendreFiche(el, fiche); };
    $$('[data-passer]', el).forEach(function (b) {
      b.addEventListener('click', function () { passerStatut(a, b.getAttribute('data-passer'), recharger); });
    });
    $$('[data-onglet]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        ongletFiche = b.getAttribute('data-onglet');
        $$('[data-onglet]', el).forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
        $$('.panneau', el).forEach(function (p) { p.hidden = p.id !== 'p-' + ongletFiche; });
      });
    });
    // Blocs : bouton actif dès qu'un champ change
    $$('form[data-bloc]', el).forEach(function (form) {
      var bouton = $('button[type=submit]', form);
      var initial = JSON.stringify(lireChamps(form));
      form.addEventListener('input', function () { bouton.disabled = JSON.stringify(lireChamps(form)) === initial; });
      form.addEventListener('change', function () { bouton.disabled = JSON.stringify(lireChamps(form)) === initial; });
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var manquant = $$('[required]', form).filter(function (x) { return !String(x.value).trim(); })[0];
        if (manquant) { K.toast('Champ obligatoire : ' + $('label[for="' + manquant.id + '"]', form).textContent.replace('*', '').trim(), true); manquant.focus(); return; }
        bouton.disabled = true;
        K.appel('apiAffaireMaj', a.id, lireChamps(form)).then(function (fiche) {
          K.toast('Bloc « ' + form.getAttribute('data-bloc') + ' » enregistré.');
          recharger(fiche);
        }).catch(function (e) { bouton.disabled = false; K.toast(e.message, true); });
      });
    });
    var fc = $('form[data-criteres]', el);
    if (fc) fc.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var lignes = $$('tbody tr', fc).filter(function (tr) { return $('[data-c]', tr); }).map(function (tr) {
        var o = {}; $$('[data-c]', tr).forEach(function (i) { o[i.getAttribute('data-c')] = i.value; }); return o;
      });
      K.appel('apiCriteres', a.id, lignes).then(function (fiche) { K.toast('Critères enregistrés.'); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); });
    });
    var ff = $('form[data-facture]', el);
    if (ff) ff.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = lireChamps(ff);
      if (!v.numero || !v.montant) { K.toast('N° et montant obligatoires.', true); return; }
      K.appel('apiFactureAjouter', a.id, v).then(function (fiche) { K.toast('Facture ' + v.numero + ' ajoutée.'); recharger(fiche); })
        .catch(function (e) { K.toast(e.message, true); });
    });
    $$('[data-encaisser]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var corps = '<div class="form-grille">' +
          champHtml({ nom: 'date_encaissement', libelle: 'Date d\'encaissement', type: 'date', obligatoire: true }, aujourdhuiIso(), {}, 'e') +
          champHtml({ nom: 'montant_encaisse', libelle: 'Montant encaissé', type: 'euros', obligatoire: true }, b.getAttribute('data-montant'), {}, 'e') + '</div>';
        dialogue('Encaissement', corps, 'Enregistrer', function (form) {
          return K.appel('apiFactureMaj', a.id, b.getAttribute('data-encaisser'), lireChamps(form)).then(function (fiche) {
            K.toast('Encaissement enregistré.'); recharger(fiche);
          });
        });
      });
    });
    var fn = $('form[data-note]', el);
    if (fn) fn.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var t = $('#note-texte', fn).value;
      if (!t.trim()) return;
      var zone = $('.notes', el) || (function () { var d = document.createElement('div'); d.className = 'notes pre'; fn.insertAdjacentElement('afterend', d); return d; })();
      var p = function (n) { return String(n).padStart(2, '0'); }, d = new Date();
      zone.textContent = (zone.textContent ? zone.textContent + '\n' : '') + '[' + p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '] ' + t.trim();
      $('#note-texte', fn).value = '';
      K.toast('Note ajoutée.');
      K.appel('apiAffaireNote', a.id, t).then(function (fiche) { recharger(fiche); })
        .catch(function (e) { K.toast('Note non enregistrée : ' + e.message, true); });
    });
  }

  // Liens externes (avis, DCE) : nouvel onglet, sans passer par le routeur interne.
  document.addEventListener('click', function (ev) {
    var x = ev.target.closest('a[data-externe]');
    if (x) ev.stopPropagation();
  }, true);

  K.ecrans.affaires = { titre: 'Affaires', rendu: ecranAffaires };
  K.ecrans.affaire = { titre: 'Affaire', nav: 'affaires', rendu: ecranFiche };
})();
</script>
  <script>
/* Kompa Affaires — lot 3 : écran Veille (avis collectés, Étudier / Ignorer, journal du moteur). */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$, $$ = K.$$;

  var filtres = { zone: 'toutes', classement: 'utiles', statut: 'nouveau', echus: false };
  try { Object.assign(filtres, JSON.parse(localStorage.getItem('ka.veille') || '{}')); } catch (e) { /* défaut */ }
  function memoriser() { try { localStorage.setItem('ka.veille', JSON.stringify(filtres)); } catch (e) { /* sans effet */ } }

  function jour(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
  }
  function joursAvant(iso) {
    if (!iso) return null;
    var d = new Date(iso); d.setHours(0, 0, 0, 0);
    var auj = new Date(); auj.setHours(0, 0, 0, 0);
    return Math.round((d - auj) / 86400000);
  }

  function ecranVeille(el) {
    el.innerHTML = K.titre('Veille', '') + '<div class="chargement">Lecture des avis…</div>';
    K.charger('veille', 'apiVeille', [], function (r) { rendre(el, r); },
      function (e) { el.innerHTML = K.titre('Veille', '') + K.bandeauErreur(e); });
  }

  function rendre(el, r) {
    var tous = r.avis;
    var visibles = tous.filter(function (a) {
      if (filtres.zone === 'paca' && a.zone !== r.paca) return false;
      if (filtres.zone === 'france' && a.zone === r.paca) return false;
      if (filtres.classement === 'etudier' && a.classement !== 'à étudier') return false;
      if (filtres.classement === 'utiles' && a.classement === 'archivé') return false;
      if (filtres.classement === 'archives' && a.classement !== 'archivé') return false;
      if (filtres.statut !== 'tous' && a.statut !== filtres.statut && !(filtres.statut === 'nouveau' && a.statut === 'archivé' && filtres.classement === 'archives')) return false;
      var n = joursAvant(a.date_limite);
      if (!filtres.echus && n !== null && n < 0) return false;
      return true;
    }).sort(function (x, y) { return (Number(y.pre_score) || 0) - (Number(x.pre_score) || 0); });

    var dernier = r.journal[0];
    var sousTitre = tous.length + ' avis · ' + (dernier ? 'dernière collecte le ' + K.dateHeure(dernier.date) : 'aucune collecte') + ' · collecte automatique à ' + r.heure + ' h';
    var select = function (nom, options) {
      return '<select class="champ" data-filtre="' + nom + '" aria-label="' + nom + '">' + options.map(function (o) {
        return '<option value="' + o[0] + '"' + (filtres[nom] === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select>';
    };
    var barre = '<div class="barre-outils">' +
      '<button type="button" class="bouton" data-action="collecter">Collecter maintenant</button>' +
      select('zone', [['toutes', 'Toutes zones'], ['paca', r.paca], ['france', 'Hors PACA']]) +
      select('classement', [['utiles', 'À étudier + possibles'], ['etudier', 'À étudier (≥ ' + r.seuils.etudier + ')'], ['archives', 'Archivés (< ' + r.seuils.possible + ')'], ['tous', 'Tous les scores']]) +
      select('statut', [['nouveau', 'Nouveaux'], ['étudié', 'Étudiés'], ['ignoré', 'Ignorés'], ['tous', 'Tous statuts']]) +
      '<label class="case"><input type="checkbox" data-filtre="echus"' + (filtres.echus ? ' checked' : '') + '> Afficher les avis échus</label>' +
      '</div>';

    var table = visibles.length ? '<div class="tableau-conteneur"><table class="table-veille"><thead><tr>' +
      '<th scope="col" class="num">Score</th><th scope="col">Parution</th><th scope="col">Acheteur</th><th scope="col">Objet</th>' +
      '<th scope="col">Date limite</th><th scope="col">Zone</th><th scope="col"><span class="seul-lecteur">Actions</span></th></tr></thead><tbody>' +
      visibles.map(function (a) { return ligne(a, r); }).join('') + '</tbody></table></div>'
      : '<div class="bandeau">Aucun avis pour ces filtres.' + (tous.length ? '' : ' Lancez une première collecte avec « Collecter maintenant ».') + '</div>';

    var journal = '<h3>Journal du moteur</h3>' + (r.journal.length ? '<div class="tableau-conteneur"><table><thead><tr>' +
      '<th scope="col">Date</th><th scope="col">Source</th><th scope="col" class="num">Lus</th><th scope="col" class="num">Retenus</th>' +
      '<th scope="col" class="num">Exclus</th><th scope="col" class="num">Doublons</th><th scope="col">Erreurs</th></tr></thead><tbody>' +
      r.journal.map(function (j) {
        return '<tr><td class="mono">' + esc(K.dateHeure(j.date)) + '</td><td>' + esc(j.source) + '</td>' +
          '<td class="num mono">' + esc(j.avis_lus) + '</td><td class="num mono">' + esc(j.avis_retenus) + '</td>' +
          '<td class="num mono">' + esc(j.exclus) + '</td><td class="num mono">' + esc(j.doublons) + '</td>' +
          '<td>' + (j.erreurs ? '<span class="statut statut--ko">' + esc(j.erreurs) + '</span>' : '<span class="legende">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="vide">Aucune collecte pour l\'instant.</p>');

    el.innerHTML = K.titre('Veille', sousTitre) + barre + table + journal;
    brancher(el, r);
  }

  function ligne(a, r) {
    var n = joursAvant(a.date_limite);
    var delai = n === null ? '<span class="vide">inconnue</span>'
      : '<span class="mono">' + jour(a.date_limite) + '</span> ' +
        (n < 0 ? '<span class="statut statut--neutre">échu</span>' : a.alerte_delai ? '<span class="statut statut--alerte">J-' + n + '</span>' : '<span class="mono legende">J-' + n + '</span>');
    var actions;
    if (a.statut === 'étudié') {
      actions = '<a class="bouton bouton--discret" href="#affaire/' + esc(a.id_affaire) + '">' + esc(a.id_affaire) + '</a>';
    } else if (a.statut === 'ignoré') {
      actions = '<button type="button" class="bouton bouton--discret" data-restaurer="' + esc(a.id) + '">Restaurer</button>';
    } else {
      actions = '<button type="button" class="bouton" data-etudier="' + esc(a.id) + '">Étudier</button>' +
        '<button type="button" class="bouton bouton--discret" data-ignorer="' + esc(a.id) + '">Ignorer</button>';
    }
    var liens = [a.lien].concat(String(a.liens_autres || '').split('\n')).filter(Boolean);
    return '<tr data-avis="' + esc(a.id) + '">' +
      '<td class="num"><span class="score score--' + (a.classement === 'à étudier' ? 'haut' : a.classement === 'possible' ? 'moyen' : 'bas') + ' mono" title="' + esc(a.score_detail) + '">' + esc(a.pre_score) + '</span></td>' +
      '<td class="mono">' + jour(a.date_parution) + '</td>' +
      '<td>' + esc(a.acheteur) + (a.departement ? ' <span class="mono legende">(' + esc(a.departement) + ')</span>' : '') +
        '<div class="legende">' + esc(a.type_acheteur) + '</div></td>' +
      '<td class="objet-veille">' + esc(a.objet) + '<div class="legende">' + esc(a.source) + (a.procedure ? ' · ' + esc(a.procedure) : '') +
        (a.montant_estime ? ' · <span class="mono">' + K.euros(Number(a.montant_estime)) + '</span>' : '') + ' · ' +
        liens.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener" data-externe>' + (i ? 'lien ' + (i + 1) : 'Voir l\'avis') + '</a>'; }).join(' · ') +
      '</div></td>' +
      '<td>' + delai + '</td>' +
      '<td>' + (a.zone === r.paca ? '<strong>' + esc(r.paca) + '</strong>' : '<span class="legende" title="' + esc(a.zone) + '">Hors PACA</span>') + '</td>' +
      '<td class="actions-veille">' + actions + '</td></tr>';
  }

  function brancher(el, r) {
    $$('[data-filtre]', el).forEach(function (f) {
      f.addEventListener('change', function () {
        var nom = f.getAttribute('data-filtre');
        filtres[nom] = f.type === 'checkbox' ? f.checked : f.value;
        memoriser();
        rendre(el, r);
      });
    });
    $('[data-action="collecter"]', el).addEventListener('click', function (ev) {
      var b = ev.currentTarget;
      b.disabled = true; b.textContent = 'Collecte en cours…';
      K.appel('apiCollecter').then(function (bilan) {
        K.toast(bilan.map(function (x) { return x.source + ' : ' + x.retenus + ' nouveau(x)' + (x.erreurs ? ' — erreur' : ''); }).join(' · '));
        ecranVeille(el);
      }).catch(function (e) { K.toast(e.message, true); b.disabled = false; b.textContent = 'Collecter maintenant'; });
    });
    $$('[data-etudier]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        b.disabled = true;
        b.textContent = 'Création…';
        K.toast('Création de l\'affaire et de son dossier Drive…');
        K.appel('apiAvisEtudier', b.getAttribute('data-etudier')).then(function (affaire) {
          K.toast('Affaire ' + affaire.id + ' créée (En étude).');
          K.afficher('affaire/' + affaire.id, true);
        }).catch(function (e) { b.disabled = false; K.toast(e.message, true); });
      });
    });
    var changer = function (attr, statut, message) {
      $$('[' + attr + ']', el).forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute(attr);
          var a = r.avis.filter(function (x) { return x.id === id; })[0];
          var avant = a ? a.statut : null;
          if (a) a.statut = statut;
          rendre(el, r);
          K.toast(message);
          K.appel('apiAvisStatut', id, statut).catch(function (e) {
            if (a) a.statut = avant;
            rendre(el, r);
            K.toast('Non enregistré : ' + e.message, true);
          });
        });
      });
    };
    changer('data-ignorer', 'ignoré', 'Avis ignoré.');
    changer('data-restaurer', 'nouveau', 'Avis restauré.');
  }

  K.ecrans.veille = { titre: 'Veille', rendu: ecranVeille };
})();
</script>
  <script>
/* Kompa Affaires — lot 4 : échéancier (calendrier, relances, modèles de courriers, e-mail du matin). */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$, $$ = K.$$;
  var moisAffiche = '';

  var CLASSES_TYPE = {
    'Remise': 'ech--remise', 'Questions': 'ech--secondaire', 'Visite': 'ech--secondaire',
    'Décision': 'ech--attente', 'Facturation': 'ech--argent', 'Encaissement': 'ech--argent'
  };
  var NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  function jour(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
  }
  function relatif(n) {
    if (n === 0) return 'aujourd\'hui';
    return n > 0 ? 'J-' + n : 'retard ' + (-n) + ' j';
  }
  function decaler(mois, n) {
    var m = mois.split('-').map(Number);
    var d = new Date(m[0], m[1] - 1 + n, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function ecranEcheancier(el) {
    el.innerHTML = K.titre('Échéancier', '') + '<div class="chargement">Calcul des échéances…</div>';
    K.charger('echeancier:' + (moisAffiche || 'courant'), 'apiEcheancier', [moisAffiche], function (r) {
      if (!moisAffiche) moisAffiche = r.mois;
      rendre(el, r);
    }, function (e) { el.innerHTML = K.titre('Échéancier', '') + K.bandeauErreur(e); });
  }

  function rendre(el, r) {
    var actions = '<div class="barre-outils">' +
      '<button type="button" class="bouton bouton--discret" data-action="apercu">Aperçu de l\'e-mail du matin</button>' +
      '<button type="button" class="bouton bouton--discret" data-action="envoyer">Envoyer l\'e-mail maintenant</button></div>';
    el.innerHTML = K.titre('Échéancier', r.relances.length + ' relance' + (r.relances.length > 1 ? 's' : '') + ' à faire · ' + r.prochaines.length + ' échéance' + (r.prochaines.length > 1 ? 's' : '') + ' à 60 jours') +
      actions + blocRelances(r) + blocCalendrier(r) + blocListe(r);
    brancher(el, r);
  }

  function blocRelances(r) {
    if (!r.relances.length) return '<h2>Relances</h2><p class="vide">Aucune relance à faire.</p>';
    return '<h2>Relances à faire</h2><div class="tableau-conteneur"><table><thead><tr>' +
      '<th scope="col">Prévue le</th><th scope="col">Relance</th><th scope="col">Affaire</th><th scope="col">Note</th><th scope="col"><span class="seul-lecteur">Actions</span></th></tr></thead><tbody>' +
      r.relances.map(function (x) {
        var n = x.jours;
        return '<tr><td class="mono">' + jour(x.date_prevue) + ' ' + (n <= 0 ? '<span class="statut statut--alerte">' + relatif(n) + '</span>' : '<span class="legende mono">' + relatif(n) + '</span>') + '</td>' +
          '<td><strong>' + esc(x.type) + '</strong></td>' +
          '<td><a href="#affaire/' + esc(x.id_affaire) + '" class="mono">' + esc(x.id_affaire) + '</a> ' + esc(x.acheteur) + '</td>' +
          '<td class="legende">' + esc(x.commentaire) + '</td>' +
          '<td class="actions-veille"><button type="button" class="bouton" data-courrier="' + esc(x.id) + '">Courrier</button>' +
          '<button type="button" class="bouton bouton--discret" data-relance="' + esc(x.id) + '" data-statut="faite">Faite</button>' +
          '<button type="button" class="bouton bouton--discret" data-relance="' + esc(x.id) + '" data-statut="sans objet">Sans objet</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function blocCalendrier(r) {
    var parJour = {};
    r.calendrier.forEach(function (e) { (parJour[e.date] = parJour[e.date] || []).push(e); });
    var m = r.mois.split('-').map(Number);
    var debut = r.grille.debut.split('-').map(Number);
    var d = new Date(debut[0], debut[1] - 1, debut[2]);
    var fin = r.grille.fin;
    var cases = [];
    while (true) {
      var cle = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var dansMois = d.getMonth() === m[1] - 1;
      var items = parJour[cle] || [];
      cases.push('<div class="cal-jour' + (dansMois ? '' : ' cal-jour--hors') + (cle === r.aujourdhui ? ' cal-jour--auj' : '') + '">' +
        '<div class="cal-jour__num mono">' + d.getDate() + '</div>' +
        items.map(function (e) {
          return '<a class="ech ' + (CLASSES_TYPE[e.type] || '') + (e.depassee ? ' ech--depassee' : '') + '" href="#affaire/' + esc(e.id_affaire) + '" title="' + esc(e.libelle + ' — ' + e.acheteur + ' — ' + e.objet) + '">' +
            esc(e.type) + ' · ' + esc(e.acheteur) + '</a>';
        }).join('') + '</div>');
      if (cle === fin) break;
      d.setDate(d.getDate() + 1);
    }
    return '<div class="cal-tete"><h2>' + NOMS_MOIS[m[1] - 1] + ' ' + m[0] + '</h2><div class="bascule">' +
      '<button type="button" class="bouton bouton--discret" data-mois="-1" aria-label="Mois précédent">‹</button>' +
      '<button type="button" class="bouton bouton--discret" data-mois="0">Aujourd\'hui</button>' +
      '<button type="button" class="bouton bouton--discret" data-mois="1" aria-label="Mois suivant">›</button></div></div>' +
      '<div class="cal"><div class="cal-entete">' + ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'].map(function (j) { return '<div>' + j + '</div>'; }).join('') + '</div>' +
      '<div class="cal-grille">' + cases.join('') + '</div></div>' +
      '<p class="legende cle-cal"><span class="ech ech--remise">Remise</span> <span class="ech ech--secondaire">Questions, visite</span> <span class="ech ech--attente">Décision attendue</span> <span class="ech ech--argent">Facturation, encaissement</span></p>';
  }

  function blocListe(r) {
    if (!r.prochaines.length) return '<h2>Prochaines échéances</h2><p class="vide">Aucune échéance dans les 60 jours.</p>';
    return '<h2>Prochaines échéances (60 jours) et retards</h2><div class="tableau-conteneur"><table><thead><tr>' +
      '<th scope="col">Date</th><th scope="col">Échéance</th><th scope="col">Affaire</th><th scope="col">Statut</th></tr></thead><tbody>' +
      r.prochaines.map(function (e) {
        var badge = e.depassee ? '<span class="statut statut--ko">' + relatif(e.jours) + '</span>'
          : e.urgent || e.alerte ? '<span class="statut statut--alerte">' + relatif(e.jours) + '</span>' : '<span class="legende mono">' + relatif(e.jours) + '</span>';
        return '<tr><td class="mono">' + jour(e.date) + ' ' + badge + '</td><td>' + esc(e.libelle) + '</td>' +
          '<td><a href="#affaire/' + esc(e.id_affaire) + '" class="mono">' + esc(e.id_affaire) + '</a> ' + esc(e.acheteur) + '</td><td>' + esc(e.statut || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function copier(texte, zone) {
    var ok = function () { K.toast('Copié dans le presse-papiers.'); };
    var secours = function () {
      zone.focus(); zone.select();
      try { document.execCommand('copy'); ok(); } catch (e) { K.toast('Sélectionnez le texte et copiez-le (Ctrl+C).', true); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(ok, secours);
    else secours();
  }

  function ouvrirCourrier(id) {
    K.appel('apiCourrier', id).then(function (c) {
      var d = document.createElement('dialog');
      d.className = 'dialogue dialogue--large';
      d.innerHTML = '<h2>Modèle — ' + esc(c.type) + '</h2>' +
        '<p class="legende">Destinataire : ' + esc(c.destinataire) + ' · compléter les informations entre crochets avant l\'envoi.</p>' +
        '<div class="champ-bloc"><label for="c-objet">Objet</label><div class="champ-lien"><input class="champ" id="c-objet" readonly value="' + esc(c.objet) + '">' +
        '<button type="button" class="bouton bouton--discret" data-copier="c-objet">Copier</button></div></div>' +
        '<div class="champ-bloc" style="margin-top:12px"><label for="c-corps">Texte</label><textarea class="champ courrier" id="c-corps" readonly rows="16">' + esc(c.corps) + '</textarea></div>' +
        '<div class="dialogue__actions"><button type="button" class="bouton bouton--discret" data-fermer>Fermer</button>' +
        '<button type="button" class="bouton" data-copier="c-corps">Copier le texte</button></div>';
      document.body.appendChild(d);
      $$('[data-copier]', d).forEach(function (b) {
        b.addEventListener('click', function () { var z = $('#' + b.getAttribute('data-copier'), d); copier(z.value, z); });
      });
      $('[data-fermer]', d).addEventListener('click', function () { d.close(); d.remove(); });
      d.addEventListener('cancel', function () { d.remove(); });
      d.showModal();
    }).catch(function (e) { K.toast(e.message, true); });
  }

  function apercuEmail() {
    K.appel('apiEmailApercu').then(function (m) {
      var d = document.createElement('dialog');
      d.className = 'dialogue dialogue--large';
      d.innerHTML = '<h2>Aperçu de l\'e-mail du matin</h2><p class="legende mono">' + esc(m.sujet) + '</p>' +
        '<iframe class="apercu-email" title="Aperçu de l\'e-mail"></iframe>' +
        '<div class="dialogue__actions"><button type="button" class="bouton" data-fermer>Fermer</button></div>';
      document.body.appendChild(d);
      $('iframe', d).srcdoc = m.html;
      $('[data-fermer]', d).addEventListener('click', function () { d.close(); d.remove(); });
      d.addEventListener('cancel', function () { d.remove(); });
      d.showModal();
    }).catch(function (e) { K.toast(e.message, true); });
  }

  function brancher(el, r) {
    $$('[data-mois]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var n = Number(b.getAttribute('data-mois'));
        moisAffiche = n === 0 ? '' : decaler(moisAffiche, n);
        ecranEcheancier(el);
      });
    });
    $$('[data-courrier]', el).forEach(function (b) { b.addEventListener('click', function () { ouvrirCourrier(b.getAttribute('data-courrier')); }); });
    $$('[data-relance]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-relance'), statut = b.getAttribute('data-statut');
        var avant = r.relances.slice();
        r.relances = r.relances.filter(function (x) { return x.id !== id; });
        rendre(el, r);
        K.toast('Relance marquée « ' + statut + ' ».');
        K.appel('apiRelanceStatut', id, statut).catch(function (e) {
          r.relances = avant;
          rendre(el, r);
          K.toast('Non enregistré : ' + e.message, true);
        });
      });
    });
    $('[data-action="apercu"]', el).addEventListener('click', apercuEmail);
    $('[data-action="envoyer"]', el).addEventListener('click', function (ev) {
      var b = ev.currentTarget; b.disabled = true;
      K.appel('apiEmailEnvoyer').then(function (res) {
        b.disabled = false;
        K.toast(res.envoye ? 'E-mail envoyé à ' + res.destinataire + '.' : 'Pas d\'envoi : ' + res.motif + '.');
      }).catch(function (e) { b.disabled = false; K.toast(e.message, true); });
    });
  }

  // Cartes de l'accueil : échéances à 7 jours et relances à faire
  K.suiviAccueil = function (elEch, elRel, donnees) {
    (donnees ? Promise.resolve(donnees) : K.appel('apiSuivi')).then(function (s) {
      elEch.innerHTML = '<h2>Échéances à 7 jours</h2>' + (s.echeances.length ? '<ul class="liste-suivi">' + s.echeances.map(function (e) {
        return '<li><span class="mono">' + jour(e.date) + '</span> ' + (e.depassee ? '<span class="statut statut--ko">' + relatif(e.jours) + '</span>' : e.urgent ? '<span class="statut statut--alerte">' + relatif(e.jours) + '</span>' : '<span class="legende mono">' + relatif(e.jours) + '</span>') +
          '<br><a href="#affaire/' + esc(e.id_affaire) + '">' + esc(e.libelle) + '</a> — ' + esc(e.acheteur) + '</li>';
      }).join('') + '</ul>' : '<p class="vide">Aucune échéance dans les 7 jours.</p>');
      elRel.innerHTML = '<h2>Relances à faire</h2>' + (s.relances.length ? '<ul class="liste-suivi">' + s.relances.map(function (x) {
        return '<li><span class="mono">' + jour(x.date_prevue) + '</span> <strong>' + esc(x.type) + '</strong><br>' + esc(x.acheteur) + '</li>';
      }).join('') + '</ul><p><a href="#echeancier">Ouvrir l\'échéancier</a></p>' : '<p class="vide">Aucune relance à faire.</p>');
    }).catch(function (e) { elEch.innerHTML = '<h2>Échéances à 7 jours</h2>' + K.bandeauErreur(e); });
  };

  K.ecrans.echeancier = { titre: 'Échéancier', rendu: ecranEcheancier };
})();

  <script>
/* Kompa Affaires — lot 5 : tableau de bord (accueil) et écran Enseignements. */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$;

  var pct = function (x, d) { return x === null || x === undefined ? '—' : (x * 100).toFixed(d === undefined ? 0 : d).replace('.', ',') + ' %'; };
  var pctSigne = function (x) { return x === null || x === undefined ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(1).replace('.', ',') + ' %'; };
  var nb = function (x, d) { return x === null || x === undefined ? '—' : Number(x).toFixed(d || 0).replace('.', ','); };
  var signe = function (x, d) { return x === null || x === undefined ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + nb(Math.abs(x), d); };
  function jour(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }

  function tuile(libelle, valeur, detail, info) {
    return '<div class="tuile" title="' + esc(info || '') + '"><div class="tuile__libelle">' + esc(libelle) + '</div>' +
      '<div class="tuile__valeur mono">' + valeur + '</div><div class="tuile__detail">' + detail + '</div></div>';
  }

  /** Barres horizontales d'une seule teinte (grandeur), valeur en texte, info-bulle au survol. */
  function barres(lignes, vide) {
    if (!lignes.length) return '<p class="vide">' + esc(vide) + '</p>';
    var max = Math.max.apply(null, lignes.map(function (l) { return l.valeur; }).concat([1]));
    return '<div class="barres" role="list">' + lignes.map(function (l) {
      return '<div class="barre" role="listitem" title="' + esc(l.libelle + ' : ' + l.valeur) + '">' +
        '<span class="barre__libelle">' + esc(l.libelle) + '</span>' +
        '<span class="barre__piste"><span class="barre__valeur-trait" style="width:' + (l.valeur / max * 100).toFixed(1) + '%"></span></span>' +
        '<span class="barre__nombre mono">' + l.valeur + '</span></div>';
    }).join('') + '</div>';
  }

  // ——— Tableau de bord (accueil) ———
  K.tableauAccueil = function (el, donnees) {
    (donnees ? Promise.resolve(donnees) : K.appel('apiTableau')).then(function (t) {
      var a = t.attribution;
      var tuiles = '<div class="tuiles">' +
        tuile('Affaires en cours', nb(t.enCours), t.parStatut.filter(function (s) { return s.actif && s.nombre; }).map(function (s) { return esc(s.statut) + ' ' + s.nombre; }).join(' · ') || 'aucune', 'En étude, Go, Déposée, Gagnée') +
        tuile('Taux de Go', pct(t.go.taux), t.go.go + ' Go / ' + (t.go.go + t.go.nogo) + ' décisions', 'Go / (Go + No-go), 12 mois glissants') +
        tuile('Taux d\'attribution', pct(a.taux), a.gagnees + ' gagnée(s) / ' + (a.gagnees + a.perdues) + ' · en montant ' + pct(a.tauxMontant), 'Gagnées / (gagnées + perdues) ; en montant : montant gagné / montant des offres jugées ; 12 mois glissants') +
        tuile('Rang moyen', nb(t.rangMoyen, 1), t.rangsConnus + ' rang(s) connu(s)', 'Moyenne des rangs renseignés, 12 mois glissants') +
        tuile('Écart de prix', pctSigne(t.ecartPrixMoyen), 'moyenne sur ' + t.perduesAnalysees + ' perdue(s) · + = plus cher', '(votre prix − prix attributaire) / prix attributaire, affaires perdues') +
        tuile('Écart de note technique', signe(t.ecartNoteMoyen, 1), 'points, moyenne des perdues · − = en dessous', 'Votre note technique − note de l\'attributaire') +
        tuile('Coût de la réponse ' + t.annee, t.cout.joursPour10k === null ? '—' : nb(t.cout.joursPour10k, 1) + ' j', 'pour 10 000 € gagnés (' + nb(t.cout.jours) + ' j de réponse)', 'Jours passés à répondre / montants notifiés, année civile') +
        tuile('CA ' + t.annee, K.euros(t.ca.encaisse), 'encaissé · signé ' + K.euros(t.ca.signe) + ' · facturé ' + K.euros(t.ca.facture), 'CA signé, facturé, encaissé : année civile') +
        '</div>';
      var statuts = barres(t.parStatut.filter(function (s) { return s.actif; }).map(function (s) { return { libelle: s.statut, valeur: s.nombre }; }), '');
      var clotures = t.parStatut.filter(function (s) { return !s.actif && s.nombre; });
      var motifs = '<h3>No-go</h3>' + barres(t.motifsNogo.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucun No-go sur 12 mois.') +
        '<h3>Rejets (pièce à améliorer)</h3>' + barres(t.motifsRejet.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucune offre perdue sur 12 mois.');
      el.innerHTML = '<div class="tableau-tete"><h2>Tableau de bord</h2><span class="legende">12 mois glissants : du ' + jour(t.fenetre.debut) + ' au ' + jour(t.fenetre.fin) + '</span></div>' + tuiles +
        '<div class="grille grille--tableau">' +
          '<section class="carte"><h2>Affaires en cours par statut</h2>' + statuts +
            (clotures.length ? '<p class="legende">Clôturées sur 12 mois : ' + clotures.map(function (s) { return esc(s.statut) + ' ' + s.nombre; }).join(' · ') + '</p>' : '') + '</section>' +
          '<section class="carte"><h2>Motifs, 12 mois</h2>' + motifs + '<p><a href="#enseignements">Voir les enseignements</a></p></section>' +
        '</div>';
    }).catch(function (e) { el.innerHTML = '<h2>Tableau de bord</h2>' + K.bandeauErreur(e); });
  };

  // ——— Déclarations URSSAF (accueil) ———
  var ETATS_DECL = {
    'déclarée': 'statut--ok', 'en retard': 'statut--ko', 'à déclarer': 'statut--alerte',
    'en cours': 'statut--encours', 'à venir': 'statut--neutre', 'non suivie': 'statut--neutre'
  };

  K.fiscalAccueil = function (el, donnees) {
    (donnees ? Promise.resolve(donnees) : K.appel('apiFiscal')).then(function (d) { rendreFiscal(el, d); })
      .catch(function (e) { el.innerHTML = '<h2>Déclarations URSSAF</h2>' + K.bandeauErreur(e); });
  };

  function rendreFiscal(el, d) {
    var eur = function (x) { return x === null || x === undefined ? '<span class="vide">—</span>' : K.euros(x); };
    var tx = function (x) { return x === null ? '?' : (x * 100).toFixed(1).replace('.', ',').replace(',0', '') + ' %'; };
    var lignes = d.periodes.map(function (p) {
      var etat = '<span class="statut ' + (ETATS_DECL[p.etat] || 'statut--neutre') + '">' + esc(p.etat) + '</span>' +
        (p.date_declaration ? ' <span class="legende mono">' + jour(p.date_declaration) + '</span>' : '');
      var action = (p.etat === 'à déclarer' || p.etat === 'en retard')
        ? '<button type="button" class="bouton" data-declarer="' + esc(p.id) + '" data-ca="' + esc(p.ca) + '" data-libelle="' + esc(p.libelle) + '">Déclarée</button>'
        : p.etat === 'déclarée' ? '<button type="button" class="bouton bouton--discret" data-annuler-decl="' + esc(p.id) + '">Annuler</button>' : '';
      return '<tr><td><strong>' + esc(p.libelle) + '</strong><div class="legende mono">' + jour(p.debut) + ' – ' + jour(p.fin) + '</div></td>' +
        '<td class="num mono">' + eur(p.ca) + '</td><td class="num mono">' + eur(p.cotisations) + '</td><td class="num mono">' + eur(p.cfp) + '</td>' +
        '<td class="num mono">' + eur(p.impot) + '</td><td class="num mono"><strong>' + eur(p.total) + '</strong></td>' +
        '<td class="mono">' + jour(p.echeance) + '</td><td>' + etat + '</td><td class="actions-veille">' + action + '</td></tr>';
    }).join('');
    var t = d.totaux;
    el.innerHTML = '<div class="tableau-tete"><h2>Déclarations URSSAF ' + d.annee + ' — ' + esc(d.periodicite) + 's</h2>' +
        '<span class="legende">Base : CA encaissé de la période</span></div>' +
      (d.tauxManquants ? '<div class="bandeau">Renseignez le taux de vos cotisations sociales (<span class="mono">fiscal.taux_cotisations</span>, onglet Paramètres › Déclarations URSSAF) pour estimer les sommes à payer. Il figure sur votre espace autoentrepreneur.urssaf.fr.</div>' : '') +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Période</th><th scope="col" class="num">CA encaissé</th>' +
      '<th scope="col" class="num">Cotisations (' + tx(d.taux.cotisations) + ')</th><th scope="col" class="num">CFP (' + tx(d.taux.cfp) + ')</th>' +
      '<th scope="col" class="num">Impôt' + (d.taux.versementLiberatoire ? ' (VL ' + tx(d.taux.impot) + ')' : ' (sans VL)') + '</th>' +
      '<th scope="col" class="num">Total estimé</th><th scope="col">À déclarer avant</th><th scope="col">État</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
      lignes +
      '<tr class="ligne-total"><td>Année ' + d.annee + '</td><td class="num mono">' + eur(t.ca) + '</td><td class="num mono">' + eur(t.cotisations) + '</td>' +
      '<td class="num mono">' + eur(t.cfp) + '</td><td class="num mono">' + eur(t.impot) + '</td><td class="num mono">' + eur(t.total) + '</td><td colspan="3"></td></tr>' +
      '</tbody></table></div>' +
      '<p class="legende">Estimations calculées avec les taux de l\'onglet Paramètres, à vérifier chaque année sur votre espace URSSAF. ' +
      'Une relance « Déclaration URSSAF » apparaît dans l\'échéancier et l\'e-mail du matin tant qu\'une période terminée n\'est pas marquée déclarée.</p>';

    Array.prototype.forEach.call(el.querySelectorAll('[data-declarer]'), function (b) {
      b.addEventListener('click', function () { dialogueDeclarer(el, b.getAttribute('data-declarer'), b.getAttribute('data-libelle'), b.getAttribute('data-ca')); });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-annuler-decl]'), function (b) {
      b.addEventListener('click', function () {
        K.appel('apiAnnulerDeclaration', b.getAttribute('data-annuler-decl')).then(function (r) { K.toast('Déclaration annulée.'); rendreFiscal(el, r); })
          .catch(function (e) { K.toast(e.message, true); });
      });
    });
  }

  function dialogueDeclarer(el, id, libelle, ca) {
    var d = document.createElement('dialog');
    d.className = 'dialogue';
    var auj = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    d.innerHTML = '<form method="dialog" novalidate><h2>Déclaration ' + esc(libelle) + '</h2>' +
      '<div class="form-grille">' +
      '<div class="champ-bloc"><label for="d-ca">CA déclaré (€)</label><input class="champ mono num" id="d-ca" inputmode="decimal" value="' + esc(ca) + '"></div>' +
      '<div class="champ-bloc"><label for="d-date">Date de la déclaration</label><input class="champ mono" type="date" id="d-date" value="' + auj.getFullYear() + '-' + p(auj.getMonth() + 1) + '-' + p(auj.getDate()) + '"></div>' +
      '</div><div class="dialogue__actions"><button type="button" class="bouton bouton--discret" data-fermer>Annuler</button><button type="submit" class="bouton">Enregistrer</button></div></form>';
    document.body.appendChild(d);
    var fermer = function () { d.close(); d.remove(); };
    d.querySelector('[data-fermer]').addEventListener('click', fermer);
    d.addEventListener('cancel', function () { d.remove(); });
    d.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      K.appel('apiDeclarer', id, d.querySelector('#d-ca').value, d.querySelector('#d-date').value).then(function (r) {
        fermer(); K.toast(libelle + ' marquée déclarée.'); rendreFiscal(el, r);
      }).catch(function (e) { K.toast(e.message, true); });
    });
    d.showModal();
  }

  // ——— Écran Enseignements ———
  function ecranEnseignements(el) {
    el.innerHTML = K.titre('Enseignements', '') + '<div class="chargement">Lecture des affaires perdues…</div>';
    K.charger('enseignements', 'apiEnseignements', [], function (r) {
      var l = r.lignes;
      var tuiles = '<div class="tuiles tuiles--3">' +
        tuile('Écart de prix moyen', pctSigne(r.moyennes.ecartPrix), '12 mois glissants · + = plus cher que l\'attributaire', '') +
        tuile('Écart de note technique moyen', signe(r.moyennes.ecartNote, 1), 'points · − = en dessous de l\'attributaire', '') +
        tuile('Rang moyen', nb(r.moyennes.rang, 1), 'résultats des 12 derniers mois', '') + '</div>';
      var table = l.length ? '<div class="tableau-conteneur"><table class="table-enseignements"><thead><tr>' +
        '<th scope="col">Affaire</th><th scope="col">Résultat</th><th scope="col" class="num">Votre prix</th><th scope="col" class="num">Attributaire</th>' +
        '<th scope="col" class="num">Écart prix</th><th scope="col" class="num">Note tech.</th><th scope="col" class="num">Écart</th><th scope="col" class="num">Rang</th>' +
        '<th scope="col">Motifs et enseignements</th></tr></thead><tbody>' +
        l.map(function (x) {
          return '<tr><td><a href="#affaire/' + esc(x.id) + '" class="mono">' + esc(x.id) + '</a><div><strong>' + esc(x.acheteur) + '</strong></div><div class="legende">' + esc(x.objet) + '</div>' + (x.exercice ? '<span class="statut statut--neutre">exercice — hors indicateurs</span>' : '') + '</td>' +
            '<td class="mono">' + jour(x.date_resultat) + '</td>' +
            '<td class="num mono">' + (x.montant_ht ? K.euros(x.montant_ht) : '—') + '</td>' +
            '<td class="num mono">' + (x.prix_attributaire ? K.euros(x.prix_attributaire) : '—') + '<div class="legende">' + esc(x.attributaire) + '</div></td>' +
            '<td class="num mono">' + pctSigne(x.ecartPrix) + '</td>' +
            '<td class="num mono">' + (x.noteKompa === null ? '—' : nb(x.noteKompa, 1) + ' / ' + nb(x.noteAttributaire, 1)) + '</td>' +
            '<td class="num mono">' + signe(x.ecartNote, 1) + '</td>' +
            '<td class="num mono">' + nb(x.rang) + '</td>' +
            '<td class="enseignement">' +
              (x.motifs_rejet ? '<div><span class="legende">Motifs :</span> ' + esc(x.motifs_rejet) + '</div>' : '<div class="vide">Motifs non reçus</div>') +
              (x.points_faibles ? '<div><span class="legende">Points faibles :</span> ' + esc(x.points_faibles) + '</div>' : '') +
              (x.action_corrective ? '<div><span class="legende">Action :</span> ' + esc(x.action_corrective) + '</div>' : '') +
              (x.piece_type ? '<div><span class="statut statut--neutre">' + esc(x.piece_type) + '</span></div>' : '') +
            '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="bandeau">Aucune offre perdue pour l\'instant.</div>';
      var motifs = '<div class="grille"><section class="carte"><h2>Pièces à améliorer (12 mois)</h2>' +
        barres(r.motifsRejet.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucune offre perdue sur 12 mois.') + '</section>' +
        '<section class="carte"><h2>Motifs de No-go (12 mois)</h2>' +
        barres(r.motifsNogo.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucun No-go sur 12 mois.') + '</section></div>';
      el.innerHTML = K.titre('Enseignements', l.length + ' offre' + (l.length > 1 ? 's' : '') + ' perdue' + (l.length > 1 ? 's' : '')) + tuiles + table + '<h2 class="sous-titre">Répartition</h2>' + motifs;
    }, function (e) { el.innerHTML = K.titre('Enseignements', '') + K.bandeauErreur(e); });
  }

  K.ecrans.enseignements = { titre: 'Enseignements', rendu: ecranEnseignements };
})();
</script>
</body>
</html>
