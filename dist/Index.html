<!DOCTYPE html>
<!-- Kompa Affaires 1.2.2 — fichier généré par tools/build.js depuis src/. Ne pas modifier ici. -->
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
/* Kompa Ingénierie — variables de la charte (V1).
   Copie conforme de charte/kompa-kit/tokens.css (sans l'@import des polices,
   chargées dans Styles.html). En cas de mise à jour du kit, recopier ce bloc. */
:root {
  /* Couleurs */
  --kompa-encre: #0B1220;        /* [commun] texte courant */
  --kompa-ardoise: #1B263B;      /* [commun] logo, titres, fonds sombres */
  --kompa-rouille: #B4460E;      /* accent sur fond clair (5:1 sur papier) */
  --kompa-rouille-clair: #E2733A;/* accent sur fond sombre (≥ 5:1 sur ardoise/encre) */
  --kompa-papier: #F6F5F1;       /* fond des documents */
  --kompa-brume: #EEF1F6;        /* [commun] bandeaux, aplats, en-têtes de tableau */
  --kompa-gris: #4A5568;         /* [commun] texte secondaire, légendes */
  --kompa-filet: #D5DBE5;        /* [commun] traits, bordures de tableau */
  --kompa-blanc: #FFFFFF;
  --kompa-texte-inverse: #EEF2F8;        /* texte sur ardoise */
  --kompa-texte-inverse-2: #A3B0C4;      /* texte secondaire sur ardoise */

  /* Typographie */
  --kompa-font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --kompa-font-mono: "IBM Plex Mono", "Consolas", "Courier New", monospace;

  --kompa-fs-display: 68px;  /* accroche plaquette / couverture — 700, -0.015em */
  --kompa-fs-h1: 40px;       /* 700, -0.015em */
  --kompa-fs-h2: 28px;       /* 700, -0.01em */
  --kompa-fs-h3: 20px;       /* 600 */
  --kompa-fs-body: 16px;     /* 400, interligne 1.55 */
  --kompa-fs-small: 14px;    /* 400 */
  --kompa-fs-kicker: 13px;   /* 600, capitales, interlettrage 0.14em */
  --kompa-fs-mono: 14px;     /* 500 — références */

  /* Formes */
  --kompa-radius-sm: 4px;
  --kompa-radius: 12px;
  --kompa-radius-lg: 16px;
  --kompa-radius-icone: 22%;
  --kompa-filet-section: 2px solid var(--kompa-ardoise);
  --kompa-filet-etape: 4px solid var(--kompa-rouille);
  --kompa-filet-fin: 1px solid var(--kompa-filet);

  /* Espacements (base 4) */
  --kompa-s1: 4px;  --kompa-s2: 8px;  --kompa-s3: 12px; --kompa-s4: 16px;
  --kompa-s5: 24px; --kompa-s6: 32px; --kompa-s7: 48px; --kompa-s8: 64px;
}
</style>
<style>
/* Extension propre à l'app Kompa Affaires — absente du kit.
   Statuts (§ 10 du cahier des charges) : une couleur par famille, toujours avec
   un libellé texte. Contrastes vérifiés ≥ 4,5:1 (texte sur fond indiqué). */
:root {
  --app-statut-encours: var(--kompa-ardoise);      /* sur brume : 13,4:1 */
  --app-statut-encours-fond: var(--kompa-brume);
  --app-statut-abandonnee: var(--kompa-gris);      /* sur brume : 6,7:1 */
  --app-statut-abandonnee-fond: var(--kompa-brume);
  --app-statut-gagnee: #1E6B3A;                    /* sur son fond : 5,7:1 */
  --app-statut-gagnee-fond: #E6F2EA;
  --app-statut-perdue: #9B1C1C;                    /* sur son fond : 6,8:1 */
  --app-statut-perdue-fond: #F9E6E6;

  --app-focus: var(--kompa-ardoise);
}
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Styles Kompa Affaires — couleurs : variables de Tokens.html uniquement. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { min-width: 1024px; }
body {
  background: var(--kompa-blanc);
  color: var(--kompa-encre);
  font-family: var(--kompa-font-sans);
  font-size: var(--kompa-fs-body);
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
.mono { font-family: var(--kompa-font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
a { color: var(--kompa-ardoise); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--app-focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.seul-lecteur { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ——— En-tête ardoise ——— */
.entete {
  background: var(--kompa-ardoise);
  color: var(--kompa-texte-inverse);
  position: sticky; top: 0; z-index: 10;
  }
.entete__barre {
  display: flex; align-items: center; gap: var(--kompa-s6);
  max-width: 1280px; margin: 0 auto; padding: 0 var(--kompa-s5);
  min-height: 60px;
}
.marque { display: flex; align-items: center; gap: var(--kompa-s3); color: inherit; text-decoration: none; flex-shrink: 0; }
.marque svg { height: 32px; width: auto; display: block; }
.marque__nom { font-weight: 700; font-size: 17px; letter-spacing: 0.01em; white-space: nowrap; }
.marque__nom span { font-weight: 500; color: var(--kompa-texte-inverse-2); }

.nav { display: flex; gap: var(--kompa-s1); overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  color: var(--kompa-texte-inverse-2); text-decoration: none; white-space: nowrap;
  padding: 0 var(--kompa-s3); min-height: 60px; display: flex; align-items: center;
  border-bottom: 3px solid transparent; font-weight: 500; font-size: 15px;
}
.nav a:hover { color: var(--kompa-texte-inverse); }
.nav a[aria-current="page"] { color: var(--kompa-texte-inverse); border-bottom-color: var(--kompa-rouille-clair); }

/* ——— Contenu ——— */
main { max-width: 1280px; margin: 0 auto; padding: var(--kompa-s6) var(--kompa-s5); }
.titre-ecran { display: flex; align-items: baseline; justify-content: space-between; gap: var(--kompa-s4); flex-wrap: wrap; margin: 0 0 var(--kompa-s5); }
.titre-ecran h1 { font-size: var(--kompa-fs-h2); font-weight: 700; letter-spacing: -0.01em; color: var(--kompa-ardoise); margin: 0; }
.titre-ecran p { margin: 0; color: var(--kompa-gris); font-size: var(--kompa-fs-small); }
h2 { font-size: var(--kompa-fs-h3); font-weight: 600; color: var(--kompa-encre); margin: 0 0 var(--kompa-s3); }
.legende { color: var(--kompa-gris); font-size: var(--kompa-fs-small); }

.grille { display: grid; gap: var(--kompa-s4); grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.carte { border: var(--kompa-filet-fin); border-radius: var(--kompa-radius); background: var(--kompa-blanc); padding: var(--kompa-s5); }
.carte--large { grid-column: span 2; }
.carte--pleine { grid-column: 1 / -1; }
.carte--attente { background: var(--kompa-brume); border-color: var(--kompa-brume); }
.carte--attente p { color: var(--kompa-gris); margin: 0; font-size: var(--kompa-fs-small); }
.carte__lot { font-family: var(--kompa-font-mono); font-weight: 500; font-size: 13px; color: var(--kompa-gris); margin-bottom: var(--kompa-s1); }

.liste-def { display: grid; grid-template-columns: max-content 1fr; gap: var(--kompa-s2) var(--kompa-s4); margin: 0; font-size: var(--kompa-fs-small); }
.liste-def dt { color: var(--kompa-gris); white-space: nowrap; }
.liste-def dd { margin: 0; overflow-wrap: anywhere; }

/* ——— Tableaux (en-tête brume, filets horizontaux, montants à droite) ——— */
.tableau-conteneur { overflow-x: auto; border-top: var(--kompa-filet-fin); }
table { width: 100%; border-collapse: collapse; font-size: var(--kompa-fs-small); }
thead th {
  background: var(--kompa-brume); color: var(--kompa-ardoise); font-weight: 600;
  text-align: left; padding: var(--kompa-s2) var(--kompa-s3); border-bottom: var(--kompa-filet-fin);
}
tbody td { padding: var(--kompa-s2) var(--kompa-s3); border-bottom: var(--kompa-filet-fin); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }

/* ——— Statuts (couleur + libellé) ——— */
.statut {
  display: inline-flex; align-items: center; gap: var(--kompa-s1); white-space: nowrap;
  font-size: 13px; font-weight: 600; padding: 2px var(--kompa-s2); border-radius: var(--kompa-radius-sm);
}
.statut::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.statut--ok { color: var(--app-statut-gagnee); background: var(--app-statut-gagnee-fond); }
.statut--ko { color: var(--app-statut-perdue); background: var(--app-statut-perdue-fond); }
.statut--encours { color: var(--app-statut-encours); background: var(--app-statut-encours-fond); }
.statut--neutre { color: var(--app-statut-abandonnee); background: var(--app-statut-abandonnee-fond); }
.statut--alerte { color: var(--kompa-rouille); background: var(--kompa-blanc); box-shadow: inset 0 0 0 1px var(--kompa-rouille); }

/* ——— Compteur de CA ——— */
.ca-chiffres { display: flex; flex-wrap: wrap; gap: var(--kompa-s5); margin-bottom: var(--kompa-s4); }
.ca-chiffre__valeur { font-family: var(--kompa-font-mono); font-weight: 500; font-size: var(--kompa-fs-h2); color: var(--kompa-ardoise); line-height: 1.2; }
.ca-chiffre__valeur--second { font-size: var(--kompa-fs-h3); color: var(--kompa-gris); }
.ca-message { margin: 0 0 var(--kompa-s4); font-weight: 600; }
.ca-message--alerte { color: var(--kompa-rouille); }
.jauge { position: relative; height: 14px; background: var(--kompa-brume); border-radius: var(--kompa-radius-sm); margin: var(--kompa-s2) 0 var(--kompa-s5); }
.jauge__engage, .jauge__encaisse { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--kompa-radius-sm); }
.jauge__engage { background: var(--kompa-texte-inverse-2); }
.jauge__encaisse { background: var(--kompa-ardoise); }
.jauge__repere { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--kompa-encre); }
.jauge__repere--vise { width: 4px; }
.cle-jauge { display: flex; gap: var(--kompa-s4); flex-wrap: wrap; font-size: 13px; color: var(--kompa-gris); margin-top: calc(-1 * var(--kompa-s3)); margin-bottom: var(--kompa-s4); }
.cle-jauge span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: var(--kompa-s1); vertical-align: -1px; border-radius: 2px; }
.cle-jauge .cle--encaisse::before { background: var(--kompa-ardoise); }
.cle-jauge .cle--engage::before { background: var(--kompa-texte-inverse-2); }
.cle-jauge .cle--repere::before { width: 2px; background: var(--kompa-encre); }

/* ——— Formulaires ——— */
.champ {
  width: 100%; font: inherit; font-size: var(--kompa-fs-small); color: var(--kompa-encre); background: var(--kompa-blanc);
  border: 1px solid var(--kompa-filet); border-radius: var(--kompa-radius-sm);
  padding: var(--kompa-s2) var(--kompa-s3); min-height: 38px;
}
.champ.mono { font-family: var(--kompa-font-mono); font-weight: 400; }
.champ:focus { border-color: var(--kompa-ardoise); outline: none; box-shadow: 0 0 0 1px var(--kompa-ardoise); }
textarea.champ { resize: vertical; }
.champ.est-modifie { border-color: var(--kompa-ardoise); background: var(--kompa-brume); }

.bouton {
  font: inherit; font-weight: 600; font-size: var(--kompa-fs-small); cursor: pointer;
  border: 1px solid var(--kompa-ardoise); background: var(--kompa-ardoise); color: var(--kompa-texte-inverse);
  border-radius: var(--kompa-radius-sm); padding: 0 var(--kompa-s4); min-height: 38px;
}
.bouton:disabled { cursor: default; background: var(--kompa-brume); border-color: var(--kompa-brume); color: var(--kompa-gris); }

/* ——— Paramètres ——— */
.groupe-param { margin-bottom: var(--kompa-s6); padding-top: var(--kompa-s3); border-top: var(--kompa-filet-section); }
.param-cle { font-family: var(--kompa-font-mono); font-weight: 500; font-size: 13px; white-space: nowrap; }
.param-com { color: var(--kompa-gris); }
.param-date { font-family: var(--kompa-font-mono); font-size: 13px; color: var(--kompa-gris); white-space: nowrap; }
.col-cle { width: 22%; } .col-val { width: 40%; } .col-com { width: 24%; } .col-act { width: 1%; }
.vide { color: var(--kompa-gris); font-style: italic; font-family: var(--kompa-font-sans); font-weight: 400; }

/* ——— Messages ——— */
.bandeau { border-radius: var(--kompa-radius-sm); padding: var(--kompa-s3) var(--kompa-s4); margin-bottom: var(--kompa-s4); background: var(--kompa-brume); font-size: var(--kompa-fs-small); }
.bandeau--erreur { background: var(--app-statut-perdue-fond); color: var(--app-statut-perdue); }
.chargement { color: var(--kompa-gris); padding: var(--kompa-s4) 0; font-size: var(--kompa-fs-small); }
.toast {
  position: fixed; left: 50%; bottom: var(--kompa-s5); transform: translateX(-50%);
  background: var(--kompa-ardoise); color: var(--kompa-texte-inverse); padding: var(--kompa-s3) var(--kompa-s4);
  border-radius: var(--kompa-radius-sm); z-index: 20; max-width: calc(100% - 32px); font-size: var(--kompa-fs-small);
}
.toast--erreur { background: var(--app-statut-perdue); }

.pied { max-width: 1280px; margin: 0 auto; padding: var(--kompa-s4) var(--kompa-s5) var(--kompa-s6); color: var(--kompa-gris); font-size: 13px; }


/* ——— Lot 2 : Affaires ——— */
h3 { font-size: var(--kompa-fs-small); font-weight: 600; color: var(--kompa-ardoise); text-transform: uppercase; letter-spacing: 0.06em; margin: var(--kompa-s5) 0 var(--kompa-s2); }
.pre { white-space: pre-line; }
.barre-outils { display: flex; flex-wrap: wrap; align-items: center; gap: var(--kompa-s3); margin-bottom: var(--kompa-s5); }
.bascule { display: inline-flex; }
.bascule .bouton { border-radius: 0; }
.bascule .bouton:first-child { border-radius: var(--kompa-radius-sm) 0 0 var(--kompa-radius-sm); }
.bascule .bouton:last-child { border-radius: 0 var(--kompa-radius-sm) var(--kompa-radius-sm) 0; margin-left: -1px; }
.bouton--discret { background: var(--kompa-blanc); color: var(--kompa-ardoise); border-color: var(--kompa-filet); text-decoration: none; display: inline-flex; align-items: center; }
.bouton--discret:hover:not(:disabled) { background: var(--kompa-brume); }
.bouton--discret[aria-pressed="true"] { background: var(--kompa-ardoise); color: var(--kompa-texte-inverse); border-color: var(--kompa-ardoise); }
.case { display: inline-flex; align-items: center; gap: var(--kompa-s2); font-size: var(--kompa-fs-small); color: var(--kompa-gris); min-height: 36px; cursor: pointer; }
.case input { width: 18px; height: 18px; accent-color: var(--kompa-ardoise); }

/* Vue en colonnes */
.colonnes { display: grid; grid-template-columns: repeat(var(--nb-colonnes), minmax(220px, 1fr)); gap: var(--kompa-s3); overflow-x: auto; padding-bottom: var(--kompa-s3); }
.colonne { background: var(--kompa-brume); border-radius: var(--kompa-radius); padding: var(--kompa-s3); min-height: 240px; border: 2px solid transparent; transition: opacity .15s; }
.colonne__titre { display: flex; justify-content: space-between; align-items: center; font-size: var(--kompa-fs-small); margin: 0 0 var(--kompa-s3); }
.colonne__cartes { display: flex; flex-direction: column; gap: var(--kompa-s2); }
.colonne__nom { font-weight: 600; color: var(--kompa-ardoise); }
.choix-statut { display: flex; flex-direction: column; gap: var(--kompa-s1); }
.colonne.est-cible { border-color: var(--kompa-ardoise); border-style: dashed; }
.colonne.est-survolee { background: var(--kompa-blanc); }
.colonne.est-interdite { opacity: .45; }
.carte-affaire { background: var(--kompa-blanc); border: var(--kompa-filet-fin); border-radius: var(--kompa-radius-sm); padding: var(--kompa-s3); cursor: pointer; font-size: var(--kompa-fs-small); }
.carte-affaire:hover { border-color: var(--kompa-ardoise); }
.carte-affaire[draggable="true"] { cursor: grab; }
.carte-affaire__tete .mono { white-space: nowrap; }
.carte-affaire__tete { display: flex; justify-content: space-between; align-items: center; gap: var(--kompa-s2); font-size: 13px; color: var(--kompa-gris); }
.carte-affaire__acheteur { font-weight: 600; margin-top: var(--kompa-s1); }
.carte-affaire__objet { color: var(--kompa-gris); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.carte-affaire__pied { display: flex; justify-content: space-between; gap: var(--kompa-s2); margin-top: var(--kompa-s2); font-size: 13px; color: var(--kompa-ardoise); }
.table-affaires tbody tr { cursor: pointer; }
.table-affaires tbody tr:hover td { background: var(--kompa-brume); }
.objet-court { max-width: 420px; }

/* Fiche affaire */
.fiche-tete { display: flex; justify-content: space-between; gap: var(--kompa-s5); margin-bottom: var(--kompa-s5); }
.fiche-tete h1 { font-size: var(--kompa-fs-h2); font-weight: 700; letter-spacing: -0.01em; color: var(--kompa-ardoise); margin: var(--kompa-s2) 0 var(--kompa-s1); }
.fiche-tete__ref { display: flex; flex-wrap: wrap; align-items: center; gap: var(--kompa-s2); font-size: var(--kompa-fs-small); }
.fiche-tete__objet { margin: 0; color: var(--kompa-gris); max-width: 760px; }
.fiche-tete__actions { display: flex; flex-direction: column; align-items: flex-end; gap: var(--kompa-s3); flex-shrink: 0; }
.fiche-tete__actions > a { margin-left: var(--kompa-s2); }
.fiche-tete__passages { display: flex; flex-wrap: wrap; align-items: center; gap: var(--kompa-s2); }
.onglets { display: flex; gap: var(--kompa-s1); border-bottom: var(--kompa-filet-fin); overflow-x: auto; margin-bottom: var(--kompa-s5); }
.onglets button { font: inherit; font-size: var(--kompa-fs-small); font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--kompa-gris); padding: var(--kompa-s2) var(--kompa-s3); cursor: pointer; white-space: nowrap; min-height: 40px; }
.onglets button[aria-selected="true"] { color: var(--kompa-ardoise); border-bottom-color: var(--kompa-ardoise); font-weight: 600; }
.form-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--kompa-s4) var(--kompa-s5); }
.form-grille--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.champ-bloc { display: flex; flex-direction: column; gap: var(--kompa-s1); font-size: var(--kompa-fs-small); }
.champ-bloc--large { grid-column: 1 / -1; }
.champ-aide { margin: 0; color: var(--kompa-gris); font-size: 13px; line-height: 1.4; font-weight: 400; }
.champ::placeholder { color: #6B7280; opacity: 1; font-style: italic; }
.champ-bloc label, .champ-libelle { color: var(--kompa-gris); font-weight: 500; }
.champ-lecture { min-height: 38px; display: flex; align-items: center; }
.champ.num { text-align: right; }
.champ-unite { display: flex; align-items: center; gap: var(--kompa-s2); }
.champ-lien { display: flex; gap: var(--kompa-s2); }
.bloc-form { margin-bottom: var(--kompa-s5); }
.bloc-form__actions { display: flex; justify-content: flex-end; margin-top: var(--kompa-s4); }
.ligne-total td { font-weight: 600; background: var(--kompa-brume); }
.totaux { display: flex; flex-wrap: wrap; gap: var(--kompa-s5); margin: 0 0 var(--kompa-s3); font-size: var(--kompa-fs-small); }
.totaux dt { color: var(--kompa-gris); }
.totaux dd { margin: 0; font-size: var(--kompa-fs-h3); color: var(--kompa-ardoise); }
.notes { background: var(--kompa-brume); border-radius: var(--kompa-radius-sm); padding: var(--kompa-s3) var(--kompa-s4); font-size: var(--kompa-fs-small); }
.note-form label { display: block; color: var(--kompa-gris); font-size: var(--kompa-fs-small); font-weight: 500; margin-bottom: var(--kompa-s1); }
.liste-simple { padding-left: var(--kompa-s5); font-size: var(--kompa-fs-small); }

/* Veille */
.barre-outils select.champ { width: auto; }
.table-veille td { font-size: var(--kompa-fs-small); }
.objet-veille { min-width: 340px; }
.table-veille td:nth-child(2), .table-veille td:nth-child(5), .table-veille td:nth-child(6) { white-space: nowrap; }
.table-veille td:nth-child(3) { max-width: 220px; }
.actions-veille { white-space: nowrap; text-align: right; }
.actions-veille .bouton { margin-left: var(--kompa-s1); }
.score { display: inline-block; min-width: 38px; text-align: center; padding: 2px var(--kompa-s2); border-radius: var(--kompa-radius-sm); font-weight: 600; cursor: help; }
.score--haut { background: var(--kompa-ardoise); color: var(--kompa-texte-inverse); }
.score--moyen { background: var(--kompa-brume); color: var(--kompa-ardoise); }
.score--bas { background: var(--kompa-blanc); color: var(--kompa-gris); box-shadow: inset 0 0 0 1px var(--kompa-filet); }

/* Échéancier */
.cal-tete { display: flex; justify-content: space-between; align-items: center; margin-top: var(--kompa-s6); }
.cal-tete h2 { margin: 0; text-transform: capitalize; }
.cal { border: var(--kompa-filet-fin); border-radius: var(--kompa-radius-sm); margin-top: var(--kompa-s3); overflow: hidden; }
.cal-entete, .cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-entete div { background: var(--kompa-brume); color: var(--kompa-ardoise); font-weight: 600; font-size: 13px; padding: var(--kompa-s1) var(--kompa-s2); }
.cal-jour { min-height: 92px; border-top: var(--kompa-filet-fin); border-left: var(--kompa-filet-fin); padding: var(--kompa-s1); display: flex; flex-direction: column; gap: 2px; }
.cal-jour:nth-child(7n+1) { border-left: 0; }
.cal-jour--hors { background: var(--kompa-papier); }
.cal-jour--hors .cal-jour__num { color: var(--kompa-gris); }
.cal-jour--auj { box-shadow: inset 0 0 0 2px var(--kompa-ardoise); }
.cal-jour__num { font-size: 12px; color: var(--kompa-ardoise); }
.ech { display: block; font-size: 12px; line-height: 1.35; padding: 1px var(--kompa-s1); border-radius: 3px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cle-cal .ech { display: inline-block; margin-right: var(--kompa-s2); }
.ech--remise { background: var(--kompa-ardoise); color: var(--kompa-texte-inverse); }
.ech--secondaire { background: var(--kompa-brume); color: var(--kompa-ardoise); }
.ech--attente { background: var(--kompa-blanc); color: var(--kompa-gris); box-shadow: inset 0 0 0 1px var(--kompa-filet); }
.ech--argent { background: var(--app-statut-gagnee-fond); color: var(--app-statut-gagnee); }
.ech--depassee { background: var(--app-statut-perdue-fond); color: var(--app-statut-perdue); }
.liste-suivi { list-style: none; padding: 0; margin: 0; font-size: var(--kompa-fs-small); }
.liste-suivi li { padding: var(--kompa-s2) 0; border-bottom: var(--kompa-filet-fin); }
.dialogue--large { width: min(860px, calc(100vw - 32px)); }
textarea.courrier { font-family: var(--kompa-font-sans); font-size: var(--kompa-fs-small); line-height: 1.5; }
.apercu-email { width: 100%; height: 60vh; border: var(--kompa-filet-fin); border-radius: var(--kompa-radius-sm); background: var(--kompa-brume); }

/* Tableau de bord */
#tableau-de-bord { margin-bottom: var(--kompa-s5); }
.tableau-tete { display: flex; justify-content: space-between; align-items: baseline; gap: var(--kompa-s4); }
.tuiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--kompa-s3); margin-bottom: var(--kompa-s4); }
.tuiles--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tuile { border: var(--kompa-filet-fin); border-radius: var(--kompa-radius); padding: var(--kompa-s3) var(--kompa-s4); background: var(--kompa-blanc); }
.tuile__libelle { font-size: 13px; font-weight: 600; color: var(--kompa-gris); }
.tuile__valeur { font-size: var(--kompa-fs-h2); color: var(--kompa-ardoise); line-height: 1.2; margin: var(--kompa-s1) 0; }
.tuile__detail { font-size: 13px; color: var(--kompa-gris); }
.grille--tableau { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.barres { display: flex; flex-direction: column; gap: var(--kompa-s2); }
.barre { display: grid; grid-template-columns: 150px 1fr 32px; align-items: center; gap: var(--kompa-s3); font-size: var(--kompa-fs-small); }
.barre__libelle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barre__piste { height: 10px; }
.barre__valeur-trait { display: block; height: 10px; min-width: 2px; background: var(--kompa-ardoise); border-radius: 0 4px 4px 0; }
.barre__nombre { text-align: right; color: var(--kompa-encre); }
.barre:hover .barre__libelle { color: var(--kompa-ardoise); font-weight: 600; }
.table-enseignements td { font-size: var(--kompa-fs-small); }
.table-enseignements .legende, td.mono .legende { font-family: var(--kompa-font-sans); font-weight: 400; }
.table-enseignements .enseignement { min-width: 320px; }
.table-enseignements .enseignement div + div { margin-top: var(--kompa-s1); }
.sous-titre { margin-top: var(--kompa-s6); }

/* Boîte de dialogue */
.dialogue { border: 0; border-radius: var(--kompa-radius); padding: var(--kompa-s5); width: min(640px, calc(100vw - 32px)); color: var(--kompa-encre); }
.dialogue::backdrop { background: rgba(11, 18, 32, 0.45); }
.dialogue h2 { margin-top: 0; }
.dialogue__actions { display: flex; justify-content: flex-end; gap: var(--kompa-s2); margin-top: var(--kompa-s5); }
.dialogue__erreur { margin-top: var(--kompa-s3); color: var(--app-statut-perdue); background: var(--app-statut-perdue-fond); padding: var(--kompa-s2) var(--kompa-s3); border-radius: var(--kompa-radius-sm); font-size: var(--kompa-fs-small); }

/* Pièces de l'affaire */
.depot { margin-bottom: var(--kompa-s5); }
.depot__ligne { display: flex; align-items: center; gap: var(--kompa-s3); margin-bottom: var(--kompa-s3); flex-wrap: wrap; }
.depot__ligne .champ { width: auto; min-width: 14rem; }
.depot__zone { display: flex; flex-direction: column; align-items: center; gap: var(--kompa-s1); padding: var(--kompa-s5) var(--kompa-s4);
  border: 2px dashed var(--kompa-filet); border-radius: var(--kompa-radius); background: var(--kompa-blanc); cursor: pointer; text-align: center; position: relative; }
.depot__zone:hover, .depot__zone.est-survolee, .depot__zone:focus-within { border-color: var(--kompa-rouille); background: var(--kompa-brume); }
.depot__zone .lien { color: var(--kompa-rouille); text-decoration: underline; }
.depot__input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.depot.est-occupe .depot__zone { opacity: .6; pointer-events: none; }
.depot__etat { min-height: 1.5em; margin-top: var(--kompa-s2); }
.pieces { display: grid; gap: var(--kompa-s4); }
.pieces { gap: var(--kompa-s3); }
.pieces__dossier h3 { margin: 0 0 var(--kompa-s1); font-size: var(--kompa-fs-body); font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--kompa-ardoise); }
.pieces__dossier h3 .legende { font-weight: 400; margin-left: var(--kompa-s1); }
.pieces__liste { list-style: none; margin: 0; padding: 0; border-top: var(--kompa-filet-fin); }
.pieces__liste li { padding: var(--kompa-s2) 0; border-bottom: var(--kompa-filet-fin); overflow-wrap: anywhere; }
</style>
</head>
<body>
  <header class="entete">
    <div class="entete__barre">
      <a class="marque" href="#accueil" aria-label="Kompa Affaires — accueil">
        <!-- Symbole négatif du kit (charte/kompa-kit/logos/svg/kompa-symbole-negatif.svg), non modifié -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="6 -1 88 109" width="88" height="109" aria-hidden="true" focusable="false"><circle cx="50" cy="16" r="10" fill="none" stroke="#EEF2F8" stroke-width="6.0"/><path d="M44.5 25 L14 100" fill="none" stroke="#EEF2F8" stroke-width="7.0" stroke-linecap="round"/><path d="M21.5 86.5 Q50 97 79 83" fill="none" stroke="#EEF2F8" stroke-width="6.5" stroke-linecap="round"/><path d="M55.5 25 L86 100" fill="none" stroke="#E2733A" stroke-width="7.0" stroke-linecap="round"/></svg>
        <span class="marque__nom">Kompa <span>Affaires</span></span>
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#accueil">Accueil</a>
        <a href="#veille">Veille</a>
        <a href="#affaires">Affaires</a>
        <a href="#echeancier">Échéancier</a>
        <a href="#enseignements">Enseignements</a>
        <a href="#parametres">Paramètres</a>
      </nav>
    </div>
  </header>

  <main id="ecran" tabindex="-1"></main>

  <footer class="pied mono" id="pied"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
/* Kompa Affaires — interface (lot 1 : socle). */
(function () {
  'use strict';

  // ——— Appels serveur ———
  /** Appels en lecture seule : tous les autres modifient les données et vident la mémoire d'affichage. */
  var LECTURES = ['apiEtat', 'apiParametres', 'apiCompteurCA', 'apiAccueil', 'apiAffaires', 'apiAffaire', 'apiVeille',
    'apiEcheancier', 'apiSuivi', 'apiCourrier', 'apiEmailApercu', 'apiTableau', 'apiEnseignements', 'apiFiscal', 'apiPieces'];

  function appel(nom) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resoudre, rejeter) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) {
            if (LECTURES.indexOf(nom) < 0) viderMemoire();
            resoudre(r.data);
          } else rejeter(new Error((r && r.erreur) || 'Réponse vide du serveur.'));
        })
        .withFailureHandler(function (e) { rejeter(e instanceof Error ? e : new Error(String(e))); });
      runner[nom].apply(runner, args);
    });
  }

  // ——— Mémoire d'affichage : la dernière version connue s'affiche tout de suite ———
  var memoire = {};
  var jetonEcran = 0;
  function lireMemoire(cle) {
    if (memoire[cle]) return memoire[cle];
    try { var v = localStorage.getItem('ka.m.' + cle); if (v) return (memoire[cle] = JSON.parse(v)); } catch (e) { /* indisponible */ }
    return null;
  }
  function ecrireMemoire(cle, donnees) {
    memoire[cle] = donnees;
    try { localStorage.setItem('ka.m.' + cle, JSON.stringify(donnees)); } catch (e) { /* plein ou indisponible */ }
  }
  function viderMemoire() {
    memoire = {};
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('ka.m.') === 0) localStorage.removeItem(k); });
    } catch (e) { /* indisponible */ }
  }
  /** Saisie en cours sur l'écran : ne pas le redessiner sous les doigts de l'utilisateur. */
  function saisieEnCours() {
    var a = document.activeElement;
    return !!(document.querySelector('dialog[open]') || document.querySelector('#ecran .est-modifie') ||
      (a && a.closest && a.closest('#ecran') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)));
  }
  /**
   * Affiche tout de suite la dernière version connue (si elle existe), puis la version fraîche
   * dès qu'elle arrive, si elle diffère et si aucune saisie n'est en cours.
   */
  function charger(cle, nom, args, rendu, surErreur) {
    var jeton = jetonEcran;
    var ancien = lireMemoire(cle);
    if (ancien) rendu(ancien, true);
    return appel.apply(null, [nom].concat(args || [])).then(function (frais) {
      ecrireMemoire(cle, frais);
      if (jeton !== jetonEcran) return; // écran quitté entre-temps
      if (!ancien || (JSON.stringify(frais) !== JSON.stringify(ancien) && !saisieEnCours())) rendu(frais, false);
    }).catch(function (e) {
      if (jeton !== jetonEcran) return;
      if (ancien) toast('Données non actualisées : ' + e.message, true);
      else if (surErreur) surErreur(e);
    });
  }

  // ——— Utilitaires ———
  var $ = function (sel, racine) { return (racine || document).querySelector(sel); };
  var $$ = function (sel, racine) { return Array.prototype.slice.call((racine || document).querySelectorAll(sel)); };

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function dateHeure(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  var toastMinuteur = null;
  function toast(message, erreur) {
    var t = $('#toast');
    t.textContent = message;
    t.className = 'toast' + (erreur ? ' toast--erreur' : '');
    t.hidden = false;
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(function () { t.hidden = true; }, erreur ? 6000 : 2500);
  }


  function bandeauErreur(e) {
    return '<div class="bandeau bandeau--erreur" role="alert"><strong>Erreur.</strong> ' + esc(e.message || e) + '</div>';
  }

  function titre(t, sousTitre) {
    return '<div class="titre-ecran"><h1>' + esc(t) + '</h1>' + (sousTitre ? '<p>' + esc(sousTitre) + '</p>' : '') + '</div>';
  }

  // ——— Écrans ———
  var ECRANS = {
    accueil: { titre: 'Accueil', rendu: ecranAccueil },
    parametres: { titre: 'Paramètres', rendu: ecranParametres }
  };

  function ecranAccueil(el) {
    el.innerHTML = titre('Accueil', '') +
      '<section id="tableau-de-bord"><h2>Tableau de bord</h2><div class="chargement">Calcul des indicateurs…</div></section>' +
      '<div class="grille">' +
        '<section class="carte carte--large" id="carte-ca"><h2>Chiffre d\'affaires</h2><div class="chargement">Calcul du CA…</div></section>' +
        '<section class="carte carte--pleine" id="carte-urssaf"><h2>Déclarations URSSAF</h2><div class="chargement">Calcul…</div></section>' +
        '<section class="carte" id="carte-echeances"><h2>Échéances à 7 jours</h2><div class="chargement">Calcul…</div></section>' +
        '<section class="carte" id="carte-relances"><h2>Relances à faire</h2><div class="chargement">Calcul…</div></section>' +
        '<section class="carte" id="carte-etat"><h2>État du socle</h2><div class="chargement">Lecture du classeur…</div></section>' +
      '</div>';

    charger('accueil', 'apiAccueil', [], function (d) {
      var K = window.KA;
      if (K.tableauAccueil) K.tableauAccueil($('#tableau-de-bord'), d.tableau);
      if (K.fiscalAccueil) K.fiscalAccueil($('#carte-urssaf'), d.fiscal);
      if (K.suiviAccueil) K.suiviAccueil($('#carte-echeances'), $('#carte-relances'), d.suivi);
      $('#carte-ca').innerHTML = rendreCompteur(d.ca);
      rendreEtat(d.etat);
    }, function (e) {
      $('#tableau-de-bord').innerHTML = '<h2>Tableau de bord</h2>' + bandeauErreur(e);
    });
  }

  function rendreEtat(etat) {
    var present = etat.onglets.filter(function (o) { return o.present; }).length;
    var ok = present === etat.onglets.length;
    $('#carte-etat').innerHTML = '<h2>État du socle</h2>' +
      '<dl class="liste-def">' +
        '<dt>Classeur</dt><dd><span class="statut ' + (ok ? 'statut--ok">Connecté' : 'statut--ko">Incomplet') + '</span> ' +
          '<a href="' + esc(etat.classeur.url) + '" target="_blank" rel="noopener">' + esc(etat.classeur.nom) + '</a></dd>' +
        '<dt>Onglets</dt><dd class="mono">' + present + ' / ' + etat.onglets.length + '</dd>' +
        '<dt>Compte</dt><dd class="mono">' + esc(etat.compte) + '</dd>' +
        '<dt>E-mails restants</dt><dd class="mono">' + esc(etat.quotaEmailRestant) + ' aujourd\'hui</dd>' +
        '<dt>Déclencheurs</dt><dd class="mono">' + (etat.declencheurs.length ? esc(etat.declencheurs.join(', ')) : '<span class="vide">aucun</span>') + '</dd>' +
        '<dt>Lu à</dt><dd class="mono">' + esc(dateHeure(etat.maintenant)) + '</dd>' +
      '</dl>';
    $('#pied').textContent = etat.app + ' · v' + etat.version;
  }

  var formatEuro = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  function euros(n) { return formatEuro.format(n) + '\u00a0€'; }

  function pastilleEtat(etat, pct) {
    if (etat === 'depasse') return '<span class="statut statut--ko">Dépassé</span>';
    if (etat === 'alerte') return '<span class="statut statut--alerte">≥ ' + pct + ' %</span>';
    return '<span class="statut statut--ok">Sous le seuil</span>';
  }

  function rendreCompteur(ca) {
    var jalons = ca.jalons;
    var prochain = jalons.filter(function (j) { return j.cle === ca.prochain; })[0];
    var echelle = Math.max(ca.engage, Math.max.apply(null, jalons.map(function (j) { return j.seuil; }).concat([1]))) * 1.02;
    var pc = function (v) { return Math.min(v / echelle * 100, 100).toFixed(2) + '%'; };

    var message;
    if (!prochain) {
      message = '<p class="ca-message ca-message--alerte" role="alert">Tous les seuils sont dépassés.</p>';
    } else if (prochain.etat === 'alerte') {
      message = '<p class="ca-message ca-message--alerte" role="alert">Alerte — ' + esc(prochain.libelle) +
        ' : plus que <span class="mono">' + euros(prochain.reste) + '</span> avant <span class="mono">' + euros(prochain.seuil) + '</span>.</p>';
    } else {
      message = '<p class="ca-message">Prochain jalon — ' + esc(prochain.libelle) +
        ' — reste <span class="mono">' + euros(prochain.reste) + '</span> à encaisser.</p>';
    }
    // Seuil le plus élevé que le CA engagé franchirait (le plus lourd de conséquences).
    var risque = jalons.filter(function (j) { return j.etat !== 'depasse' && j.etatEngage === 'depasse'; }).pop();
    if (risque) {
      message += '<p class="ca-message ca-message--alerte">Avec le CA engagé : ' + esc(risque.libelle) +
        ' dépassé de <span class="mono">' + euros(-risque.resteEngage) + '</span>. ' + esc(risque.consequence) + '</p>';
    }

    return '<h2>Chiffre d\'affaires ' + esc(ca.annee) + '</h2>' +
      '<div class="ca-chiffres">' +
        '<div><div class="legende">Encaissé</div><div class="ca-chiffre__valeur">' + euros(ca.encaisse) + '</div></div>' +
        '<div><div class="legende">Engagé</div><div class="ca-chiffre__valeur ca-chiffre__valeur--second">' + euros(ca.engage) + '</div></div>' +
        '<div><div class="legende">Facturé ' + esc(ca.annee) + '</div><div class="ca-chiffre__valeur ca-chiffre__valeur--second">' + euros(ca.facture) + '</div></div>' +
      '</div>' +
      message +
      '<div class="jauge" role="img" aria-label="Encaissé ' + euros(ca.encaisse) + ', engagé ' + euros(ca.engage) + '">' +
        '<div class="jauge__engage" style="width:' + pc(ca.engage) + '"></div>' +
        '<div class="jauge__encaisse" style="width:' + pc(ca.encaisse) + '"></div>' +
        jalons.map(function (j) {
          return '<div class="jauge__repere' + (j.vise ? ' jauge__repere--vise' : '') + '" style="left:' + pc(j.seuil) + '" title="' + esc(j.libelle) + ' — ' + euros(j.seuil) + '"></div>';
        }).join('') +
      '</div>' +
      '<div class="cle-jauge"><span class="cle--encaisse">Encaissé</span><span class="cle--engage">Engagé</span><span class="cle--repere">Seuils</span></div>' +
      '<div class="tableau-conteneur"><table>' +
        '<thead><tr><th scope="col">Jalon</th><th scope="col" class="num">Seuil</th><th scope="col" class="num">Reste</th><th scope="col">État</th></tr></thead><tbody>' +
        jalons.map(function (j) {
          return '<tr><td>' + (j.vise ? '<strong>' + esc(j.libelle) + '</strong>' : esc(j.libelle)) + '<div class="legende">' + esc(j.consequence) + '</div></td>' +
            '<td class="num mono">' + euros(j.seuil) + '</td>' +
            '<td class="num mono">' + (j.reste >= 0 ? euros(j.reste) : '− ' + euros(-j.reste)) + '</td>' +
            '<td>' + pastilleEtat(j.etat, ca.alertePct) + '</td></tr>';
        }).join('') +
      '</tbody></table></div>' +
      '<p class="legende">Engagé = encaissé + factures non payées (' + euros(ca.aEncaisser) + ') + reste à facturer sur les affaires gagnées (' + euros(ca.resteAFacturer) + '). ' +
      'Factures et encaissements : onglet Exécution de chaque fiche affaire.</p>';
  }

  function ecranParametres(el) {
    el.innerHTML = titre('Paramètres', 'Listes : valeurs séparées par « ; ». Nombres : chiffres seuls.') +
      '<div class="chargement">Lecture des paramètres…</div>';

    charger('parametres', 'apiParametres', [], function (groupes) {
      var html = titre('Paramètres', 'Listes : valeurs séparées par « ; ». Nombres : chiffres seuls.');
      groupes.forEach(function (g) {
        html += '<section class="groupe-param"><h2>' + esc(g.titre) + '</h2>' + paramsPC(g.parametres) + '</section>';
      });
      el.innerHTML = html;
      brancherParams(el);
    }, function (e) {
      el.innerHTML = titre('Paramètres', '') + bandeauErreur(e);
    });
  }

  function paramsPC(params) {
    return '<div class="tableau-conteneur"><table>' +
      '<colgroup><col class="col-cle"><col class="col-val"><col class="col-com"><col><col class="col-act"></colgroup>' +
      '<thead><tr><th scope="col">Clé</th><th scope="col">Valeur</th><th scope="col">Commentaire</th><th scope="col">Modifié le</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
      params.map(function (p) {
        var long = p.valeur.indexOf(';') >= 0 || p.valeur.length > 40;
        var id = 'p-' + p.cle.replace(/[^a-z0-9]/gi, '-');
        var champ = long
          ? '<textarea class="champ mono" id="' + id + '" rows="2">' + esc(p.valeur) + '</textarea>'
          : '<input class="champ mono" id="' + id + '" type="text" value="' + esc(p.valeur) + '">';
        return '<tr data-cle="' + esc(p.cle) + '" data-initial="' + esc(p.valeur) + '">' +
          '<td><label class="param-cle" for="' + id + '">' + esc(p.cle) + '</label></td>' +
