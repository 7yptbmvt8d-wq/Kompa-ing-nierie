    }).catch(function (e) { elEch.innerHTML = '<h2>Échéances à 7 jours</h2>' + K.bandeauErreur(e); });
  };

  K.ecrans.echeancier = { titre: 'Échéancier', rendu: ecranEcheancier };
})();
</script>
  <script>
/* Kompa Affaires — lot 5 : tableau de bord (accueil) et écran Enseignements. */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$;

  var pct = function (x, d) { return x === null || x === undefined ? '—' : (x * 100).toFixed(d === undefined ? 0 : d).replace('.', ',') + ' %'; };
  var pctSigne = function (x) { return x === null || x === undefined ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(1).replace('.', ',') + ' %'; };
  var nb = function (x, d) { return x === null || x === undefined ? '—' : Number(x).toFixed(d || 0).replace('.', ','); };
  var signe = function (x, d) { return x === null || x === undefined ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + nb(Math.abs(x), d); };
  function jour(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }

  function tuile(libelle, valeur, detail, info) {
    return '<div class="tuile" title="' + esc(info || '') + '"><div class="tuile__libelle">' + esc(libelle) + '</div>' +
      '<div class="tuile__valeur mono">' + valeur + '</div><div class="tuile__detail">' + detail + '</div></div>';
  }

  /** Barres horizontales d'une seule teinte (grandeur), valeur en texte, info-bulle au survol. */
  function barres(lignes, vide) {
    if (!lignes.length) return '<p class="vide">' + esc(vide) + '</p>';
    var max = Math.max.apply(null, lignes.map(function (l) { return l.valeur; }).concat([1]));
    return '<div class="barres" role="list">' + lignes.map(function (l) {
      return '<div class="barre" role="listitem" title="' + esc(l.libelle + ' : ' + l.valeur) + '">' +
        '<span class="barre__libelle">' + esc(l.libelle) + '</span>' +
        '<span class="barre__piste"><span class="barre__valeur-trait" style="width:' + (l.valeur / max * 100).toFixed(1) + '%"></span></span>' +
        '<span class="barre__nombre mono">' + l.valeur + '</span></div>';
    }).join('') + '</div>';
  }

  // ——— Tableau de bord (accueil) ———
  K.tableauAccueil = function (el, donnees) {
    (donnees ? Promise.resolve(donnees) : K.appel('apiTableau')).then(function (t) {
      var a = t.attribution;
      var tuiles = '<div class="tuiles">' +
        tuile('Affaires en cours', nb(t.enCours), t.parStatut.filter(function (s) { return s.actif && s.nombre; }).map(function (s) { return esc(s.statut) + ' ' + s.nombre; }).join(' · ') || 'aucune', 'En étude, Go, Déposée, Gagnée') +
        tuile('Taux de Go', pct(t.go.taux), t.go.go + ' Go / ' + (t.go.go + t.go.nogo) + ' décisions', 'Go / (Go + No-go), 12 mois glissants') +
        tuile('Taux d\'attribution', pct(a.taux), a.gagnees + ' gagnée(s) / ' + (a.gagnees + a.perdues) + ' · en montant ' + pct(a.tauxMontant), 'Gagnées / (gagnées + perdues) ; en montant : montant gagné / montant des offres jugées ; 12 mois glissants') +
        tuile('Rang moyen', nb(t.rangMoyen, 1), t.rangsConnus + ' rang(s) connu(s)', 'Moyenne des rangs renseignés, 12 mois glissants') +
        tuile('Écart de prix', pctSigne(t.ecartPrixMoyen), 'moyenne sur ' + t.perduesAnalysees + ' perdue(s) · + = plus cher', '(votre prix − prix attributaire) / prix attributaire, affaires perdues') +
        tuile('Écart de note technique', signe(t.ecartNoteMoyen, 1), 'points, moyenne des perdues · − = en dessous', 'Votre note technique − note de l\'attributaire') +
        tuile('Coût de la réponse ' + t.annee, t.cout.joursPour10k === null ? '—' : nb(t.cout.joursPour10k, 1) + ' j', 'pour 10 000 € gagnés (' + nb(t.cout.jours) + ' j de réponse)', 'Jours passés à répondre / montants notifiés, année civile') +
        tuile('CA ' + t.annee, K.euros(t.ca.encaisse), 'encaissé · signé ' + K.euros(t.ca.signe) + ' · facturé ' + K.euros(t.ca.facture), 'CA signé, facturé, encaissé : année civile') +
        '</div>';
      var statuts = barres(t.parStatut.filter(function (s) { return s.actif; }).map(function (s) { return { libelle: s.statut, valeur: s.nombre }; }), '');
      var clotures = t.parStatut.filter(function (s) { return !s.actif && s.nombre; });
      var motifs = '<h3>No-go</h3>' + barres(t.motifsNogo.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucun No-go sur 12 mois.') +
        '<h3>Rejets (pièce à améliorer)</h3>' + barres(t.motifsRejet.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucune offre perdue sur 12 mois.');
      el.innerHTML = '<div class="tableau-tete"><h2>Tableau de bord</h2><span class="legende">12 mois glissants : du ' + jour(t.fenetre.debut) + ' au ' + jour(t.fenetre.fin) + '</span></div>' + tuiles +
        '<div class="grille grille--tableau">' +
          '<section class="carte"><h2>Affaires en cours par statut</h2>' + statuts +
            (clotures.length ? '<p class="legende">Clôturées sur 12 mois : ' + clotures.map(function (s) { return esc(s.statut) + ' ' + s.nombre; }).join(' · ') + '</p>' : '') + '</section>' +
          '<section class="carte"><h2>Motifs, 12 mois</h2>' + motifs + '<p><a href="#enseignements">Voir les enseignements</a></p></section>' +
        '</div>';
    }).catch(function (e) { el.innerHTML = '<h2>Tableau de bord</h2>' + K.bandeauErreur(e); });
  };

  // ——— Déclarations URSSAF (accueil) ———
  var ETATS_DECL = {
    'déclarée': 'statut--ok', 'en retard': 'statut--ko', 'à déclarer': 'statut--alerte',
    'en cours': 'statut--encours', 'à venir': 'statut--neutre', 'non suivie': 'statut--neutre'
  };

  K.fiscalAccueil = function (el, donnees) {
    (donnees ? Promise.resolve(donnees) : K.appel('apiFiscal')).then(function (d) { rendreFiscal(el, d); })
      .catch(function (e) { el.innerHTML = '<h2>Déclarations URSSAF</h2>' + K.bandeauErreur(e); });
  };

  function rendreFiscal(el, d) {
    var eur = function (x) { return x === null || x === undefined ? '<span class="vide">—</span>' : K.euros(x); };
    var tx = function (x) { return x === null ? '?' : (x * 100).toFixed(1).replace('.', ',').replace(',0', '') + ' %'; };
    var lignes = d.periodes.map(function (p) {
      var etat = '<span class="statut ' + (ETATS_DECL[p.etat] || 'statut--neutre') + '">' + esc(p.etat) + '</span>' +
        (p.date_declaration ? ' <span class="legende mono">' + jour(p.date_declaration) + '</span>' : '');
      var action = (p.etat === 'à déclarer' || p.etat === 'en retard')
        ? '<button type="button" class="bouton" data-declarer="' + esc(p.id) + '" data-ca="' + esc(p.ca) + '" data-libelle="' + esc(p.libelle) + '">Déclarée</button>'
        : p.etat === 'déclarée' ? '<button type="button" class="bouton bouton--discret" data-annuler-decl="' + esc(p.id) + '">Annuler</button>' : '';
      return '<tr><td><strong>' + esc(p.libelle) + '</strong><div class="legende mono">' + jour(p.debut) + ' – ' + jour(p.fin) + '</div></td>' +
        '<td class="num mono">' + eur(p.ca) + '</td><td class="num mono">' + eur(p.cotisations) + '</td><td class="num mono">' + eur(p.cfp) + '</td>' +
        '<td class="num mono">' + eur(p.impot) + '</td><td class="num mono"><strong>' + eur(p.total) + '</strong></td>' +
        '<td class="mono">' + jour(p.echeance) + '</td><td>' + etat + '</td><td class="actions-veille">' + action + '</td></tr>';
    }).join('');
    var t = d.totaux;
    el.innerHTML = '<div class="tableau-tete"><h2>Déclarations URSSAF ' + d.annee + ' — ' + esc(d.periodicite) + 's</h2>' +
        '<span class="legende">Base : CA encaissé de la période</span></div>' +
      (d.tauxManquants ? '<div class="bandeau">Renseignez le taux de vos cotisations sociales (<span class="mono">fiscal.taux_cotisations</span>, onglet Paramètres › Déclarations URSSAF) pour estimer les sommes à payer. Il figure sur votre espace autoentrepreneur.urssaf.fr.</div>' : '') +
      '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Période</th><th scope="col" class="num">CA encaissé</th>' +
      '<th scope="col" class="num">Cotisations (' + tx(d.taux.cotisations) + ')</th><th scope="col" class="num">CFP (' + tx(d.taux.cfp) + ')</th>' +
      '<th scope="col" class="num">Impôt' + (d.taux.versementLiberatoire ? ' (VL ' + tx(d.taux.impot) + ')' : ' (sans VL)') + '</th>' +
      '<th scope="col" class="num">Total estimé</th><th scope="col">À déclarer avant</th><th scope="col">État</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
      lignes +
      '<tr class="ligne-total"><td>Année ' + d.annee + '</td><td class="num mono">' + eur(t.ca) + '</td><td class="num mono">' + eur(t.cotisations) + '</td>' +
      '<td class="num mono">' + eur(t.cfp) + '</td><td class="num mono">' + eur(t.impot) + '</td><td class="num mono">' + eur(t.total) + '</td><td colspan="3"></td></tr>' +
      '</tbody></table></div>' +
      '<p class="legende">Estimations calculées avec les taux de l\'onglet Paramètres, à vérifier chaque année sur votre espace URSSAF. ' +
      'Une relance « Déclaration URSSAF » apparaît dans l\'échéancier et l\'e-mail du matin tant qu\'une période terminée n\'est pas marquée déclarée.</p>' +
      blocCfe(d);

    brancherCfe(el, d);
    Array.prototype.forEach.call(el.querySelectorAll('[data-declarer]'), function (b) {
      b.addEventListener('click', function () { dialogueDeclarer(el, b.getAttribute('data-declarer'), b.getAttribute('data-libelle'), b.getAttribute('data-ca')); });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-annuler-decl]'), function (b) {
      b.addEventListener('click', function () {
        K.appel('apiAnnulerDeclaration', b.getAttribute('data-annuler-decl')).then(function (r) { K.toast('Déclaration annulée.'); rendreFiscal(el, r); })
          .catch(function (e) { K.toast(e.message, true); });
      });
    });
  }

  // ——— CFE (cotisation foncière des entreprises) ———
  var ETATS_CFE = { 'payée': 'statut--ok', 'en retard': 'statut--ko', 'à payer': 'statut--alerte', 'à venir': 'statut--encours', 'exonérée': 'statut--neutre', 'non due': 'statut--neutre' };

  function blocCfe(d) {
    var c = d.cfe;
    if (!c) return '';
    var montant = c.montant === null ? '<span class="vide">montant à estimer</span>'
      : '<strong class="mono">' + K.euros(c.montant) + '</strong>' + (c.estime ? ' <span class="legende">estimé' + (c.reduction ? ', réduit de moitié' : '') + '</span>' : ' <span class="legende">payé le ' + jour(c.date_paiement) + '</span>');
    var action = ['à venir', 'à payer', 'en retard'].indexOf(c.etat) >= 0 && c.dateCreation
      ? '<button type="button" class="bouton" data-cfe-payee>Payée</button>'

        '<span class="statut ' + (ETATS_CFE[c.etat] || 'statut--neutre') + '">' + esc(c.etat) + '</span>' +
        (['non due', 'exonérée'].indexOf(c.etat) < 0 ? '<span>' + montant + '</span><span class="legende">à payer avant le <span class="mono">' + jour(c.echeance) + '</span></span>' : '') +
        (c.motif ? '<span class="legende">' + esc(c.motif) + '</span>' : '') + action + '</div>' +
      (d.cfeProchaine && ['non due', 'exonérée'].indexOf(c.etat) >= 0 ? '<p>Première CFE due : <strong>' + d.cfeProchaine.annee + '</strong>, ' +
        (d.cfeProchaine.montant === null ? 'montant à estimer' : '<strong class="mono">' + K.euros(d.cfeProchaine.montant) + '</strong> estimée' + (d.cfeProchaine.reduction ? ' (base réduite de moitié)' : '')) +
        ', avant le <span class="mono">' + jour(d.cfeProchaine.echeance) + '</span>.</p>' : '') +
      '<form class="bloc-cfe__reglages" data-cfe-reglages novalidate>' +
        '<div class="champ-bloc"><label for="cfe-montant">CFE estimée, année pleine (€)</label><input class="champ mono num" id="cfe-montant" inputmode="decimal" value="' + esc(c.estimeAnnee === null ? '' : String(c.estimeAnnee).replace('.', ',')) + '" placeholder="ex. 350"></div>' +
        '<div class="champ-bloc"><label for="cfe-creation">Création de l\'entreprise</label><input class="champ mono" type="date" id="cfe-creation" value="' + esc(c.dateCreation) + '"></div>' +
        '<div class="bloc-form__actions"><button type="submit" class="bouton bouton--discret">Enregistrer</button></div>' +
      '</form>' +

        'Exonérée l\'année de création, base réduite de moitié l\'année suivante. Remplacez l\'estimation par le montant de l\'avis ; l\'échéance apparaît dans l\'échéancier et l\'e-mail du matin.</p></div>';
  }

  function brancherCfe(el, d) {
    var c = d.cfe;

        .then(function (r) { K.toast('CFE enregistrée.'); rendreFiscal(el, r); }).catch(function (e) { K.toast(e.message, true); });
    });
    var p = el.querySelector('[data-cfe-payee]');
    if (p) p.addEventListener('click', function () {
      var m = window.prompt('Montant payé pour la CFE ' + c.annee + ' (€) :', c.montant === null ? '' : String(c.montant).replace('.', ','));
      if (m === null) return;

    });
    var a = el.querySelector('[data-cfe-annuler]');
    if (a) a.addEventListener('click', function () {
      K.appel('apiAnnulerDeclaration', c.id).then(function (r) { K.toast('Paiement annulé.'); rendreFiscal(el, r); }).catch(function (e) { K.toast(e.message, true); });
    });
  }

  function dialogueDeclarer(el, id, libelle, ca) {
    var d = document.createElement('dialog');

    var auj = new Date(), p = function (n) { return String(n).padStart(2, '0'); };

    document.body.appendChild(d);

      }).catch(function (e) { K.toast(e.message, true); });

  }

  // ——— Écran Enseignements ———
  function ecranEnseignements(el) {

      var l = r.lignes;
      var tuiles = '<div class="tuiles tuiles--3">' +
        tuile('Écart de prix moyen', pctSigne(r.moyennes.ecartPrix), '12 mois glissants · + = plus cher que l\'attributaire', '') +
        tuile('Écart de note technique moyen', signe(r.moyennes.ecartNote, 1), 'points · − = en dessous de l\'attributaire', '') +

      var table = l.length ? '<div class="tableau-conteneur"><table class="table-enseignements"><thead><tr>' +

        '<th scope="col" class="num">Écart prix</th><th scope="col" class="num">Note tech.</th><th scope="col" class="num">Écart</th><th scope="col" class="num">Rang</th>' +
        '<th scope="col">Motifs et enseignements</th></tr></thead><tbody>' +
        l.map(function (x) {
          return '<tr><td><a href="#affaire/' + esc(x.id) + '" class="mono">' + esc(x.id) + '</a><div><strong>' + esc(x.acheteur) + '</strong></div><div class="legende">' + esc(x.objet) + '</div>' + (x.exercice ? '<span class="statut statut--neutre">exercice — hors indicateurs</span>' : '') + '</td>' +

            '<td class="num mono">' + pctSigne(x.ecartPrix) + '</td>' +

            '<td class="num mono">' + nb(x.rang) + '</td>' +
            '<td class="enseignement">' +
              (x.motifs_rejet ? '<div><span class="legende">Motifs :</span> ' + esc(x.motifs_rejet) + '</div>' : '<div class="vide">Motifs non reçus</div>') +
              (x.points_faibles ? '<div><span class="legende">Points faibles :</span> ' + esc(x.points_faibles) + '</div>' : '') +

            '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="bandeau">Aucune offre perdue pour l\'instant.</div>';
      var motifs = '<div class="grille"><section class="carte"><h2>Pièces à améliorer (12 mois)</h2>' +
        barres(r.motifsRejet.map(function (m) { return { libelle: m.motif, valeur: m.nombre }; }), 'Aucune offre perdue sur 12 mois.') + '</section>' +

    var ligneJ = function (lib, cle, aide) {

    var aPreciser = p.affaires.filter(function (a) { return a.aPreciser; }).length;

        '<td>' + esc(a.statut === 'Déposée' ? 'Déposée (potentiel)' : a.statut) + '</td>' +
        '<td class="num mono">' + eur(a.base) + '<div class="legende">encaissé ' + K.euros(a.encaisse) + '</div></td>' +
        '<td class="num">' + (a.joursEstimes ? '<strong class="mono">' + String(a.joursEstimes).replace('.', ',') + ' j</strong>' +
          '<div class="legende">' + (a.prixJour ? K.euros(a.prixJour) + '/j · ' : '') + esc(a.joursSource) + '</div>' : '<span class="statut statut--alerte">jours non saisis</span>') + '</td>' +
        annees.map(function (y) {
          return '<td class="num mono">' + eur(a.parAnnee[y.annee]) + (a.joursParAnnee[y.annee] ? '<div class="legende">' + String(a.joursParAnnee[y.annee]).replace('.', ',') + ' j</div>' : '') + '</td>';
        }).join('') +
        '<td>' + (a.aPreciser ? '<span class="statut statut--alerte">répartition à préciser</span>' : '') +
          (a.remarques.length ? '<div class="legende">' + esc(a.remarques.join(' ; ')) + '</div>' : '') + '</td></tr>';
    }).join('');
    el.innerHTML = K.titre('CA prévisionnel', 'Par année d\'encaissement : base des seuils de la micro-entreprise et de la franchise de TVA') +
      (aPreciser ? '<div class="bandeau">' + aPreciser + ' affaire(s) sans répartition : leur reste à encaisser est compté sur ' + p.anneeCourante + '. Précisez-la dans la fiche (Appel d\'offres › Offre › « Encaissements prévus par année »).</div>' : '') +
      '<div class="tableau-conteneur"><table class="table-previsionnel"><thead><tr><th scope="col"><span class="seul-lecteur">Rubrique</span></th>' + colonnes + '</tr></thead><tbody>' +
        ligne('Encaissé', 'encaisse', false, 'factures payées') +
        ligne('Prévu', 'prevu', false, 'affaires gagnées, reste à encaisser') +
        ligne('CA certain', 'certain', true) +
        ligne('Potentiel', 'potentiel', false, 'offres déposées, si elles sont gagnées') +
        ligne('Avec potentiel', 'total', true) +
        ligneJ('Jours à produire', 'joursPrevu', 'affaires gagnées : montant de l\'année / prix par jour') +

        '<th scope="col">Remarques</th></tr></thead><tbody>' + affaires + '</tbody></table></div>' : '<p class="vide">Aucune affaire gagnée ou déposée.</p>') +
      '<p class="legende">Seuils comparés au CA certain (encaissé + prévu). Le potentiel n\'est pas pondéré. Seuils modifiables dans Paramètres (seuil.*).</p>';
  }

  K.ecrans.previsionnel = { titre: 'CA prévisionnel', rendu: ecranPrevisionnel, nav: 'accueil' };
})();

  <script>
/* Kompa Affaires — module Estimation : estimations au ratio, bibliothèque, index Insee, référentiels. */
(function () {
  'use strict';
  var K = window.KA;
  var $ = K.$, $$ = K.$$, esc = K.esc;

  function onglets(actif) {
    var o = [['', 'Estimations'], ['bibliotheque', 'Bibliothèque'], ['indices', 'Index Insee'], ['referentiels', 'Référentiels']];
    return '<nav class="sous-nav" aria-label="Module Estimation">' + o.map(function (x) {
      return '<a href="#estimation' + (x[0] ? '/' + x[0] : '') + '"' + (x[0] === actif ? ' aria-current="page"' : '') + '>' + x[1] + '</a>';

  }

  function ecranEstimation(el, param) {
    param = String(param || '');
    var vue = ['referentiels', 'indices', 'bibliotheque'].indexOf(param) >= 0 ? param : '';
    el.innerHTML = K.titre('Estimation des travaux', 'Estimations reliées aux affaires par le n° KA ; données dans le classeur « Kompa Estimation — données ».') +
      onglets(vue) + '<div id="est-contenu"><div class="chargement">Lecture…</div></div>';
    var zone = $('#est-contenu', el);
    if (param.indexOf('nouvelle') === 0) {
      var idAffaire = param.split(':')[1] || '';
      K.charger('est-form:' + idAffaire, 'apiEstFormulaire', [idAffaire], function (f) { rendreFormulaire(zone, f); },
        function (e) { zone.innerHTML = K.bandeauErreur(e); });
    } else if (/^ES-/.test(param)) {
      K.charger('est:' + param, 'apiEstEstimation', [param], function (c) { rendreEstimation(zone, c); },
        function (e) { zone.innerHTML = K.bandeauErreur(e); });
    } else if (vue === 'bibliotheque') {
      K.charger('est-biblio', 'apiEstBibliotheque', [], function (b) { rendreBibliotheque(zone, b); },
        function (e) { zone.innerHTML = K.bandeauErreur(e); });
    } else if (vue === 'indices') {
      K.charger('est-indices', 'apiEstIndices', [], function (d) { rendreIndices(zone, d); },
        function (e) { zone.innerHTML = K.bandeauErreur(e); });
    } else if (vue === 'referentiels') {
      K.charger('est-ref', 'apiEstReferentiels', [], function (refs) { rendreReferentiels(zone, refs); },
        function (e) { zone.innerHTML = K.bandeauErreur(e); });
    } else {
      K.charger('est-accueil', 'apiEstAccueil', [], function (d) { rendreListe(zone, d); },
        function (e) { zone.innerHTML = K.bandeauErreur(e); });
    }
  }

  // ——— Liste des estimations ———
  function rendreListe(zone, d) {
    var bouton = '<div class="actions-ligne"><a class="bouton" href="#estimation/nouvelle">Nouvelle estimation</a>' +
      '<span class="legende">Estimation au ratio : typologie, surface, coefficient de localisation, date des travaux → montant par lot. Les ratios viennent de la <a href="#estimation/bibliotheque">bibliothèque</a>.</span></div>';
    if (!d.estimations.length) {
      zone.innerHTML = bouton + '<div class="vide-etat"><p><strong>Aucune estimation pour l\'instant.</strong></p>' +
        '<p class="legende">Commencez par importer les postes d\'un ou plusieurs marchés attribués dans la <a href="#estimation/bibliotheque">bibliothèque</a>, puis créez une estimation.</p></div>';
      return;
    }
    zone.innerHTML = bouton + '<div class="tableau-conteneur"><table><thead><tr><th scope="col">N°</th><th scope="col">Affaire</th><th scope="col">Phase</th>' +
      '<th scope="col">Typologie</th><th scope="col" class="num">Total HT</th><th scope="col">Statut</th></tr></thead><tbody>' +
      d.estimations.map(function (e) {
        return '<tr><td class="mono"><a href="#estimation/' + esc(e.id) + '">' + esc(e.id) + '</a></td><td><a href="#affaire/' + esc(e.id_affaire) + '">' + esc(e.id_affaire) + '</a> ' +
          '<span class="legende">' + esc(e.acheteur) + '</span></td><td>' + esc(e.phase) + ' · ind ' + esc(e.indice) + '</td>' +
          '<td>' + esc(e.typologie) + '</td><td class="num mono">' + (e.total_ht === '' ? '' : K.euros(e.total_ht)) + '</td><td>' + esc(e.statut) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ——— Index Insee ———
  function mois(m) { var x = String(m || '').match(/^(\d{4})-(\d{2})$/); return x ? x[2] + '/' + x[1] : ''; }
  function nombre(v) { return v === null || v === undefined || v === '' ? '' : Number(v).toFixed(1).replace('.', ','); }

  function rendreIndices(zone, d) {
    var etat = d.etat;
    var bandeau = !etat
      ? '<p class="bandeau">Aucune valeur chargée : cliquez sur « Mettre à jour les index » (premier chargement depuis 2015, quelques secondes).</p>'
      : etat.enEchec
        ? '<p class="bandeau bandeau--erreur" role="alert"><strong>Dernière mise à jour en échec</strong> le ' + esc(K.dateHeure(etat.date)) + ' : ' + esc(etat.detail) + '</p>'
        : '<p class="bandeau">Dernière mise à jour le ' + esc(K.dateHeure(etat.date)) + ' — ' + esc(etat.detail) + '</p>';
    var table = function (famille, titre) {
      var lignes = d.series.filter(function (s) { return s.famille === famille; });
      return '<section class="groupe-param"><h2>' + titre + ' <span class="legende">' + lignes.length + ' index</span></h2>' +
        '<div class="tableau-conteneur"><table class="table-indices"><thead><tr><th scope="col">Index</th><th scope="col">Libellé</th>' +
        '<th scope="col">Dernier mois</th><th scope="col" class="num">Valeur</th><th scope="col">Qualité</th><th scope="col">idbank</th><th scope="col"><span class="seul-lecteur">Historique</span></th></tr></thead><tbody>' +
        lignes.map(function (s) {
          var dv = s.dernier;
          return '<tr' + (s.arretee === 'oui' ? ' class="est-arretee"' : '') + '><td class="mono"><strong>' + esc(s.code) + '</strong></td>' +
            '<td>' + esc(s.libelle) + (s.arretee === 'oui' ? ' <span class="legende">— série arrêtée, non utilisée pour l\'actualisation</span>' : '') + '</td>' +
            '<td class="mono">' + (dv ? mois(dv.mois) : '<span class="vide">—</span>') + '</td>' +
            '<td class="num mono">' + (dv ? nombre(dv.valeur) : '') + '</td>' +
            '<td>' + (dv ? (dv.qualite === 'provisoire' ? '<span class="statut statut--alerte">provisoire</span>' : 'définitive') : '') + '</td>' +
            '<td class="mono legende">' + esc(s.idbank) + '</td>' +
            '<td>' + (dv ? '<button class="bouton bouton--discret" type="button" data-historique="' + esc(s.code) + '">Historique</button>' : '') + '</td></tr>' +
            '<tr class="ligne-historique" data-pour="' + esc(s.code) + '" hidden><td colspan="7"></td></tr>';
        }).join('') + '</tbody></table></div></section>';
    };
    zone.innerHTML = bandeau +
      '<div class="actions-ligne"><button class="bouton" type="button" data-maj-indices>Mettre à jour les index</button>' +
      '<span class="legende">Source : API BDM de l\'Insee. Mise à jour automatique chaque mois ; les index paraissent 2 à 3 mois après le mois concerné.</span></div>' +
      (etat ? calculette() : '') + table('BT', 'Index du bâtiment (BT)') + table('TP', 'Index des travaux publics (TP)') + table('DIV', 'Index divers de la construction');
    brancherCalculette(zone);

    $('[data-maj-indices]', zone).addEventListener('click', function () {
      var b = this;
      b.disabled = true; b.textContent = 'Mise à jour…';
      K.appel('apiEstIndicesMettreAJour').then(function (bilan) {
        if (bilan.ok) K.toast(bilan.ajoutees + ' valeur(s) ajoutée(s), ' + bilan.modifiees + ' modifiée(s).');
        else K.toast('Échec : ' + bilan.erreur + '. Dernières valeurs conservées.', true);
        K.charger('est-indices', 'apiEstIndices', [], function (d2) { rendreIndices(zone, d2); });
      }).catch(function (e) { b.disabled = false; b.textContent = 'Mettre à jour les index'; K.toast(e.message, true); });
    });
    $$('[data-historique]', zone).forEach(function (b) {
      b.addEventListener('click', function () {
        var code = b.getAttribute('data-historique');
        var tr = $('tr[data-pour="' + code + '"]', zone);
        if (!tr.hidden) { tr.hidden = true; return; }
        tr.hidden = false;
        tr.firstChild.innerHTML = '<div class="chargement">Lecture…</div>';
        K.appel('apiEstIndiceHistorique', code).then(function (h) {
          tr.firstChild.innerHTML = '<div class="historique-index">' + h.slice().reverse().map(function (v) {
            return '<span class="mono"><strong>' + mois(v.mois) + '</strong> ' + nombre(v.valeur) + (v.qualite === 'provisoire' ? ' (p)' : '') + '</span>';
          }).join('') + '</div><p class="legende">36 derniers mois ; (p) = valeur provisoire.</p>';
        }).catch(function (e) { tr.firstChild.innerHTML = K.bandeauErreur(e); });
      });
    });
  }


  // ——— Calculette d'actualisation ———
  function calculette() {
    return '<section class="groupe-param" id="calculette"><h2>Calculette d\'actualisation</h2>' +
      '<p class="legende">PU actualisé = PU M0 × (index du dernier mois publié / index du mois M0). Index du lot ; à défaut BT01 (neuf), BT50 (réhabilitation) ou TP01 (VRD).</p>' +
      '<form class="form-grille form-grille--4" data-calculette novalidate>' +
        '<div class="champ-bloc"><label for="c-pu">PU HT à M0 (€)</label><input class="champ mono num" id="c-pu" inputmode="decimal" placeholder="ex. 100"></div>' +
        '<div class="champ-bloc"><label for="c-m0">Mois M0</label><input class="champ mono" id="c-m0" placeholder="MM/AAAA"></div>' +
        '<div class="champ-bloc"><label for="c-lot">Lot</label><input class="champ mono" id="c-lot" placeholder="ex. ELE"></div>' +
        '<div class="champ-bloc"><label for="c-nature">Nature</label><select class="champ" id="c-nature"><option>Neuf</option><option>Réhabilitation lourde</option><option>Réhabilitation légère</option></select></div>' +
        '<div class="bloc-form__actions"><button class="bouton" type="submit">Actualiser</button></div>' +

  function brancherCalculette(zone) {

      ev.preventDefault();

          : '<p class="bandeau bandeau--erreur">Non actualisable : ' + esc(r.message) + '</p>';
      }).catch(function (e) { sortie.innerHTML = K.bandeauErreur(e); });
    });
  }

  // ——— Référentiels modifiables ———
  var ORDRE = ['LOTS', 'TYPOLOGIES', 'K', 'FAMILLES', 'PARAMS'];

  function champ(c, v, prefixe) {
    var id = prefixe + '-' + c.nom;
    v = v === null || v === undefined ? '' : String(v);
    var attrs = ' id="' + id + '" data-col="' + c.nom + '" aria-label="' + esc(c.libelle) + '"';
    if (c.type === 'lecture') return '<span class="' + (c.nom === 'cle' ? 'mono' : 'legende') + '">' + esc(v) + '</span>';
    if (c.type === 'oui_non' || c.type.indexOf('choix:') === 0) {
      var opts = c.type === 'oui_non' ? ['oui', 'non'] : c.type.slice(6).split('|');
      return '<select class="champ"' + attrs + '>' + opts.map(function (o) { return '<option' + (o === (v || opts[0]) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    }
    var cls = c.type === 'nombre' ? 'champ mono num' : (c.type === 'code' ? 'champ mono' : 'champ');
    return '<input class="' + cls + '"' + attrs + ' type="text" value="' + esc(v) + '"' + (c.type === 'nombre' ? ' inputmode="decimal"' : '') + '>';

  function rendreReferentiels(zone, refs) {
    zone.innerHTML = ORDRE.filter(function (n) { return refs[n]; }).map(function (nom) {
      var r = refs[nom];

        return '<tr data-ref="' + nom + '" data-cle="' + esc(l[r.cle]) + '">' + r.colonnes.map(function (c) {
          var lecture = c.nom === r.cle ? { nom: c.nom, libelle: c.libelle, type: 'lecture' } : c;

        }).join('') + '<td><button class="bouton" type="button" data-enregistrer disabled>Enregistrer</button></td></tr>';
      }).join('');
      var ajout = r.sansAjout ? '' : '<tr class="ligne-ajout" data-ajout="' + nom + '">' + r.colonnes.map(function (c) {

      return '<section class="groupe-param" id="ref-' + nom + '"><h2>' + esc(r.titre) + '</h2><p class="legende">' + esc(r.aide) + '</p>' +
        '<div class="tableau-conteneur"><table class="table-ref"><thead><tr>' + entetes + '<th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +

  function lire(tr) {
    var o = {};
    $$('[data-col]', tr).forEach(function (x) { o[x.getAttribute('data-col')] = x.value; });
    return o;
  }

  function brancher(zone) {
    $$('tr[data-cle]', zone).forEach(function (tr) {
      var bouton = $('[data-enregistrer]', tr);
      var initial = JSON.stringify(lire(tr));

        }).catch(function (e) { bouton.disabled = false; K.toast(e.message, true); });
      });
    });
    $$('tr[data-ajout]', zone).forEach(function (tr) {
      $('[data-ajouter]', tr).addEventListener('click', function () {
        var nom = tr.getAttribute('data-ajout');
        K.appel('apiEstRefAjouter', nom, lire(tr)).then(function () {
          K.toast('Ligne ajoutée.');
          K.charger('est-ref', 'apiEstReferentiels', [], function (refs) {
            rendreReferentiels(zone, refs);
            var s = $('#ref-' + nom, zone); if (s) s.scrollIntoView();
          });
        }).catch(function (e) { K.toast(e.message, true); });
      });
    });
  }

  // ——— Onglet « Estimations » de la fiche affaire ———
  K.estimationsAffaire = function (zone, idAffaire) {
    K.charger('est-affaire:' + idAffaire, 'apiEstAffaire', [idAffaire], function (liste) {

      zone.innerHTML = (liste.length
        ? '<ul class="liste-simple">' + liste.map(function (e) {
            return '<li><a class="mono" href="#estimation/' + esc(e.id) + '">' + esc(e.id) + '</a> · ' + esc(e.phase) + ' ind ' + esc(e.indice) + ' · ' + esc(e.statut) +
              (e.total_ht === '' ? '' : ' · <span class="mono">' + K.euros(e.total_ht) + ' HT</span>') +
              (e.export_url ? ' · <a href="' + esc(e.export_url) + '" target="_blank" rel="noopener">fichier .xlsx</a>' : '') + '</li>';
          }).join('') + '</ul>'
        : '<p class="vide">Aucune estimation pour cette affaire.</p>') + nouvelle;
    }, function (e) { zone.innerHTML = K.bandeauErreur(e); });
  };

  // ——— Outils d'affichage ———
  var eur2 = function (x) { return x === '' || x === null || x === undefined ? '' : Number(x).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '\u00a0€'; };
  var options = function (liste, choisi, val, lib) {
    return liste.map(function (x) {
      var v = val ? x[val] : x, l = lib ? lib(x) : x;
      return '<option value="' + esc(v) + '"' + (String(v) === String(choisi) ? ' selected' : '') + '>' + esc(l) + '</option>';
    }).join('');
  };
  var FIAB = { A: 'statut--ok', B: 'statut--encours', C: 'statut--alerte' };
  var fiab = function (f) { return f ? '<span class="statut ' + (FIAB[f] || 'statut--neutre') + '">' + esc(f) + '</span>' : ''; };

  // ——— Bibliothèque : ratios, import d'un marché, imports ———
  function rendreBibliotheque(zone, b) {
    var natures = b.natures, typos = b.typologies;
    zone.innerHTML =
      '<section class="groupe-param" id="biblio-ratios"><h2>Ratios</h2>' +
        '<p class="legende">Médiane des marchés importés de même typologie et de même nature (neuf ou réhabilitation), actualisée au dernier index du lot. Fiabilité C sous 5 marchés.</p>' +
        '<div class="form-grille form-grille--4"><div class="champ-bloc"><label for="r-typo">Typologie</label><select class="champ" id="r-typo">' + options(typos, '', 'code', function (t) { return t.libelle; }) + '</select></div>' +
        '<div class="champ-bloc"><label for="r-nature">Nature</label><select class="champ" id="r-nature">' + options(natures, natures[1] || natures[0]) + '</select></div></div>' +
        '<div data-ratios aria-live="polite"></div></section>' +
      '<section class="groupe-param" id="biblio-import"><h2>Importer un marché attribué</h2>' +
        '<p class="legende">Copiez les postes du marché (libellé et montant HT des attributaires, un poste par ligne), depuis un tableur ou un texte « poste ; montant ». ' +
        'Chaque poste est rattaché à un lot ; les postes d\'un même lot sont additionnés. <strong>Ne saisissez ni entreprise, ni site, ni nom d\'opération.</strong></p>' +
        '<form class="form-grille form-grille--4" data-import novalidate>' +
          '<div class="champ-bloc"><label for="i-typo">Typologie</label><select class="champ" id="i-typo">' + options(typos, '', 'code', function (t) { return t.libelle; }) + '</select></div>' +
          '<div class="champ-bloc"><label for="i-nature">Nature</label><select class="champ" id="i-nature">' + options(natures, natures[1] || natures[0]) + '</select></div>' +
          '<div class="champ-bloc"><label for="i-dep">Département</label><input class="champ mono" id="i-dep" placeholder="ex. 2B"></div>' +
          '<div class="champ-bloc"><label for="i-m0">Mois des offres (M0)</label><input class="champ mono" id="i-m0" placeholder="MM/AAAA"></div>' +
          '<div class="champ-bloc"><label for="i-surface">Surface de référence (m²)</label><input class="champ mono num" id="i-surface" inputmode="decimal" placeholder="SDP ou m² aménagés"></div>' +
          '<div class="champ-bloc champ-bloc--large"><label for="i-comm">Commentaire (facultatif)</label><input class="champ" id="i-comm" maxlength="200" placeholder="ex. réhabilitation atelier + aire de lavage, site occupé"></div>' +
          '<div class="champ-bloc champ-bloc--large"><label for="i-texte">Postes collés</label><textarea class="champ mono" id="i-texte" rows="8" placeholder="Dispositions générales\t66 261\nGros œuvre\t902 319\nÉlectricité\t262 714,34"></textarea></div>' +
          '<div class="bloc-form__actions"><button class="bouton" type="submit">Analyser les postes</button></div>' +
        '</form><div data-postes></div></section>' +
      '<section class="groupe-param" id="biblio-imports"><h2>Marchés importés</h2><div data-imports></div></section>';

    var chargerRatios = function () {
      var z = $('[data-ratios]', zone);
      z.innerHTML = '<div class="chargement">Calcul…</div>';
      K.appel('apiEstRatios', $('#r-typo', zone).value, $('#r-nature', zone).value).then(function (r) {
        z.innerHTML = r.length ? '<div class="tableau-conteneur"><table class="table-ratios"><thead><tr><th scope="col">Lot</th><th scope="col" class="num">Marchés</th>' +
          '<th scope="col" class="num">Médiane € HT/m²</th><th scope="col" class="num">Min</th><th scope="col" class="num">Max</th><th scope="col">Index</th><th scope="col">Fiabilité</th></tr></thead><tbody>' +
          r.map(function (x) {
            return '<tr><td><span class="mono">' + esc(x.lot) + '</span> ' + esc(x.libelle) + '</td><td class="num mono">' + x.n + '</td>' +
              '<td class="num mono"><strong>' + eur2(x.mediane) + '</strong></td><td class="num mono">' + eur2(x.min) + '</td><td class="num mono">' + eur2(x.max) + '</td>' +
              '<td class="mono">' + esc(x.indice) + ' ' + mois(x.moisIndice) + (x.nonActualisees ? ' <span class="statut statut--alerte">' + x.nonActualisees + ' non actualisée(s)</span>' : '') + '</td>' +
              '<td>' + fiab(x.fiabilite) + (x.sousSeuil ? ' <span class="legende">sous le seuil' + (x.utilisable ? '' : ', masqué') + '</span>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div>'
          : '<p class="vide">Aucun marché importé pour cette typologie et cette nature.</p>';
      }).catch(function (e) { z.innerHTML = K.bandeauErreur(e); });
    };
    $('#r-typo', zone).addEventListener('change', chargerRatios);
    $('#r-nature', zone).addEventListener('change', chargerRatios);
    chargerRatios();

    var rendreImports = function (imports) {
      var z = $('[data-imports]', zone);
      z.innerHTML = imports.length ? '<div class="tableau-conteneur"><table><thead><tr><th scope="col">Import</th><th scope="col">Typologie · nature</th><th scope="col">Dép.</th>' +
        '<th scope="col">M0</th><th scope="col" class="num">Surface</th><th scope="col" class="num">Total HT</th><th scope="col">Lots</th><th scope="col">Statut</th><th scope="col"><span class="seul-lecteur">Action</span></th></tr></thead><tbody>' +
        imports.map(function (i) {
          return '<tr data-import="' + esc(i.id) + '"' + (i.statut === 'annulé' ? ' class="est-arretee"' : '') + '><td class="mono">' + esc(i.id) + (i.commentaire ? '<div class="legende">' + esc(i.commentaire) + '</div>' : '') + '</td>' +
            '<td>' + esc(i.typologie) + ' · ' + esc(i.nature) + '</td><td class="mono">' + esc(i.departement) + '</td><td class="mono">' + mois(i.m0) + '</td>' +
            '<td class="num mono">' + Number(i.surface).toLocaleString('fr-FR') + ' m²</td><td class="num mono">' + K.euros(i.total_ht) + '</td>' +
            '<td class="legende">' + i.observations.map(function (o) { return esc(o.lot) + ' ' + eur2(o.ratio) + '/m²'; }).join(' · ') + '</td>' +
            '<td>' + esc(i.statut) + '</td><td>' + (i.statut === 'actif' ? '<button class="bouton bouton--discret bouton--petit" type="button" data-annuler-import>Annuler</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="vide">Aucun marché importé.</p>';
      $$('[data-annuler-import]', z).forEach(function (bt) {
        bt.addEventListener('click', function () {
          var id = bt.closest('tr').getAttribute('data-import');
          if (!window.confirm('Annuler l\'import ' + id + ' ? Ses ratios ne seront plus utilisés.')) return;
          bt.disabled = true;
          K.appel('apiEstAnnulerImport', id).then(function (r) { K.toast('Import annulé.'); rendreImports(r.imports); chargerRatios(); })
            .catch(function (e) { bt.disabled = false; K.toast(e.message, true); });
        });
      });
    };
    rendreImports(b.imports);

    $('[data-import]', zone).addEventListener('submit', function (ev) {
      ev.preventDefault();
      var z = $('[data-postes]', zone);
      K.appel('apiEstAnalyserPostes', $('#i-texte', zone).value).then(function (r) {
        if (!r.postes.length) { z.innerHTML = '<p class="bandeau bandeau--erreur">Aucun poste reconnu : un libellé et un montant par ligne.</p>'; return; }
        var lotsOpt = function (choisi) { return '<option value="">— lot ? —</option>' + options(b.lots, choisi, 'code', function (l) { return l.code + ' — ' + l.libelle; }); };
        z.innerHTML = '<h3>Vérifiez le rattachement des postes</h3><div class="tableau-conteneur"><table class="table-postes"><thead><tr><th scope="col">Poste</th><th scope="col">Lot</th>' +
          '<th scope="col" class="num">Montant HT</th><th scope="col"><span class="seul-lecteur">Retirer</span></th></tr></thead><tbody>' +
          r.postes.map(function (p) {
            return '<tr data-poste><td><input class="champ" data-p="libelle" value="' + esc(p.libelle) + '" aria-label="Poste"></td>' +
              '<td><select class="champ' + (p.lot ? '' : ' est-modifie') + '" data-p="lot" aria-label="Lot">' + lotsOpt(p.lot) + '</select></td>' +
              '<td><input class="champ mono num" data-p="montant" value="' + esc(String(p.montant).replace('.', ',')) + '" inputmode="decimal" aria-label="Montant HT"></td>' +
              '<td><button class="bouton bouton--discret bouton--petit" type="button" data-retirer-poste>Retirer</button></td></tr>';
          }).join('') + '</tbody></table></div>' +
          (r.ecartees.length ? '<p class="legende">' + r.ecartees.length + ' ligne(s) écartée(s) : ' + r.ecartees.map(function (x) { return 'ligne ' + x.ligne + ' (' + esc(x.motif) + ')'; }).join(', ') + '.</p>' : '') +
          '<p class="legende" data-total-postes></p><div class="actions-ligne"><button class="bouton" type="button" data-enregistrer-import>Enregistrer l\'import</button></div>';
        var total = function () {
          var t = 0;
          $$('[data-p="montant"]', z).forEach(function (x) { t += Number(String(x.value).replace(/\s/g, '').replace(',', '.')) || 0; });
          $('[data-total-postes]', z).textContent = $$('tr[data-poste]', z).length + ' poste(s), total ' + eur2(t) + ' HT.';
        };
        total();
        z.addEventListener('input', total);
        $$('[data-retirer-poste]', z).forEach(function (bt) { bt.addEventListener('click', function () { bt.closest('tr').remove(); total(); }); });
        $('[data-enregistrer-import]', z).addEventListener('click', function () {
          var bt = this;
          var donnees = {
            typologie: $('#i-typo', zone).value, nature: $('#i-nature', zone).value, departement: $('#i-dep', zone).value,
            m0: $('#i-m0', zone).value, surface: $('#i-surface', zone).value, commentaire: $('#i-comm', zone).value,
            postes: $$('tr[data-poste]', z).map(function (tr) {
              return { libelle: $('[data-p="libelle"]', tr).value, lot: $('[data-p="lot"]', tr).value, montant: $('[data-p="montant"]', tr).value };
            })
          };
          bt.disabled = true;
          K.appel('apiEstImporter', donnees).then(function (res) {
            K.toast('Import ' + res.id + ' enregistré.' + (res.brouillonsActualises ? ' ' + res.brouillonsActualises + ' estimation(s) en brouillon mise(s) à jour.' : ''));
            z.innerHTML = '';
            $('#i-texte', zone).value = '';
            rendreImports(res.imports);
            $('#r-typo', zone).value = donnees.typologie; $('#r-nature', zone).value = donnees.nature;
            chargerRatios();
          }).catch(function (e) { bt.disabled = false; K.toast(e.message, true); });
        });
      }).catch(function (e) { z.innerHTML = K.bandeauErreur(e); });
    });
  }

  // ——— Nouvelle estimation (assistant au ratio) ———
  function rendreFormulaire(zone, f) {
    var a0 = f.affaires.filter(function (a) { return a.id === f.choisie; })[0] || f.affaires[0] || {};
    var facteurs = Object.keys(f.k).filter(function (x) { return x !== 'kdép'; });
    var selectK = function (fac, choisi) {
      return '<select class="champ" data-k="' + esc(fac) + '" id="k-' + esc(fac) + '">' + (fac === 'kdép' ? '' : '<option value="">—</option>') +
        f.k[fac].map(function (m) {
          return '<option value="' + esc(m.id) + '"' + (m.id === choisi ? ' selected' : '') + '>' + esc(m.modalite) + ' (' + String(m.coefficient).replace('.', ',') + ')</option>';
        }).join('') + '</select>';
    };
    var neutre = function (fac) { var m = f.k[fac].filter(function (x) { return x.coefficient === 0; })[0]; return m ? m.id : ''; };
    zone.innerHTML = '<form class="assistant" data-assistant novalidate>' +
      '<fieldset><legend>1. Affaire et typologie</legend><div class="form-grille form-grille--4">' +
        '<div class="champ-bloc champ-bloc--large"><label for="e-affaire">Affaire</label><select class="champ" id="e-affaire">' +
          options(f.affaires, a0.id, 'id', function (a) { return a.id + ' — ' + a.acheteur + ' — ' + String(a.objet || '').slice(0, 60); }) + '</select></div>' +
        '<div class="champ-bloc"><label for="e-phase">Phase</label><select class="champ" id="e-phase">' + options(f.phases, f.phases[1] || f.phases[0]) + '</select></div>' +
        '<div class="champ-bloc"><label for="e-typo">Typologie</label><select class="champ" id="e-typo">' + options(f.typologies, '', 'code', function (t) { return t.libelle; }) + '</select></div>' +
        '<div class="champ-bloc"><label for="e-nature">Nature</label><select class="champ" id="e-nature">' + options(f.natures, f.natures[1] || f.natures[0]) + '</select></div>' +
      '</div></fieldset>' +
      '<fieldset><legend>2. Surface et lieu</legend><div class="form-grille form-grille--4">' +
        '<div class="champ-bloc"><label for="e-surface">Surface de référence (m²)</label><input class="champ mono num" id="e-surface" inputmode="decimal" placeholder="SDP"></div>' +
        '<div class="champ-bloc"><label for="e-dep">Département</label><input class="champ mono" id="e-dep" value="' + esc(a0.departement || '') + '" placeholder="ex. 2B"></div>' +
      '</div></fieldset>' +
      '<fieldset><legend>3. Coefficient de localisation (' + esc(f.kMode) + ')</legend><div class="form-grille form-grille--4">' +
        (f.k['kdép'] ? '<div class="champ-bloc"><label for="k-kdép">kdép (département)</label>' + selectK('kdép', '') + '</div>' : '') +
        facteurs.map(function (fac) { return '<div class="champ-bloc"><label for="k-' + esc(fac) + '">' + esc(fac) + '</label>' + selectK(fac, neutre(fac)) + '</div>'; }).join('') +
      '</div></fieldset>' +
      '<fieldset><legend>4. Actualisation et projection</legend><div class="form-grille form-grille--4">' +
        '<div class="champ-bloc"><span class="label">Index utilisé</span><p class="legende">Dernier mois publié' + (f.dernierIndex ? ' (' + mois(f.dernierIndex) + ')' : '') + ', index de chaque lot.</p></div>' +
        '<div class="champ-bloc"><label for="e-travaux">Date des travaux (facultatif)</label><input class="champ mono" id="e-travaux" placeholder="MM/AAAA"></div>' +
      '</div></fieldset>' +
      '<fieldset><legend>5. Lots</legend><div data-lots-est><div class="chargement">Lecture des ratios…</div></div></fieldset>' +
      '<div class="actions-ligne"><button class="bouton bouton--discret" type="button" data-apercu>Aperçu</button><button class="bouton" type="submit">Créer l\'estimation</button></div>' +
      '</form><div data-resultat-apercu aria-live="polite"></div>';
    var form = $('[data-assistant]', zone);
    var choisirKdep = function () {
      var s = $('#k-kdép', form); if (!s) return;
      var dep = $('#e-dep', form).value.trim().toUpperCase().replace(/^(\d)$/, '0$1');
      var m = f.k['kdép'].filter(function (x) { return x.modalite.split(' ')[0].toUpperCase() === dep; })[0];
      if (m) s.value = m.id;
    };
    choisirKdep();
    $('#e-dep', form).addEventListener('change', choisirKdep);
    $('#e-affaire', form).addEventListener('change', function () {
      var a = f.affaires.filter(function (x) { return x.id === $('#e-affaire', form).value; })[0];
      if (a && a.departement) { $('#e-dep', form).value = a.departement; choisirKdep(); }
    });
    var chargerLots = function () {
      var z = $('[data-lots-est]', form);
      K.appel('apiEstRatios', $('#e-typo', form).value, $('#e-nature', form).value).then(function (r) {
        var parLot = {};
        r.forEach(function (x) { parLot[x.lot] = x; });
        z.innerHTML = '<p class="legende">Lots cochés d\'office : ceux qui ont un ratio. Un lot sans ratio peut être ajouté, son PU sera à saisir.</p><div class="lots-est">' +
          f.lots.map(function (l) {
            var x = parLot[l.code];
            var ok = x && x.utilisable;
            return '<label class="lot-est"><input type="checkbox" value="' + esc(l.code) + '"' + (ok ? ' checked' : '') + '> <span class="mono">' + esc(l.code) + '</span> ' + esc(l.libelle) +
              '<span class="legende">' + (x ? eur2(x.mediane) + '/m² · ' + x.n + ' marché(s) · fiab. ' + esc(x.fiabilite) : 'pas de ratio') + '</span></label>';
          }).join('') + '</div>';
      }).catch(function (e) { z.innerHTML = K.bandeauErreur(e); });
    };
    $('#e-typo', form).addEventListener('change', chargerLots);
    $('#e-nature', form).addEventListener('change', chargerLots);
    chargerLots();
    var lire = function () {
      return {
        id_affaire: $('#e-affaire', form).value, phase: $('#e-phase', form).value, typologie: $('#e-typo', form).value, nature: $('#e-nature', form).value,
        surface: $('#e-surface', form).value, departement: $('#e-dep', form).value, date_travaux: $('#e-travaux', form).value,
        k_ids: $$('[data-k]', form).map(function (s) { return s.value; }).filter(String),
        lots: $$('.lots-est input:checked', form).map(function (c) { return c.value; })
      };
    };
    var sortie = $('[data-resultat-apercu]', zone);
    $('[data-apercu]', form).addEventListener('click', function () {
      K.appel('apiEstApercu', lire()).then(function (c) {
        sortie.innerHTML = '<h2>Aperçu</h2>' + tableLignes(c.lignes, c.totaux, { aleas: c.entete.aleas_pct, tva: c.entete.tva, k: c.k.k }, false) + avertissements(c.avertissements);
      }).catch(function (e) { sortie.innerHTML = K.bandeauErreur(e); });
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var bt = $('button[type=submit]', form); bt.disabled = true;
      K.appel('apiEstCreer', lire()).then(function (c) {
        K.toast('Estimation ' + c.estimation.id + ' créée.');
        K.afficher('estimation/' + c.estimation.id, true);
      }).catch(function (e) { bt.disabled = false; K.toast(e.message, true); });
    });
  }

  function avertissements(liste) {
    return liste && liste.length ? '<details class="avert-est"><summary>' + liste.length + ' point(s) à vérifier</summary><ul>' +
      liste.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></details>' : '';
  }

  /** Tableau des lignes et des totaux ; modifiable = PU HT saisissables. */
  function tableLignes(lignes, t, p, modifiable) {
    return '<div class="tableau-conteneur"><table class="table-est"><thead><tr><th scope="col">N°</th><th scope="col">Lot</th><th scope="col" class="num">Quantité</th>' +
      '<th scope="col" class="num">PU HT</th><th scope="col" class="num">Total HT</th><th scope="col">Fiab.</th><th scope="col">Origine</th></tr></thead><tbody>' +
      lignes.map(function (l) {
        return '<tr data-ligne="' + esc(l.id || '') + '"><td class="mono">' + esc(l.num_article) + '</td><td><span class="mono">' + esc(l.lot) + '</span> ' + esc(l.designation) + '</td>' +
          '<td class="num mono">' + Number(l.quantite).toLocaleString('fr-FR') + ' ' + esc(l.unite) + '</td>' +
          '<td class="num">' + (modifiable ? '<input class="champ mono num champ-pu" data-pu value="' + esc(String(l.pu_ht).replace('.', ',')) + '" inputmode="decimal" aria-label="PU HT ' + esc(l.lot) + '">' : '<span class="mono">' + eur2(l.pu_ht) + '</span>') + '</td>' +
          '<td class="num mono"><strong>' + eur2(l.total_ht) + '</strong></td><td>' + fiab(l.fiabilite) + '</td><td class="legende">' + esc(l.commentaire) + '</td></tr>';
      }).join('') +
      '<tr class="ligne-total"><td></td><td>Total HT des lots</td><td></td><td></td><td class="num mono">' + eur2(t.ht) + '</td><td colspan="2"></td></tr>' +
      '<tr><td></td><td>Aléas et imprévus (' + String(p.aleas).replace('.', ',') + ' %)</td><td></td><td></td><td class="num mono">' + eur2(t.aleas) + '</td><td colspan="2"></td></tr>' +
      '<tr class="ligne-total"><td></td><td><strong>TOTAL HT</strong></td><td></td><td></td><td class="num mono"><strong>' + eur2(t.htAleas) + '</strong></td><td colspan="2" class="legende">K = ' + String(p.k).replace('.', ',') + '</td></tr>' +
      '<tr><td></td><td>TVA (' + String(p.tva).replace('.', ',') + ' %)</td><td></td><td></td><td class="num mono">' + eur2(t.tva) + '</td><td colspan="2"></td></tr>' +
      '<tr class="ligne-total"><td></td><td><strong>TOTAL TTC</strong></td><td></td><td></td><td class="num mono"><strong>' + eur2(t.ttc) + '</strong></td><td colspan="2"></td></tr>' +
      '</tbody></table></div>';
  }

  // ——— Estimation enregistrée ———
  function rendreEstimation(zone, c) {
    var e = c.estimation, modifiable = e.statut !== 'figée';
    zone.innerHTML = '<div class="tete-est"><h2>' + esc(e.id) + ' — ' + esc(e.phase) + ' ind ' + esc(e.indice) + ' <span class="statut ' + (modifiable ? 'statut--encours' : 'statut--ok') + '">' + esc(e.statut) + '</span></h2>' +
        '<p><a href="#affaire/' + esc(c.affaire.id) + '" class="mono">' + esc(c.affaire.id) + '</a> ' + esc(c.affaire.acheteur) + ' — ' + esc(c.affaire.objet) + '</p>' +
        '<p class="legende">' + esc(c.typologie) + ' · ' + esc(e.nature) + ' · département ' + esc(e.departement) + ' · ' + Number(e.surface_sdp).toLocaleString('fr-FR') + ' m² · K ' + String(e.k).replace('.', ',') +
          ' (' + esc(e.k_detail) + ')' + (e.date_travaux ? ' · travaux ' + mois(e.date_travaux) : '') + '</p></div>' +
      (c.lignesActualisees ? '<p class="bandeau">' + c.lignesActualisees + ' lot(s) mis à jour avec les ratios actuels de la bibliothèque.</p>' : '') +
      tableLignes(c.lignes, c.totaux, { aleas: e.aleas_pct, tva: e.tva, k: e.k }, modifiable) +
      (e.commentaire ? avertissements(String(e.commentaire).split(/\.\s+/).filter(String)) : '') +
      '<div class="actions-ligne"><button class="bouton" type="button" data-exporter>Exporter en .xlsx vers le Drive</button>' +
        (modifiable ? '<button class="bouton bouton--discret" type="button" data-figer>Figer</button><button class="bouton bouton--discret" type="button" data-supprimer-est>Supprimer</button>' : '') +
        (e.export_url ? '<a href="' + esc(e.export_url) + '" target="_blank" rel="noopener">Dernier export</a>' : '') +
        '<span class="legende">' + (modifiable ? 'Brouillon : les lots au ratio suivent la bibliothèque (nouveaux marchés, nouveaux index) ; un PU saisi à la main est conservé. Figée, l\'estimation ne bouge plus.' : 'Estimation figée : ratios et PU ne bougent plus.') + '</span></div>';
    $$('[data-pu]', zone).forEach(function (inp) {
      inp.addEventListener('change', function () {
        K.appel('apiEstLigneMaj', inp.closest('tr').getAttribute('data-ligne'), { pu_ht: inp.value }).then(function (c2) { K.toast('PU enregistré.'); rendreEstimation(zone, c2); })
          .catch(function (er) { K.toast(er.message, true); });
      });
    });
    $('[data-exporter]', zone).addEventListener('click', function () {
      var bt = this; bt.disabled = true; bt.textContent = 'Export…';
      K.appel('apiEstExporter', e.id).then(function (r) {
        K.toast('Fichier déposé : ' + r.dossier + ' / ' + r.nom);
        rendreEstimation(zone, r.estimation);
      }).catch(function (er) { bt.disabled = false; bt.textContent = 'Exporter en .xlsx vers le Drive'; K.toast(er.message, true); });
    });
    var fg = $('[data-figer]', zone);
    if (fg) fg.addEventListener('click', function () {
      if (!window.confirm('Figer l\'estimation ' + e.id + ' ? Elle ne sera plus modifiable.')) return;
      K.appel('apiEstFiger', e.id).then(function (c2) { K.toast('Estimation figée.'); rendreEstimation(zone, c2); }).catch(function (er) { K.toast(er.message, true); });
    });
    var sp = $('[data-supprimer-est]', zone);
    if (sp) sp.addEventListener('click', function () {
      if (!window.confirm('Supprimer l\'estimation ' + e.id + ' ?')) return;
      K.appel('apiEstSupprimer', e.id).then(function () { K.toast('Estimation supprimée.'); K.afficher('estimation', true); }).catch(function (er) { K.toast(er.message, true); });
    });
  }

  K.ecrans.estimation = { titre: 'Estimation', rendu: ecranEstimation };
})();
</script>
  <script>
/*
 * Kompa Affaires — vue smartphone (décision du 19/11/2026) : sur téléphone, l'app n'affiche que
 * ce tableau de bord, en une colonne, sans tableau ni défilement horizontal. Lecture seule.
 * Les autres écrans restent sur ordinateur (lien « Version ordinateur » en bas de page).
 */
(function () {
  'use strict';
  var K = window.KA;
  var esc = K.esc, $ = K.$;

  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var ETATS_DECL = { 'déclarée': 'statut--ok', 'en retard': 'statut--ko', 'à déclarer': 'statut--alerte', 'en cours': 'statut--encours' };

  function jour(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] : ''; }
  function pct(x) { return x === null || x === undefined ? '—' : Math.round(x * 100) + ' %'; }
  function nb(x, d) { return x === null || x === undefined ? '—' : Number(x).toFixed(d || 0).replace('.', ','); }
  function signe(x, d, suffixe) { return x === null || x === undefined ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + nb(Math.abs(x), d) + (suffixe || ''); }
  function quand(j) { return j < 0 ? 'retard ' + (-j) + ' j' : j === 0 ? 'aujourd\'hui' : j === 1 ? 'demain' : 'J-' + j; }

  function tuile(libelle, valeur, detail) {
    return '<div class="mob-tuile"><div class="mob-tuile__lib">' + esc(libelle) + '</div><div class="mob-tuile__val mono">' + valeur + '</div>' +
      (detail ? '<div class="mob-tuile__det">' + detail + '</div>' : '') + '</div>';
  }
  function carte(titre, contenu, id) {
    return '<section class="mob-carte"' + (id ? ' id="' + id + '"' : '') + '><h2>' + esc(titre) + '</h2>' + contenu + '</section>';
  }

  function rendre(el, d) {
    var t = d.tableau, ca = d.ca, s = d.suivi, f = d.fiscal;
    var maintenant = new Date();

    // 1. Alertes : mise à jour incomplète, remises imminentes (J-3 à J0)
    var alertes = ((d.etat && d.etat.alertes) || []).map(function (a) {
      return '<div class="mob-alerte"><strong>Mise à jour incomplète.</strong> ' + esc(a) + '</div>';
    }).join('');
    var remises = s.echeances.filter(function (e) { return e.type === 'Remise' && e.jours >= 0 && e.jours <= 3; });
    alertes += remises.map(function (e) {
      return '<div class="mob-alerte"><div class="mob-alerte__tete">Remise ' + esc(quand(e.jours)) + ' · <span class="mono">' + jour(e.date) + '</span></div>' +
        '<div><strong>' + esc(e.acheteur) + '</strong></div><div class="mob-legende">' + esc(String(e.objet || '').slice(0, 120)) + '</div></div>';
    }).join('');

    // 2. Chiffres clés
    var a = t.attribution;
    var enCours = t.parStatut.filter(function (x) { return x.actif && x.nombre; }).map(function (x) { return esc(x.statut) + ' ' + x.nombre; }).join(' · ') || 'aucune';
    var tuiles = '<div class="mob-tuiles">' +
      tuile('Affaires en cours', nb(t.enCours), enCours) +
      tuile('CA encaissé ' + ca.annee, K.euros(ca.encaisse), 'engagé ' + K.euros(ca.engage)) +
      tuile('Taux de Go', pct(t.go.taux), t.go.go + ' / ' + (t.go.go + t.go.nogo) + ' décisions') +
      tuile('Attribution', pct(a.taux), a.gagnees + ' / ' + (a.gagnees + a.perdues) + ' jugées') +
      '</div>' +
      '<details class="mob-plus"><summary>Autres indicateurs (12 mois)</summary><div class="mob-tuiles">' +
        tuile('Rang moyen', nb(t.rangMoyen, 1), t.rangsConnus + ' rang(s) connu(s)') +
        tuile('Écart de prix', signe(t.ecartPrixMoyen === null ? null : t.ecartPrixMoyen * 100, 1, ' %'), '+ = plus cher') +
        tuile('Écart note tech.', signe(t.ecartNoteMoyen, 1), '− = en dessous') +
        tuile('Coût réponse', t.cout.joursPour10k === null ? '—' : nb(t.cout.joursPour10k, 1) + ' j', 'pour 10 000 € gagnés') +
      '</div></details>';

    // 3. À faire : échéances à 7 jours, relances
    var lignesEch = s.echeances.slice().sort(function (x, y) { return x.jours - y.jours; }).map(function (e) {
      var cls = e.depassee ? 'statut--ko' : e.urgent ? 'statut--alerte' : 'statut--neutre';
      return '<li><div class="mob-ligne__tete"><span class="mono">' + jour(e.date) + '</span><span class="statut ' + cls + '">' + esc(quand(e.jours)) + '</span></div>' +
        '<div>' + esc(e.libelle) + '</div><div class="mob-legende">' + esc(e.acheteur) + '</div></li>';
    }).join('');
    var lignesRel = s.relances.map(function (r) {
      return '<li><div class="mob-ligne__tete"><span class="mono">' + jour(r.date_prevue) + '</span><span class="statut statut--neutre">relance</span></div>' +
        '<div>' + esc(r.type) + '</div><div class="mob-legende">' + esc(r.acheteur) + '</div></li>';
    }).join('');
    // Les 5 premières lignes visibles, la suite repliée
    var lignes = (lignesEch + lignesRel).split('</li>').filter(Boolean).map(function (l) { return l + '</li>'; });
    var aFaire = !lignes.length ? '<p class="mob-vide">Rien dans les 7 prochains jours.</p>'
      : '<ul class="mob-liste">' + lignes.slice(0, 5).join('') + '</ul>' +
        (lignes.length > 5 ? '<details class="mob-plus"><summary>Voir les ' + (lignes.length - 5) + ' autres</summary><ul class="mob-liste">' + lignes.slice(5).join('') + '</ul></details>' : '');

    // 4. Chiffre d'affaires : jauge et jalons en liste
    var echelle = Math.max(ca.engage, Math.max.apply(null, ca.jalons.map(function (j) { return j.seuil; }).concat([1]))) * 1.02;
    var pc = function (v) { return Math.min(v / echelle * 100, 100).toFixed(2) + '%'; };
    var prochain = ca.jalons.filter(function (j) { return j.cle === ca.prochain; })[0];
    var caBloc = '<div class="mob-ca"><div><div class="mob-legende">Encaissé</div><div class="mob-ca__val mono">' + K.euros(ca.encaisse) + '</div></div>' +
        '<div><div class="mob-legende">Engagé</div><div class="mob-ca__val mob-ca__val--2 mono">' + K.euros(ca.engage) + '</div></div>' +
        '<div><div class="mob-legende">Facturé</div><div class="mob-ca__val mob-ca__val--2 mono">' + K.euros(ca.facture) + '</div></div></div>' +
      '<div class="jauge" role="img" aria-label="Encaissé ' + K.euros(ca.encaisse) + ', engagé ' + K.euros(ca.engage) + '">' +
        '<div class="jauge__engage" style="width:' + pc(ca.engage) + '"></div><div class="jauge__encaisse" style="width:' + pc(ca.encaisse) + '"></div>' +
        ca.jalons.map(function (j) { return '<div class="jauge__repere' + (j.vise ? ' jauge__repere--vise' : '') + '" style="left:' + pc(j.seuil) + '"></div>'; }).join('') +
      '</div>' +
      (prochain ? '<p class="mob-message' + (prochain.etat === 'alerte' ? ' mob-message--alerte' : '') + '">Prochain seuil : ' + esc(prochain.libelle) + ', encore <span class="mono">' + K.euros(prochain.reste) + '</span></p>'
        : '<p class="mob-message mob-message--alerte">Tous les seuils sont dépassés.</p>') +
      '<ul class="mob-liste mob-liste--serree">' + ca.jalons.map(function (j) {
        var cls = j.etat === 'depasse' ? 'statut--ko' : j.etat === 'alerte' ? 'statut--alerte' : 'statut--ok';
        return '<li><div class="mob-ligne__tete"><span>' + (j.vise ? '<strong>' + esc(j.libelle) + '</strong>' : esc(j.libelle)) + '</span><span class="mono">' + K.euros(j.seuil) + '</span></div>' +
          '<div class="mob-ligne__tete mob-legende"><span>' + (j.reste >= 0 ? 'reste ' + K.euros(j.reste) : 'dépassé de ' + K.euros(-j.reste)) + '</span>' +
          '<span class="statut ' + cls + '">' + (j.etat === 'depasse' ? 'dépassé' : j.etat === 'alerte' ? '≥ ' + ca.alertePct + ' %' : 'sous le seuil') + '</span></div></li>';
      }).join('') + '</ul>';

    // 5. Affaires en cours par statut (barres)
    var actifs = t.parStatut.filter(function (x) { return x.actif; });
    var max = Math.max.apply(null, actifs.map(function (x) { return x.nombre; }).concat([1]));
    var statuts = '<div class="mob-barres">' + actifs.map(function (x) {
      return '<div class="mob-barre"><span>' + esc(x.statut) + '</span><span class="mob-barre__piste"><span style="width:' + (x.nombre / max * 100).toFixed(1) + '%"></span></span><span class="mono">' + x.nombre + '</span></div>';
    }).join('') + '</div>';

    // 6. URSSAF : une ligne par période
    var urssaf = '<ul class="mob-liste mob-liste--serree">' + f.periodes.map(function (p) {
      var total = p.total === null || p.total === undefined ? '—' : K.euros(p.total);
      return '<li><div class="mob-ligne__tete"><strong>' + esc(p.libelle) + '</strong><span class="statut ' + (ETATS_DECL[p.etat] || 'statut--neutre') + '">' + esc(p.etat) + '</span></div>' +
        '<div class="mob-legende">CA <span class="mono">' + (p.ca === null || p.ca === undefined ? '—' : K.euros(p.ca)) + '</span> · à payer ≈ <span class="mono">' + total + '</span>' +
        (p.echeance ? ' · avant le <span class="mono">' + jour(p.echeance) + '</span>' : '') + '</div></li>';
    }).join('') + (f.cfe ? '<li><div class="mob-ligne__tete"><strong>CFE ' + f.cfe.annee + '</strong><span class="statut ' + (f.cfe.etat === 'payée' ? 'statut--ok' : f.cfe.etat === 'en retard' ? 'statut--ko' : f.cfe.etat === 'à payer' ? 'statut--alerte' : 'statut--neutre') + '">' + esc(f.cfe.etat) + '</span></div>' +
      '<div class="mob-legende">' + (f.cfe.montant !== null ? (f.cfe.estime ? 'estimée ' : '') + '<span class="mono">' + K.euros(f.cfe.montant) + '</span> · ' : '') + (f.cfe.motif ? esc(f.cfe.motif) + ' · ' : '') + 'avant le <span class="mono">' + jour(f.cfe.echeance) + '</span></div></li>' : '') + '</ul>';

    el.innerHTML = '<div class="mob">' +
      '<div class="mob-tete"><div><div class="mob-surtitre">Tableau de bord</div><div class="mob-date">' + JOURS[maintenant.getDay()] + ' ' + maintenant.getDate() + ' ' + MOIS[maintenant.getMonth()] + '</div></div>' +
        '<button type="button" class="mob-actualiser" data-actualiser aria-label="Actualiser">' +
        '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>' +
      alertes + tuiles +
      carte('À faire cette semaine', aFaire, 'mob-afaire') +
      carte('Chiffre d\'affaires ' + ca.annee, caBloc, 'mob-ca') +
      (d.previsionnel ? carte('CA prévisionnel', '<ul class="mob-liste mob-liste--serree">' + d.previsionnel.annees.slice(0, 3).map(function (an) {
        var micro = an.seuils.filter(function (s) { return s.cle === 'seuil.micro_plafond'; })[0];
        var pire = an.seuils.filter(function (s) { return s.etat === 'depasse'; }).pop();
        return '<li><div class="mob-ligne__tete"><strong>' + an.annee + '</strong><span class="mono">' + K.euros(an.certain) + '</span></div>' +
          '<div class="mob-ligne__tete mob-legende"><span>+ potentiel ' + K.euros(an.potentiel) + '</span>' +
          (pire ? '<span class="statut statut--ko">' + esc(pire.libelle) + '</span>' : micro ? '<span class="statut statut--ok">marge ' + K.euros(Math.max(micro.seuil - an.certain, 0)) + '</span>' : '') + '</div></li>';
      }).join('') + '</ul>') : '') +
      carte('Affaires en cours', statuts) +
      carte('URSSAF ' + f.annee, urssaf) +
      '<p class="mob-pied">' + esc(d.etat ? d.etat.app + ' · v' + d.etat.version : '') + ' · données du ' + String(maintenant.getHours()).padStart(2, '0') + ':' + String(maintenant.getMinutes()).padStart(2, '0') + '<br>' +
        '<button type="button" class="mob-lien" data-vue-ordinateur>Version ordinateur</button> · ' +
        '<button type="button" class="mob-lien" data-theme-mobile>Thème : ' + (K.themeActuel() === 'neon' ? 'Néon Sunset' : 'Kompa') + '</button></p>' +
      '</div>';

    $('[data-actualiser]', el).addEventListener('click', function () { K.viderMemoire(); K.mobile(el); });
    $('[data-vue-ordinateur]', el).addEventListener('click', function () { K.basculerVue('ordinateur'); });
    $('[data-theme-mobile]', el).addEventListener('click', function () {
      K.choisirTheme(K.themeActuel() === 'neon' ? 'kompa' : 'neon');
      this.textContent = 'Thème : ' + (K.themeActuel() === 'neon' ? 'Néon Sunset' : 'Kompa');
    });
  }

  K.mobile = function (el) {
    el.innerHTML = '<div class="mob"><div class="mob-tete"><div><div class="mob-surtitre">Tableau de bord</div></div></div><p class="mob-vide">Calcul des indicateurs…</p></div>';
    K.charger('accueil', 'apiAccueil', [], function (d) { rendre(el, d); },
      function (e) { el.innerHTML = '<div class="mob">' + K.bandeauErreur(e) + '<p class="mob-pied"><button type="button" class="mob-lien" data-reessayer>Réessayer</button></p></div>'; $('[data-reessayer]', el).addEventListener('click', function () { K.mobile(el); }); });
  };
})();
</script>
</body>
